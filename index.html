ng statements is FALSE with respect to the passage?",options:["The government charges tax on both earned income and unearned income.", "The Central Board of Direct Taxes is regulated under Central Board of Tax Act, 1963.", "The income tax was first put in place in India during British ruling.", "The term \u2018tax\u2019 simply means \u2018to access the worth of something\u2019.", "None of these"],correct:1,explanation:"Option (b) is incorrect. For option (a), refer to the lines, \u201cIncome tax is defined as the annual charge levied on both earned income (wages, salaries or commission) and unearned income like dividends, interest or rent.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45014,setId:'set4',section:"English Language",topic:"Reading Comprehension",difficulty:'Moderate-Hard',text:"Read the passage and answer. Passage: The word \u2018tax\u2019 is derived from the Latin word taxare or taxo. It means \u2018to assess the worth of something\u2019. Taxes are imposed by government for the use and service of the State. They are levied and collected by the State for the purchase or sale of merchandise or a service. Taxes provide revenue to the state, and is therefore one of the most significant aspects of any system of administration by any form of government. The income tax as we know today was first introduced in India in 1860 by the British. It was introduced to compensate for the losses sustained by the government due to the rebellion of 1857. Income tax is defined as the annual charge levied on both earned income (wages, salaries or commission) and unearned income like dividends, interest or rent. In addition to financing a government\u2019s operations, progressive income taxation is designed to distribute wealth creation more evenly in a population and to serve as buffer in case of fluctuations in the economic cycle. The Income Tax Act was passed in India in 1886, and there have been constant revisions and refinements in the Act since then. After the first World War, a new Income Tax Act was passed, in 1918, again to counter the residual effects of economic devastation caused by the war. This income tax Act was in place till 1922, when it was replaced by another Act. After 40 years, and 15 years after India gained freedom from the British, the income tax Act was _______________again. The current Income Tax Act has been adopted in 1961, and bought into force with effect from April 1, 1962. It encompasses the whole of India. The Central Board of Revenue bifurcated and created a separate Board for Direct Taxes called as the Central Board of Direct Taxes under the aegis of Central Board of Revenue Act, 1963. Question: Which of the following words is an antonym of \u2018constant\u2019 as highlighted in the passage?",options:["fitful", "perpetual", "prevalent", "bombast", "entrust"],correct:0,explanation:"\u2018Fitful\u2019 is an antonym of \u2018constant\u2019. (a) fitful: active or occurring spasmodically or intermittently; not regular or steady. (b) perpetual: never ending or changing. (c) prevalent: widespread in a particular area or at a particular time. (d) bombast: high-sounding language with little meaning, used to impress people. (e) entrust: assign the responsibility for doing something to (someone). 23 adda247.com/defence | www.sscadda.com | www.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45015,setId:'set4',section:"English Language",topic:"Spelling/Vocabulary",difficulty:'Moderate-Hard',text:"Four words are highlighted; find the one that is incorrect or wrongly spelt. Local observatory alerted residents that there would be a dust strom the next day.",options:["observatory", "alerted", "residents", "strom", "No Error"],correct:3,explanation:"the incorrect word is \u2018strom\u2019, which should be \u2018storm\u2019.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45016,setId:'set4',section:"English Language",topic:"Spelling/Vocabulary",difficulty:'Moderate-Hard',text:"Four words are highlighted; find the one that is incorrect or wrongly spelt. A more plosible explanation would seem to be that people are fed up with the Conservative government.",options:["plosible", "explanation", "conservative", "government", "No Error"],correct:0,explanation:"The incorrect word is \u2018plosible\u2019, which should be, \u2018plausible\u2019. Plausible: seeming reasonable or probable.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45017,setId:'set4',section:"English Language",topic:"Spelling/Vocabulary",difficulty:'Moderate-Hard',text:"Four words are highlighted; find the one that is incorrect or wrongly spelt. The rise in unemployment is seen as indicative of a new economic resession.",options:["unemployment", "indicative", "economic", "resession", "No Error"],correct:3,explanation:"The incorrect word is \u2018resession\u2019, which should be, \u2018recession\u2019.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45018,setId:'set4',section:"English Language",topic:"Spelling/Vocabulary",difficulty:'Moderate-Hard',text:"Four words are highlighted; find the one that is incorrect or wrongly spelt. Although Janet is not a great singer, she is a dextrous guitarist who can play a song after hearing it only once.",options:["although", "dextrous", "guitarist", "hearing", "No Error"],correct:1,explanation:"\u2018Dextrous\u2019 is incorrectly spelt here and the correct word is \u2018dexterous\u2019. Word: dexterous (also spelled as \"dextrous\") Part of Speech: Adjective Definition: The word \"dexterous\" refers to someone who is skilful, adept, or clever in performing tasks with their hands or in dealing with situations requiring physical or mental coordination. It implies a high level of manual or mental skill, agility, or deftness.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45019,setId:'set5',section:"English Language",topic:"Spelling/Vocabulary",difficulty:'Moderate-Hard',text:"Four words are highlighted; find the one that is incorrect or wrongly spelt. Climate change has a devastating empact on people and our planet, a fact that is now well proved by the frequent extreme weather conditions over the last decade across the world",options:["devastating", "empact", "frequent", "weather", "No Error"],correct:1,explanation:"\u2018empact\u2019 is incorrectly spelt here and the correct word is \u2018impact\u2019. Word: impact Part of Speech: Noun or Verb Definition: As a Noun: Impact refers to the forceful contact or collision between two objects or surfaces. In a broader sense, it denotes a strong effect or influence that one thing has on another, causing significant change or consequences.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45020,setId:'set5',section:"English Language",topic:"Sentence Improvement",difficulty:'Moderate-Hard',text:"A section of the sentence is underlined/highlighted; choose the option that improves it or 'No improvement'. This course examines the role advertising is playing economically, culturally, and socially throughout history.",options:["will play", "will be playing", "has been playing", "has played", "No improvement required"],correct:3,explanation:"The sentence talks about the role of advertising historically. Thus, the action advertising played would be in past tense, and consequently, option (d) would be correct. \u201cHas been playing\u201d cannot be used, as \u201cthroughout history\u201d cannot include the present, and any continuous tense action includes the present.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45021,setId:'set5',section:"English Language",topic:"Sentence Improvement",difficulty:'Moderate-Hard',text:"A section of the sentence is underlined/highlighted; choose the option that improves it or 'No improvement'. A democratic, peaceful, well-governed nation state is a blessing which should not be casual throw away.",options:["cannot be casual throw", "cannot not be casually throw", "should not be casually thrown", "will not be casual throw", "No improvement required"],correct:2,explanation:"To describe the verb \u201cthrow\u201d, an adverb has to be used. Thus, \u201ccasual\u201d must be changed to \u201ccasually\u201d. Furthermore, with \u201cbe\u201d, a verb of the perfect tense should be used. So, \u201cthrow\u201d must be replaced with \u201cthrown\u201d. Thus, option (c) is the correct answer.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45022,setId:'set5',section:"English Language",topic:"Sentence Improvement",difficulty:'Moderate-Hard',text:"A section of the sentence is underlined/highlighted; choose the option that improves it or 'No improvement'. The costs of bad policy are spread across the public by large, making it harder for people to organise.",options:["spread within the public by large", "spread across the public at large", "spread across the public from large", "spread beyond the public by large", "No improvement required"],correct:1,explanation:"The given sentence contains is erroneous as \u201cby large\u201d is incorrectly used in place of \u201cat large\u201d. By large\u201d is not a good collocation and carries no meaning, and thus makes the sentence incoherent. \u201cAt large\u201d, however, defined as \u201cas a whole; in general,\u201d completes the context of the sentence and is thus the required correction.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45023,setId:'set5',section:"English Language",topic:"Sentence Improvement",difficulty:'Moderate-Hard',text:"A section of the sentence is underlined/highlighted; choose the option that improves it or 'No improvement'. The gymnast hopes she can reprise her perfect performance in next week\u2019s competition.",options:["they can reprise their", "he can reprise his", "she can reprise their", "he can reprise their", "No improvement required"],correct:4,explanation:"No improvement is needed in the sentence as it is already grammatically correct, and thus, option (e) is the correct answer.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45024,setId:'set5',section:"English Language",topic:"Sentence Improvement",difficulty:'Moderate-Hard',text:"A section of the sentence is underlined/highlighted; choose the option that improves it or 'No improvement'. The traffic downtown is awful, with most lanes having being at a standstill for hours.",options:["had being a standstill", "having been at a standstill", "had been at a standstill", "had being at a standstill", "No improvement required"],correct:1,explanation:"\u201cHaving being\u201d should be followed with another verb in its first form. As that is not the case, \u201chaving been\u201d should be used instead, as \u201chad being a standstill\u201d and \u201chad being at a standstill\u201d are grammatically incorrect, and \u201chad been\u201d indicates that the action occurred sometime in the past, while the sentence is in the present tense and so is the action.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45025,setId:'set5',section:"English Language",topic:"Cloze Test",difficulty:'Moderate-Hard',text:"Fill the blank in the passage: Passage (blanks marked by letters). For each blank, five options are given. Find out the appropriate word which fits the blank appropriately. Medicinal plants have been used in healthcare since time______________ (A). Studies have been carried out globally to verify their ______________ (B) and some of the findings have led to the production of plant-based medicines. The emphasis on the use of medicinal plants had ______________ (C) been placed on the treatment rather than prevention of diseases. However, there exists in the literature considerable report in recent times on research work on the use of medicinal plants and their constituents in disease prevention. A Group defined Traditional Medicine as the sum total of all knowledge and practices, whether ______________ (D) or not, used in diagnosis, prevention and _______________ (E) of physical, mental, or social imbalance and relying exclusively on practical experience and observation handed down from generation to generation, whether ______________ (F) or in writing Question: Which of the following words will fit in the given blank (A)?",options:["affirming", "scramble", "conservative", "merging", "immemorial"],correct:4,explanation:"The concerned sentence is mentioning that medicinal plants have been used in healthcare for a very long time ago. Therefore, the correct word for the blank is \u2018immemorial\u2019. (a) affirming: state emphatically or publicly. (b) scramble: move hurriedly or clumsily from or into a particular place or position. (c) conservative: averse to change or innovation and holding traditional values.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45026,setId:'set5',section:"English Language",topic:"Cloze Test",difficulty:'Moderate-Hard',text:"Fill the blank in the passage: Passage (blanks marked by letters). For each blank, five options are given. Find out the appropriate word which fits the blank appropriately. Medicinal plants have been used in healthcare since time______________ (A). Studies have been carried out globally to verify their ______________ (B) and some of the findings have led to the production of plant-based medicines. The emphasis on the use of medicinal plants had ______________ (C) been placed on the treatment rather than prevention of diseases. However, there exists in the literature considerable report in recent times on research work on the use of medicinal plants and their constituents in disease prevention. A Group defined Traditional Medicine as the sum total of all knowledge and practices, whether ______________ (D) or not, used in diagnosis, prevention and _______________ (E) of physical, mental, or social imbalance and relying exclusively on practical experience and observation handed down from generation to generation, whether ______________ (F) or in writing Question: Which of the following words will fit in the given blank (B)?",options:["efficacy", "obedience", "extension", "alliance", "heinous"],correct:0,explanation:"The sentence is mentioning that many studies have been carried out globally to verify their effectiveness. Therefore, the correct word for the given blank is \u2018efficacy\u2019. (a) efficacy: the ability to produce a desired or intended result. (b) obedience: compliance with an order, request, or law or submission to another's authority. (c) extension: a part that is added to something to enlarge or prolong it.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45027,setId:'set5',section:"English Language",topic:"Cloze Test",difficulty:'Moderate-Hard',text:"Fill the blank in the passage: Passage (blanks marked by letters). For each blank, five options are given. Find out the appropriate word which fits the blank appropriately. Medicinal plants have been used in healthcare since time______________ (A). Studies have been carried out globally to verify their ______________ (B) and some of the findings have led to the production of plant-based medicines. The emphasis on the use of medicinal plants had ______________ (C) been placed on the treatment rather than prevention of diseases. However, there exists in the literature considerable report in recent times on research work on the use of medicinal plants and their constituents in disease prevention. A Group defined Traditional Medicine as the sum total of all knowledge and practices, whether ______________ (D) or not, used in diagnosis, prevention and _______________ (E) of physical, mental, or social imbalance and relying exclusively on practical experience and observation handed down from generation to generation, whether ______________ (F) or in writing Question: Which of the following words will fit in the given blank (C)?",options:["deceive", "coward", "hitherto", "rebel", "assign"],correct:2,explanation:"The sentence is mentioning that until now the emphasis on the use of medicinal plants had been placed on the treatment. Therefore, the correct word for the blank is \u2018hitherto\u2019. (a) deceive: deliberately cause (someone) to believe something that is not true, especially for personal gain. (b) coward: a person who is contemptibly lacking in the courage to do or endure dangerous or unpleasant things.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45028,setId:'set5',section:"English Language",topic:"Cloze Test",difficulty:'Moderate-Hard',text:"Fill the blank in the passage: Passage (blanks marked by letters). For each blank, five options are given. Find out the appropriate word which fits the blank appropriately. Medicinal plants have been used in healthcare since time______________ (A). Studies have been carried out globally to verify their ______________ (B) and some of the findings have led to the production of plant-based medicines. The emphasis on the use of medicinal plants had ______________ (C) been placed on the treatment rather than prevention of diseases. However, there exists in the literature considerable report in recent times on research work on the use of medicinal plants and their constituents in disease prevention. A Group defined Traditional Medicine as the sum total of all knowledge and practices, whether ______________ (D) or not, used in diagnosis, prevention and _______________ (E) of physical, mental, or social imbalance and relying exclusively on practical experience and observation handed down from generation to generation, whether ______________ (F) or in writing Question: Which of the following words will fit in the given blank (D)?",options:["radical", "explicable", "moderate", "amend", "visual"],correct:1,explanation:"The concerned sentence is mentioning that a Group defined Traditional Medicine as the sum total of all knowledge and practices, whether explicable or not, used in diagnosis, prevention and elimination of physical, mental, or social imbalance. Therefore, the correct word for the blank is \u2018explicable\u2019. (a) radical: relating to or affecting the fundamental nature of something; far-reaching or thorough.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45029,setId:'set5',section:"English Language",topic:"Cloze Test",difficulty:'Moderate-Hard',text:"Fill the blank in the passage: Passage (blanks marked by letters). For each blank, five options are given. Find out the appropriate word which fits the blank appropriately. Medicinal plants have been used in healthcare since time______________ (A). Studies have been carried out globally to verify their ______________ (B) and some of the findings have led to the production of plant-based medicines. The emphasis on the use of medicinal plants had ______________ (C) been placed on the treatment rather than prevention of diseases. However, there exists in the literature considerable report in recent times on research work on the use of medicinal plants and their constituents in disease prevention. A Group defined Traditional Medicine as the sum total of all knowledge and practices, whether ______________ (D) or not, used in diagnosis, prevention and _______________ (E) of physical, mental, or social imbalance and relying exclusively on practical experience and observation handed down from generation to generation, whether ______________ (F) or in writing Question: Which of the following words will fit in the given blank (E)?",options:["clinch", "overlook", "provoke", "elimination", "emerge"],correct:3,explanation:"The concerned sentence is mentioning that a Group defined Traditional Medicine as the sum total of all knowledge and practices, whether explicable or not, used in diagnosis, prevention and elimination of physical, mental, or social imbalance. Therefore, the correct word for the blank is \u2018elimination\u2019. (a) clinch: confirm or settle (a contract or bargain). (b) overlook: fail to notice.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45030,setId:'set5',section:"English Language",topic:"Cloze Test",difficulty:'Moderate-Hard',text:"Fill the blank in the passage: Passage (blanks marked by letters). For each blank, five options are given. Find out the appropriate word which fits the blank appropriately. Medicinal plants have been used in healthcare since time______________ (A). Studies have been carried out globally to verify their ______________ (B) and some of the findings have led to the production of plant-based medicines. The emphasis on the use of medicinal plants had ______________ (C) been placed on the treatment rather than prevention of diseases. However, there exists in the literature considerable report in recent times on research work on the use of medicinal plants and their constituents in disease prevention. A Group defined Traditional Medicine as the sum total of all knowledge and practices, whether ______________ (D) or not, used in diagnosis, prevention and _______________ (E) of physical, mental, or social imbalance and relying exclusively on practical experience and observation handed down from generation to generation, whether ______________ (F) or in writing Question: Which of the following words will fit in the given blank (F)?",options:["verbally", "incumbency", "instantly", "dubiously", "allegedly"],correct:0,explanation:"The sentence is mentioning that relying exclusively on practical experience and observation handed down from generation to generation, whether verbally or in writing. Therefore, the correct word for the blank is \u2018verbally\u2019. 26 adda247.com/defence | www.sscadda.com | www.bankersadda.com | www.adda247.com (a) verbally: by means of words. (b) incumbency: the holding of an office or the period during which one is held.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45031,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"A 64 liters mixture contains milk and water in the ratio 3 : 1 respectively. If X liters of the mixture are taken out and replaced with 13 liters of water, then the quantity of water is 40% in the resultant mixture. Find X?",options:["16", "12", "15", "18", "24"],correct:1,explanation:"3 Sol. Quantity of milk = 64 \u00d7 4 = 48 kg 1 Quantity of water = 64 \u00d7 4 = 16 kg ATQ, 3X 4 48\u2212 X 4 16\u2212 +13 3 =2 384 \u2013 6X = 348 \u2013 3X 3X = 36 X = 12",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45032,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"Rs.4800 is invested in scheme X for two years at simple interest of 20% p.a. The interest received from scheme X is reinvested for two years in scheme Y which offers compound interest of",options:["Rs.503.8", "Rs.384", "Rs.472.4", "Rs.403.2", "Rs.655.2"],correct:3,explanation:"4800\u00d72\u00d720 Sol. Interest received from scheme X = = Rs. 1920 100 10\u00d710 Equivalent interest % of scheme Y = 10 + 10 + 100 = 21% 21 Interest received from scheme Y = 1920 \u00d7 100 = Rs.403.2",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45033,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"The ratio of speed of boat in still water to speed of stream is 6:1 respectively. If the upstream speed of boat 20 km/hr, then find the time taken by boat to cover 126 km in downstream?",options:["4.2 hours", "4.5 hours", "5.5 hours", "5 hours", "6 hours"],correct:1,explanation:"Let speed of boat in still water and speed of stream be 6x and 1x respectively. ATQ. 6x-1x=20 5x=20 x=4 Required time = 126/(7\u00d74)=4.5 hours",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45034,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"Train A can cross a pole in 16 seconds and can cross a 600 meters long platform in 36 seconds. Find time taken by train A to cross train B while running in same direction, if speed and length of train \u2013 B are 72 km/hr. and 640m respectively?",options:["112 seconds", "88 seconds", "138 seconds", "94 seconds", "105 seconds"],correct:0,explanation:"Let length and speed of train A be l meters and V m/sec respectively. ATQ, l 16 =V l = 16V ....(i) And, l+600 36 =V l = 36V \u2212 600 ...(ii) On solving (i) & (ii), we get V = 30, l = 480 5 Now, speed of train \u2013 B = 72 \u00d7 18 = 20 m/sec 480+640 Required time = 30\u221220 = 112 seconds 27 adda247.com/defence | www.sscadda.com | www.bankersadda.com | www.adda247.com",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45035,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"A and B started a business by investing of Rs. 32500 & Rs. 30000 respectively. After x months, B left the business. At the end of a year, the profit share of B is Rs 7200 out of total profit of Rs 22800. Find the value of x?",options:["9", "5", "8", "4", "6"],correct:4,explanation:"Profit ratio of A to B = 325 \u00d7 12 \u2236 300 \u00d7 x = 13 : x ATQ, 13 22800\u22127200 13 7200 15600 = x x 13 x = 7200 13 = 6 x=6 Solutions (36-40): For company P: Total number of employees= 2 \u00d7 1000 = 2000 Number of female employees= 2000 \u2212 1200 = 800 Similarly for other companies, Company Total number of Male employees employees P 2000 1200 Q 2 \u00d7 750 = 1500 800 R 2 \u00d7 1200 = 2400 1000 S 2 \u00d7 600 = 1200 400 T 2 \u00d7 900 = 1800 800 Female employees 800 150",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45036,setId:'set4',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate-Hard',text:"Line chart of average number of employees (P 1000, Q 750, R 1200, S 600, T 900) and number of male employees (P 1200, Q 800, R 1000, S 400, T 800) in five companies. Total employees = 2 x average number; Female = Total - Male. Note: Total employees = Male employees + Female employees P Q R S T Average number of employees Number of male employees Find the average number of female employees in companies Q & S together are how much more/less than average number of male employees in companies R & T together.",options:["350", "100", "150", "200", "250"],correct:2,explanation:"Average number of female employees in companies Q & S = Average number of male employees in companies R & T= 700+800 1000+800 2 2 = 750 = 900 Required difference = 900 \u2013 750 = 150",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45037,setId:'set4',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate-Hard',text:"Line chart of average number of employees (P 1000, Q 750, R 1200, S 600, T 900) and number of male employees (P 1200, Q 800, R 1000, S 400, T 800) in five companies. Total employees = 2 x average number; Female = Total - Male. Note: Total employees = Male employees + Female employees P Q R S T Average number of employees Number of male employees Find the respective ratio of male employees in companies Q & T together to the total number of female employees in companies P, Q and R together.",options:["29: 27", "27: 13", "13: 27", "16: 29", "29: 16"],correct:3,explanation:"Male employees in companies Q & T =800+800=1600 Total number of female employees in companies P, Q and R =(800+700+1400)=2900 Required ratio=1600:2900=16:29",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45038,setId:'set4',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate-Hard',text:"Line chart of average number of employees (P 1000, Q 750, R 1200, S 600, T 900) and number of male employees (P 1200, Q 800, R 1000, S 400, T 800) in five companies. Total employees = 2 x average number; Female = Total - Male. Note: Total employees = Male employees + Female employees P Q R S T Average number of employees Number of male employees If in company R, 25% of female and 50% male are graduates, then find the total number of employees who have done diploma. (Note: Employees are either graduates or diploma holders).",options:["1550", "1750", "1600", "1800", "Can\u2019t be determined"],correct:0,explanation:"50 Sol. Number of male diploma employees= 100 \u00d7 1000 = 500 Number of female diploma employees= 75 100 \u00d7 1400 = 1050 Required sum= 500 + 1050 = 1550",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45039,setId:'set4',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate-Hard',text:"Line chart of average number of employees (P 1000, Q 750, R 1200, S 600, T 900) and number of male employees (P 1200, Q 800, R 1000, S 400, T 800) in five companies. Total employees = 2 x average number; Female = Total - Male. Note: Total employees = Male employees + Female employees P Q R S T Average number of employees Number of male employees If in another company Z, male employees are 40% of the total employees in company P and female employees are 60% of the male employees in company Q, then find total employees in company Z.",options:["1140", "1280", "1360", "1040", "920"],correct:1,explanation:"40 Sol. Number of male employees in Z= 100 \u00d7 2000 = 800 60 Number of female employees in Z= 100 \u00d7 800 = 480 Required answer= 800 + 480 = 1280 28 adda247.com/defence | www.sscadda.com | www.bankersadda.com | www.adda247.com",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45040,setId:'set4',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate-Hard',text:"Line chart of average number of employees (P 1000, Q 750, R 1200, S 600, T 900) and number of male employees (P 1200, Q 800, R 1000, S 400, T 800) in five companies. Total employees = 2 x average number; Female = Total - Male. Note: Total employees = Male employees + Female employees P Q R S T Average number of employees Number of male employees The difference between total male employees and total female employees is closest to square of which of the following natural number?",options:["24", "22", "20", "26", "18 (e) 153"],correct:1,explanation:"Total male employees= 1200 + 800 + 1000 + 400 + 800 = 4200 Total female employees= 800 + 700 + 1400 + 800 + 1000 = 4700 Difference= 4700 \u2212 4200 = 500 Required number = 22 (222 = 484)",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45041,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"B alone can do a work in 15 days, while A, B & C together can do the same work in 5 days. If A alone takes 8 days less than C to complete the same work, then in how many days C can complete",options:["15 days", "20 days", "24 days", "18 days", "16 days"],correct:0,explanation:"Let C alone takes \u2018d\u2019 days to complete the work alone So, A takes (d \u2013 8) days to complete the work alone ATQ \u2013 1 + 1 (d\u22128) 15 2 1 15 1 1 +d=5 1 = d + (d\u22128) d2\u221223d + 60 = 0 d = 20 & d = 3 here vale of d can\u2019t be 3 3 So, Required days = 20 \u00d7 4 = 15 days",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45042,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"The ratio of cost price to marked price of an article is 7: 10 and when allows 25% discount, then he earns Rs.40. If shopkeeper earns 30% profit on selling the same article, then find difference between amount of profit earned and amount of discount on selling the article.",options:["Rs.96", "Rs.72", "Rs.120", "Rs.168", "Rs.144"],correct:0,explanation:"Let cost price & marked price of an article be Rs.70x and Rs.100x respectively Selling price of article = 100x \u00d7 75/100 = Rs. 75x ATQ, 70x + 40 = 75x x=8 So, cost price of article = 70x = Rs 560 Selling price of article = 75x = Rs.600 And marked price of article = 100x = Rs. 800 Now, new profit = 560 \u00d7 30/100 = Rs. 168 And new discount allowed = 800 \u2013 560 \u2013 168 = Rs. 72 Required difference = 168 \u2013 72 = Rs. 96",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45043,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"The average marks of 20 students of a class of is 45. If the marks of two more students Anil and Sunil are added, then the average increases by 3. If marks of Anil are 20 more than the marks of Sunil, then find the marks of Anil?",options:["68", "78", "72", "88", "84"],correct:3,explanation:"Total marks of 20 students = 20 \u00d7 45 = 900 ATQ, Let total marks of Sunil = x So, total marks of Anil = x + 20 920+2x 22 = 48 920 + 2x = 1056 2x = 136 x = 68 So, marks of Anil = 68 + 20 = 88 29 adda247.com/defence | www.sscadda.com | www.bankersadda.com | www.adda247.com",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45044,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"If diagonal of a square is 48\u221a2 cm and radius of a circle is 7/16th of the side of square, then find the difference between area of the square and area of the circle (in cm square)?",options:["540", "918", "665", "888", "892"],correct:1,explanation:"Let side of square be \u2018a\u2019 cm ATQ. a\u221a2 = 48\u221a2 a = 48 7 Radius of the circle = 48 \u00d7 16 = 21 cm 22 Area of the circle = 7 \u00d7 21 \u00d7 21 = 1386 cm2 Area of the square = 48 \u00d7 48 = 2304 cm2 Required difference = 2304 \u2212 1386 = 918 cm2",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45045,setId:'set4',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate-Hard',text:"The ratio of present age of P is to that of Q is 6 : 5 and P is 12 years older to R. If R is three years younger to Q, then find the sum of age (in years) of Q and R eight years hence will be?",options:["117", "103", "107", "111", "105"],correct:1,explanation:"Let present age of R = n years So, present age of P = (n + 12) years And Present age of Q = (n + 3) years ATQ \u2013 (n+12) (n+3) 6 =5 5n + 60 = 6n + 18 n = 42 Required sum = 42 + (42 + 3) + 8 \u00d7 2 = 103 years",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},

{id:45052,setId:'set5',section:"Quantitative Aptitude",topic:"Approximation",difficulty:'Moderate-Hard',text:"Find the approximate value of ?: (4.01)^? x fourth root(15.99) = (15.92)^2 / fourth root(16.01)",options:["2", "3", "4", "1", "5"],correct:1,explanation:"4 162 Sol. 4? \u00d7 \u221a16 = 4 \u221a16 256 4? \u00d7 2 = 2 4? = 64 4? = (4)3 ?=3",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},

{id:45055,setId:'set5',section:"Quantitative Aptitude",topic:"Approximation",difficulty:'Moderate-Hard',text:"Find the approximate value of ?: ? % of 1050.03 + 363.99 = (27.97)2",options:["60", "20", "50", "30", "40"],correct:4,explanation:"? Sol. 100 \u00d7 1050 + 364 = (28)2 ? 100 ? 100 ?= \u00d7 1050 = 784 \u2212 364 \u00d7 1050 = 420 420\u00d7100 1050 ? = 40 Solutions (56-60): Let people like only kiwi and only grapes is 2x & 5x respectively. 120 People like only apple = 5x \u00d7 100 = 6x 6x People like all the type of fruits = 6 = x 15 People like only grapes & apple together = 5 \u00d7 3 = 9 People like only apple & kiwi together = 15 5 \u00d72=6 ATQ.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45056,setId:'set5',section:"Quantitative Aptitude",topic:"Logical DI",difficulty:'Moderate-Hard',text:"There are 350 people in a group who like three (kiwi, grapes & apple) different types of fruits and 81 people like kiwi. The ratio of people who like only kiwi to only grapes is 2:5 and total people like only apple is 20% more than that people who like of only grapes. Total people like only kiwi and grape together are 15 and people like all the type of fruits is 6th of people like only apples. Ratio of people like only kiwi & grapes together, only grapes & apple together to only apple & kiwi together is 5:3:2 respectively. Find the number of people who like at least two types of fruits.",options:["50", "40", "55", "56", "60"],correct:0,explanation:"Number of people who like at least two types of fruits = 15 + 6 + 9 + 20 = 50",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45057,setId:'set5',section:"Quantitative Aptitude",topic:"Logical DI",difficulty:'Moderate-Hard',text:"There are 350 people in a group who like three (kiwi, grapes & apple) different types of fruits and 81 people like kiwi. The ratio of people who like only kiwi to only grapes is 2:5 and total people like only apple is 20% more than that people who like of only grapes. Total people like only kiwi and grape together are 15 and people like all the type of fruits is 6th of people like only apples. Ratio of people like only kiwi & grapes together, only grapes & apple together to only apple & kiwi together is 5:3:2 respectively. Find the number of people who doesn\u2019t like any fruits.",options:["25", "20", "50", "40", "60"],correct:3,explanation:"Number of people who doesn\u2019t like any fruits = 350 \u2212 (40 + 120 + 100 + 15 + 6 + 9 + 20) = 350 \u2212 310 = 40",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45058,setId:'set5',section:"Quantitative Aptitude",topic:"Logical DI",difficulty:'Moderate-Hard',text:"There are 350 people in a group who like three (kiwi, grapes & apple) different types of fruits and 81 people like kiwi. The ratio of people who like only kiwi to only grapes is 2:5 and total people like only apple is 20% more than that people who like of only grapes. Total people like only kiwi and grape together are 15 and people like all the type of fruits is 6th of people like only apples. Ratio of people like only kiwi & grapes together, only grapes & apple together to only apple & kiwi together is 5:3:2 respectively. Number of people who like only grapes & apple together is what percentage number of people who like only kiwi?",options:["22.5%", "12.5%", "18.5%", "24.5%", "16.5%"],correct:0,explanation:"9 Sol. Required percentage = 40 \u00d7 100 = 22.5%",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45059,setId:'set5',section:"Quantitative Aptitude",topic:"Logical DI",difficulty:'Moderate-Hard',text:"There are 350 people in a group who like three (kiwi, grapes & apple) different types of fruits and 81 people like kiwi. The ratio of people who like only kiwi to only grapes is 2:5 and total people like only apple is 20% more than that people who like of only grapes. Total people like only kiwi and grape together are 15 and people like all the type of fruits is 6th of people like only apples. Ratio of people like only kiwi & grapes together, only grapes & apple together to only apple & kiwi together is 5:3:2 respectively. Find the ratio between number of people who like only kiwi to that of only grapes & kiwi together.",options:["4:3", "8:5", "5:3", "8:3", "None of these"],correct:3,explanation:"Required ratio = 40: 15 = 8: 3",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45060,setId:'set5',section:"Quantitative Aptitude",topic:"Logical DI",difficulty:'Moderate-Hard',text:"There are 350 people in a group who like three (kiwi, grapes & apple) different types of fruits and 81 people like kiwi. The ratio of people who like only kiwi to only grapes is 2:5 and total people like only apple is 20% more than that people who like of only grapes. Total people like only kiwi and grape together are 15 and people like all the type of fruits is 6th of people like only apples. Ratio of people like only kiwi & grapes together, only grapes & apple together to only apple & kiwi together is 5:3:2 respectively. Find the difference between number of people who like grapes and apples.",options:["10", "11", "9", "12", "14"],correct:1,explanation:"Number of people like grapes = 100+15+9+20=144 Number of people like apple = 120+20+6+9=155 Required difference = 155 \u2013 144 = 11 32 adda247.com/defence | www.sscadda.com | www.bankersadda.com | www.adda247.com Solutions (61-65): For A, Let the total watches and laptops sold by A be 8x and 5x respectively.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},

{id:44001,setId:'set5',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully and answer the questions given below: Ten persons-A, B, C, D, E, F, G, H, I and J work in a company in three departments \u2013 HR, Marketing and Sales but not necessarily in the same order. Different number of persons works in each department. A works with E but not in sales department. C doesn\u2019t work with E. B works with neither E nor C. F neither works in marketing nor HR department. H works with F but not with B. G works with J but not with H and B. D doesn\u2019t work with J and I. Only in marketing department even number of persons works. How many persons work in HR department?",options:["Three", "One", "Seven", "Five", "Can\u2019t be determined"],correct:3,explanation:"Departments: HR = A, E, G, I, J; Sales = C, F, H; Marketing = B, D.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44002,setId:'set5',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully and answer the questions given below: Ten persons-A, B, C, D, E, F, G, H, I and J work in a company in three departments \u2013 HR, Marketing and Sales but not necessarily in the same order. Different number of persons works in each department. A works with E but not in sales department. C doesn\u2019t work with E. B works with neither E nor C. F neither works in marketing nor HR department. H works with F but not with B. G works with J but not with H and B. D doesn\u2019t work with J and I. Only in marketing department even number of persons works. In which among the following department does D work?",options:["HR", "Sales", "Marketing", "Either HR or Sales", "Either Sales or Marketing"],correct:2,explanation:"Departments: HR = A, E, G, I, J; Sales = C, F, H; Marketing = B, D.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44003,setId:'set5',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully and answer the questions given below: Ten persons-A, B, C, D, E, F, G, H, I and J work in a company in three departments \u2013 HR, Marketing and Sales but not necessarily in the same order. Different number of persons works in each department. A works with E but not in sales department. C doesn\u2019t work with E. B works with neither E nor C. F neither works in marketing nor HR department. H works with F but not with B. G works with J but not with H and B. D doesn\u2019t work with J and I. Only in marketing department even number of persons works. Four of the following five are alike in a certain way and thus form a group. Who among the following does not belong to the group?",options:["A", "C", "I", "G", "J"],correct:1,explanation:"Departments: HR = A, E, G, I, J; Sales = C, F, H; Marketing = B, D.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44004,setId:'set5',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully and answer the questions given below: Ten persons-A, B, C, D, E, F, G, H, I and J work in a company in three departments \u2013 HR, Marketing and Sales but not necessarily in the same order. Different number of persons works in each department. A works with E but not in sales department. C doesn\u2019t work with E. B works with neither E nor C. F neither works in marketing nor HR department. H works with F but not with B. G works with J but not with H and B. D doesn\u2019t work with J and I. Only in marketing department even number of persons works. Which among the following statement(s) is/are true? I. The sum of the persons works in Sales and Marketing department is 5 II. C works in sales department III. A and B work in the same department",options:["Both I and II", "Both II and III", "Only I", "Both I and III", "Only III"],correct:0,explanation:"Departments: HR = A, E, G, I, J; Sales = C, F, H; Marketing = B, D.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44005,setId:'set5',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully and answer the questions given below: Ten persons-A, B, C, D, E, F, G, H, I and J work in a company in three departments \u2013 HR, Marketing and Sales but not necessarily in the same order. Different number of persons works in each department. A works with E but not in sales department. C doesn\u2019t work with E. B works with neither E nor C. F neither works in marketing nor HR department. H works with F but not with B. G works with J but not with H and B. D doesn\u2019t work with J and I. Only in marketing department even number of persons works. If the monthly salary of each person works in Sales department is Rs. 45000 and the monthly salary of each person works in Marketing department is Rs 35000 then find the sum of the salary of C, B and H?",options:["Rs 135000", "Rs 110000", "Rs 125000", "Rs 155000", "Rs 126000"],correct:2,explanation:"Departments: HR = A, E, G, I, J; Sales = C, F, H; Marketing = B, D.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44006,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"If in the given word \u201cNEUROPATHY\u201d all the letters which comes before Q in the alphabetical series are changed to their immediate succeeding letter and all the letters which comes after Q in the alphabetical series are changed to their immediately preceding letter. Then all the repeated letters are eliminated and the remaining letters are arranged in alphabetical order from left to right then find the letter which is 4th from the right end in the word thus formed?",options:["S", "P", "I", "B", "T"],correct:1,explanation:"Given word- NEUROPATHY After rearrangement- OFTQPQBSIX Alphabetical order- BFIOPSTX Marketing B, D",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44007,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully to answer the given questions: Six persons are arranged according to their height in descending order from left to right. At most two persons shorter to D who is shorter to the one whose height is 140cm. Height of the persons taller to B is in odd number. D is taller to A but shorter to C. B is shorter to C who is not the tallest among all. The one who is just shorter to D is 15cm shorter to B. E is shorter to both F and A. How many persons in between A and C?",options:["Two", "Three", "One", "Either one or three", "Four"],correct:0,explanation:"Height order (tallest to shortest): F > C > B > D > A > E.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44008,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully to answer the given questions: Six persons are arranged according to their height in descending order from left to right. At most two persons shorter to D who is shorter to the one whose height is 140cm. Height of the persons taller to B is in odd number. D is taller to A but shorter to C. B is shorter to C who is not the tallest among all. The one who is just shorter to D is 15cm shorter to B. E is shorter to both F and A. What may be the possible height of D?",options:["144cm", "127cm", "123cm", "111cm", "147cm"],correct:1,explanation:"Height order (tallest to shortest): F > C > B > D > A > E.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44009,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully to answer the given questions: Six persons are arranged according to their height in descending order from left to right. At most two persons shorter to D who is shorter to the one whose height is 140cm. Height of the persons taller to B is in odd number. D is taller to A but shorter to C. B is shorter to C who is not the tallest among all. The one who is just shorter to D is 15cm shorter to B. E is shorter to both F and A. The numbers of persons shorter to C is twice to the numbers of persons taller to _____.",options:["A", "D", "B", "E", "None of these"],correct:2,explanation:"Height order (tallest to shortest): F > C > B > D > A > E.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44010,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully to answer the given questions: Six persons are arranged according to their height in descending order from left to right. At most two persons shorter to D who is shorter to the one whose height is 140cm. Height of the persons taller to B is in odd number. D is taller to A but shorter to C. B is shorter to C who is not the tallest among all. The one who is just shorter to D is 15cm shorter to B. E is shorter to both F and A. How many persons taller to F?",options:["Three", "More than four", "One", "None", "Two"],correct:3,explanation:"Height order (tallest to shortest): F > C > B > D > A > E.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},

{id:44012,setId:'set2',section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: All rock is resist Only a few resist is red Some red is not real Conclusions: I. All resist being red is a possibility II. No real being rock is a possibility",options:["If only I follows", "If only II follows", "If neither I nor II follows", "If both I and II follow", "If either I or II follows"],correct:1,explanation:"Solutions (28-30):",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44013,setId:'set2',section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: Only a few skirt is jeans No jeans is shirt All dress is shirt Conclusions: I. Some dress is not jeans II. No skirt is shirt",options:["If only I follows", "If only II follows", "If neither I nor II follows", "If both I and II follow", "If either I or II follows"],correct:0,explanation:"Solutions (14-18):",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44014,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully to answer the given questions: Eight persons viz. P, Q, R, S, T, U, V and W sit around a square table but not necessarily in the same order. Four persons sit at each corner face outside while rest four sit in the each of the middle side and face inside. R sits 3rd to the right of T. One person sits between R and U who does not sit near T. Both S and V face each other. V sits immediate left of Q. P and S are not an immediate neighbour. How many persons sit between U and W when counted to the left of U?",options:["Four", "One", "Two", "Three", "None"],correct:1,explanation:"See the published solution for this paper; correct option is (b).",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44015,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully to answer the given questions: Eight persons viz. P, Q, R, S, T, U, V and W sit around a square table but not necessarily in the same order. Four persons sit at each corner face outside while rest four sit in the each of the middle side and face inside. R sits 3rd to the right of T. One person sits between R and U who does not sit near T. Both S and V face each other. V sits immediate left of Q. P and S are not an immediate neighbour. Which of the following pair of persons face outside?",options:["T, W", "R, S", "U, Q", "P, Q", "None of these"],correct:2,explanation:"See the published solution for this paper; correct option is (c).",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44016,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully to answer the given questions: Eight persons viz. P, Q, R, S, T, U, V and W sit around a square table but not necessarily in the same order. Four persons sit at each corner face outside while rest four sit in the each of the middle side and face inside. R sits 3rd to the right of T. One person sits between R and U who does not sit near T. Both S and V face each other. V sits immediate left of Q. P and S are not an immediate neighbour. What is the position of S with respect to Q?",options:["5th to the left", "3rd to the left", "4th to the right", "2nd to the left", "None of these"],correct:0,explanation:"See the published solution for this paper; correct option is (a).",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44017,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully to answer the given questions: Eight persons viz. P, Q, R, S, T, U, V and W sit around a square table but not necessarily in the same order. Four persons sit at each corner face outside while rest four sit in the each of the middle side and face inside. R sits 3rd to the right of T. One person sits between R and U who does not sit near T. Both S and V face each other. V sits immediate left of Q. P and S are not an immediate neighbour. Four of the following five are alike in a certain way and hence form a group. Who of the following does not belong to that group?",options:["U", "R", "W", "Q", "S"],correct:4,explanation:"See the published solution for this paper; correct option is (e).",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44018,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully to answer the given questions: Eight persons viz. P, Q, R, S, T, U, V and W sit around a square table but not necessarily in the same order. Four persons sit at each corner face outside while rest four sit in the each of the middle side and face inside. R sits 3rd to the right of T. One person sits between R and U who does not sit near T. Both S and V face each other. V sits immediate left of Q. P and S are not an immediate neighbour. Which of the following statement is true? I. Q does not sit in the middle of the side II. P and V are immediate neighbour III. S sits immediate right of U",options:["Only III", "Both II and III", "Only I", "Both I and II", "All I, II and III"],correct:2,explanation:"See the published solution for this paper; correct option is (c).",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44019,setId:'set2',section:"Reasoning Ability",topic:"Coding/Word",difficulty:'Moderate',text:"If we form a four-letter meaningful word by using the first, third, fifth and eight letter from the left end of the word \u2018PROGRAMMING\u2019, then which of the following will be the second left letter of the meaningful word thus formed. If more than one word is formed mark Z as your answer. If no meaningful word is formed, mark X as your answer?",options:["R", "P", "O", "X", "Z"],correct:2,explanation:"Meaningful word - ROMP Solutions (20-22):",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},

{id:44023,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully and answer the questions given below: A certain number of persons sit in a row and all of them face north direction. Two persons sit between P and Q. U sits fifth to the left of Q. The number of persons sit between U and Q is one more than the number of persons sit between Q and M. M sits to the right of P. R sits exactly between Q and M but not adjacent to P. T sits fourth to the right of R. The number of persons sits between M and T is same as between N and T. N is the only neighbor of K. The number of persons sit to the right of K is three less than the number of persons sits to the left of U. One person sits between Q and L. How many persons sit in the row?",options:["17", "19", "18", "22", "21"],correct:2,explanation:"Row arrangement (left to right): U, P, L, Q, R, M, T, N, K.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},

{id:44025,setId:'set2',section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Study the following information carefully and answer the questions given below: A certain number of persons sit in a row and all of them face north direction. Two persons sit between P and Q. U sits fifth to the left of Q. The number of persons sit between U and Q is one more than the number of persons sit between Q and M. M sits to the right of P. R sits exactly between Q and M but not adjacent to P. T sits fourth to the right of R. The number of persons sits between M and T is same as between N and T. N is the only neighbor of K. The number of persons sit to the right of K is three less than the number of persons sits to the left of U. One person sits between Q and L. Which among the following statement is not true?",options:["U sits fourth from one of the ends", "K sits at the extreme end", "T sits to the right of P", "More than seven persons sit between P and M", "All are true"],correct:3,explanation:"Row arrangement (left to right): U, P, L, Q, R, M, T, N, K.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},

{id:44036,setId:'set2',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate',text:"Pie chart: distribution of population (literate + illiterate) in five cities, total population of all five cities = 10000. City shares: A 13%, B 25%, C 19%, D 23%, E 20%. Ratio of literate to illiterate: A 6:7, B 3:2, C 11:8, D 11:12, E 3:5. In city F, total literate population is 20% more than that of in city E and total illiterate population is 25% more than total illiterate population in city C. Find total population of city F.",options:["1900", "1800", "1750", "2000", "2100"],correct:0,explanation:"Total literate population in F 20 3 D Also, (x+4) = 8 8x = D \u2013 32 120 = 10000 \u00d7 100 \u00d7 8 \u00d7 100 = 900 x= Total illiterate population in F = 10000 \u00d7 19 100 \u00d7 8 19 125 \u00d7 100 = 1000 Total population of city F = (900+1000) = 1900 D\u221232 8 ------ (ii) From (i) and (ii) we get D = 252 And, x = 27.5 252\u221264 Required time = (27.5\u22124) = 8 hours",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44037,setId:'set2',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate',text:"Pie chart: distribution of population (literate + illiterate) in five cities, total population of all five cities = 10000. City shares: A 13%, B 25%, C 19%, D 23%, E 20%. Ratio of literate to illiterate: A 6:7, B 3:2, C 11:8, D 11:12, E 3:5. Total illiterate population in city D is what percent more than total illiterate population in city B.",options:["25%", "20%", "10%", "30%", "5%"],correct:1,explanation:"City D illiterate = 10000 x 23% x 12/23 = 1200; City B illiterate = 10000 x 25% x 2/5 = 1000. (1200-1000)/1000 = 20% more.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44038,setId:'set2',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate',text:"Pie chart: distribution of population (literate + illiterate) in five cities, total population of all five cities = 10000. City shares: A 13%, B 25%, C 19%, D 23%, E 20%. Ratio of literate to illiterate: A 6:7, B 3:2, C 11:8, D 11:12, E 3:5. Find the average of literate population in cities A and D together.",options:["650", "750", "850", "950", "800"],correct:2,explanation:"Total literate population in A and D 13 6 23 75 So, present age of B = 4x \u00d7 100 = 3x = 600 + 1100 = 1700 1700 2 = 850 So, present age A = 3x \u00d7 3 8 = 10000 \u00d7 100 \u00d7 5 \u00d7 15 = 800 Total illiterate male in city B 25 2 Required difference = 800 \u2013 700 = 100",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44039,setId:'set2',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate',text:"Pie chart: distribution of population (literate + illiterate) in five cities, total population of all five cities = 10000. City shares: A 13%, B 25%, C 19%, D 23%, E 20%. Ratio of literate to illiterate: A 6:7, B 3:2, C 11:8, D 11:12, E 3:5. If the ratio of male to female in total literate and illiterate population of city B is 8 : 7 & 7 : 3, then find the difference between total literate and illiterate male in city B.",options:["250", "200", "50", "100", "150"],correct:3,explanation:"City B: literate = 1500, illiterate = 1000. Literate males = 1500 x 8/15 = 800; illiterate males = 1000 x 7/10 = 700. Difference = 100.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},

{id:44041,setId:'set2',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate',text:"A boat takes 12 hours to cover (D + 30) km in upstream and it takes 8 hours to cover D km in downstream. If speed of stream is 4 km/hr, then find the time (in hours) taken by boat to cover (D \u2013 64) km in upstream.",options:["8", "10", "7.5", "6", "10.5"],correct:0,explanation:"Let speed of boat in still water be x km/hr D+30 (x\u22124) = 12 12x \u2013 48 = D + 30 x= D+78 12 ----- (i) 16 www.bankersadda.com | www.sscadda.com | www.careerpower.in | Adda247 App",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44042,setId:'set2',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate',text:"A man invested Rs. x in scheme A on simple interest at the rate 20% p.a. for three years and he invested Rs. (x+3000) in scheme B on simple interest at the rate 20% p.a. for two years. If interest received by man from scheme B is Rs. 400 more than that of from scheme A, then find the value of x (in Rs.).",options:["2000", "4000", "6000", "8000", "3000"],correct:1,explanation:"ATQ \u2013 = 1200 Total illiterate population in city B 25 40 = 10000 \u00d7 100 \u00d7 5 = 1000 Required percentage = 1200\u22121000 1000 \u00d7 100 = 20%",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44043,setId:'set2',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate',text:"The present age of A is 40% less than B and the present age of B is 25% less than C. Four years hence, the sum of age of B and C will be 78 years. Find the present age (in years) of A.",options:["28", "12", "18", "24", "20"],correct:2,explanation:"Let C = 4x, B = 3x (25% less than C), A = 0.6 x 3x = 1.8x. (3x+4)+(4x+4) = 78 gives x = 10, so A = 18 years.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44044,setId:'set2',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate',text:"A, B and C entered into a business and invested in the ratio of 5 : 4 : 6 respectively. After four months, B and C left the business. At the end of a years, the total profit is Rs. 2500. Find the profit share of A.",options:["1000 Rs,", "1800 Rs.", "1200 Rs.", "1500 Rs.", "900 Rs."],correct:3,explanation:"Profit ratio = 5x12 : 4x4 : 6x4 = 15 : 4 : 6. A's share = 2500 x 15/25 = Rs. 1500.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44045,setId:'set2',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate',text:"Length and breadth of a rectangular park is 300 m & 200 m respectively. If a 10 m wide path is constructed outside the park, then find the area (in m2) of the path.",options:["12400", "1040", "11400", "8400", "10400"],correct:4,explanation:"Area of park = 300 \u00d7 200 = 60000 m2 Length of park including path = 300 + 2 \u00d7 10 = 320 m Breadth of park including path = 200 + 2\u00d7 10 = 220 m Area of park including path = 320 \u00d7 220 = 70400 m2 Required difference = 70400 \u2013 60000 = 10400 m2",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44046,setId:'set2',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate',text:"A vessel contains mixture of milk and water. The quantity of milk is 6 liters more than water in the vessel and the ratio of milk to water in the vessel is 3 : 2. If 50% mixture is taken out from the vessel, then find the quantity of milk remaining in the final mixture.",options:["9", "12", "6", "7.5", "3"],correct:0,explanation:"Let quantity of water in the vessel initially = x liters So, quantity of milk in the vessel initially = x + 6 liters ATQ \u2013 x+6 x 18 600 + L = 1500 L = 900 meters",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44047,setId:'set2',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate',text:"A and B together read 88 pages in 11 hours and efficiency of B is 40% less than A. If A, B and C together can read 150 pages in 10 hours, then find B and C together can read 120 pages in how many hours.",options:["10 hours", "12 hours", "8 hours", "15 hours", "16 hours"],correct:1,explanation:"A+B read 8 pages/hr; B = 60% of A gives A = 5, B = 3. A+B+C = 15, so C = 7. B+C = 10 pages/hr; 120 pages take 12 hours.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},

{id:44050,setId:'set2',section:"Quantitative Aptitude",topic:"Arithmetic",difficulty:'Moderate',text:"The cost price of article A is Rs 600 more than that of article B and selling price of A is Rs 1200 more than that of B. If difference between profit earned on selling these two articles is 40/3 % of the cost price of A and profit received by shopkeeper on A is 100/3 %, then find profit earned on article B.",options:["Rs 800", "Rs 900", "Rs 840", "Rs 960", "Rs 1000"],correct:1,explanation:"Let the cost price and selling price of B be Rs x and Rs y respectively CP of A=(x+600) And SP of A=(y+1200) Difference of their profits =(y + 1200 \u2212 x \u2212 600) \u2212 (y \u2212 x ) = 600 ATQ 40 (x + 600) \u00d7 = 600 x = 12 So, quantity of milk in the vessel initially = 12 + 6 = 18 liters Required milk remaining in the final mixture 50 ATQ, 5 (600 + L) = 36 \u00d7 (72 + 78) \u00d7 3 = 18 \u2212 (12+18) \u00d7 100 \u00d7 5 = 18 \u2013 9 = 9 liters",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44051,setId:'set2',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate',text:"Line graph shows items sold and unsold by a shop (Sold, Unsold): Flotter (45,15), Shoes (55,25), Slipper (58,22), Heels (66,24), Crocs (36,15). Total manufactured of each item = Sold + Unsold. Find the total number of manufactured",options:["145", "170", "165", "185", "200"],correct:1,explanation:"Required sum = (58+22) + (66 +24) = 170 5x + 3x = 8 x=1 150 Efficiency of C = 10 \u2013 (5+3) = 7 pages/hours",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},

{id:44053,setId:'set2',section:"Quantitative Aptitude",topic:"Data Interpretation",difficulty:'Moderate',text:"Line graph shows items sold and unsold by a shop (Sold, Unsold): Flotter (45,15), Shoes (55,25), Slipper (58,22), Heels (66,24), Crocs (36,15). Total manufactured of each item = Sold + Unsold. Find the number of unsold Crocs is what percent of the number of Shoes sold?",options:["27 1/11 %","28 1/11 %","27 3/11 %","30 1/11 %","29 1/11 %"],correct:2,explanation:"Unsold Crocs = 15; Shoes sold = 55. 15/55 x 100 = 27 3/11 %.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},

{id:44081,setId:'set2',section:"English Language",topic:"Spelling Error",difficulty:'Moderate',text:"In each of the given questions, a sentence is given with four words highlighted, one of which may contain a spelling error. Mark from the options corresponding the question the one which represents the incorrectly spelt word. Mark option (e) if there are no spelling errors. The girl dishonoured her family as all her sibllings had graduated from college and she couldn\u2019t.",options:["dishonoured", "sibllings", "graduated", "college", "No spelling errors"],correct:1,explanation:"\u201cSibllings\u201d is the incorrectly spelt word in the sentence and the correct spelling of the word is \u201csiblings\u201d. \u201cSibling\u201d means \u201ca brother or a sister\u201d.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44082,setId:'set2',section:"English Language",topic:"Spelling Error",difficulty:'Moderate',text:"In each of the given questions, a sentence is given with four words highlighted, one of which may contain a spelling error. Mark from the options corresponding the question the one which represents the incorrectly spelt word. Mark option (e) if there are no spelling errors. As a way of offering congratulasions to the man, his new employees brought him presents.",options:["congratulasions", "employees", "brought", "presents", "No spelling errors"],correct:0,explanation:"\u201cCongratulasions\u201d is the incorrectly spelt word in the sentence and the correct spelling of the word is \u201ccongratulations\u201d. \u201cCongratulations\u201d is used for expressing one's praise for an achievement or good wishes on a special occasion.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44083,setId:'set2',section:"English Language",topic:"Spelling Error",difficulty:'Moderate',text:"In each of the given questions, a sentence is given with four words highlighted, one of which may contain a spelling error. Mark from the options corresponding the question the one which represents the incorrectly spelt word. Mark option (e) if there are no spelling errors. The protective attorney declined to disclose his client\u2019s current location.",options:["protective", "declined", "disclose", "current", "No spelling errors"],correct:4,explanation:"No words are spelt incorrectly in the sentence. Thus, option (e) is the answer.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44084,setId:'set2',section:"English Language",topic:"Spelling Error",difficulty:'Moderate',text:"In each of the given questions, a sentence is given with four words highlighted, one of which may contain a spelling error. Mark from the options corresponding the question the one which represents the incorrectly spelt word. Mark option (e) if there are no spelling errors. The instructor praised the photogrephy skills of the new intern.",options:["instructor", "praised", "photogrephy", "intern", "No spelling errors"],correct:2,explanation:"\u201cPhotogrephy\u201d is the incorrectly spelt word in the sentence and the correct spelling of the word is \u201cphotography\u201d. \u201cPhotography\u201d is defined as \u201cthe skill or process of taking photographs\u201d.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44085,setId:'set2',section:"English Language",topic:"Spelling Error",difficulty:'Moderate',text:"In each of the given questions, a sentence is given with four words highlighted, one of which may contain a spelling error. Mark from the options corresponding the question the one which represents the incorrectly spelt word. Mark option (e) if there are no spelling errors. Because of resent budget cuts, the government will cut down on many social subsidies.",options:["resent", "budget", "social", "subsidies", "No spelling errors"],correct:0,explanation:"\u201cResent\u201d is the incorrectly spelt word in the sentence and the correct spelling of the word is \u201crecent\u201d. \u201cRecent\u201d is defined as \u201csomething that happened or began only a short time ago\u201d. 21 www.bankersadda.com |",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44086,setId:'set2',section:"English Language",topic:"Para Jumbles",difficulty:'Moderate',text:"In the passage six coherent sentences are given, which are not arranged in meaningful order. Rearrange these sentences in the correct order to answer the following questions. (A) As renewable energy production requires land, water, and labor, it imposes costs on people and the environment (B) But renewables need to be further scrutinized before being championed as forging a path toward a low-carbon future. (C) Furthermore, even if renewable energy can be produced in small-scale, such an approach might not generate the high returns on capital. (D) In a low-carbon world, renewable energy technologies are hot business. (E) Every impact of renewable energy must be examined to ensure that a climate-smart future does not intensify social and environmental harm. (F)For investors looking to redirect funds, wind turbines and solar panels, seem a straightforward choice. Which of the following sentences is the third statement of the rearrangement?",options:["A", "B", "C", "F", "E"],correct:1,explanation:"By going through given passage, it is clear that the passage is about the profitability aspects of renewables and in contrast to the popular opinion, the social and environmental harms the renewables posse. Here, sentence (D) says the same, i.e., the business aspect of renewable energy, thus setting the premise on which other sentences are based and needed to be rearranged. The next sentence should be statement (F) which establishes the fact mentioned in the first statement. Sentence (B) initiated the opposite opinion which is then further analyzed in the letter sentences. Sentence (E) and sen",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
