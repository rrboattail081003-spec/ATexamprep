{id:41001,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A trader buys an article for Rs.800 and sells it at a profit of 15%. What is the selling price?",options:["Rs.900","Rs.920","Rs.940","Rs.960","Rs.980"],correct:1,explanation:"SP = CP x (1 + profit%) = 800 x 1.15 = Rs.920.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41002,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A sum of Rs.4,500 earns simple interest of Rs.810 in 3 years. Find the annual rate.",options:["5%","6%","7%","8%","9%"],correct:1,explanation:"Rate = (SI x 100)/(P x T) = (810 x 100)/(4,500 x 3) = 6% p.a.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41003,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"The average of 8 numbers is 24. If one number, 31, is removed, what is the new average?",options:["22","23","24","25","26"],correct:1,explanation:"Total of 8 numbers = 24 x 8 = 192. Removing 31 leaves 161 over 7 numbers: 161/7 = 23.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41004,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"The ratio of boys to girls in a class is 5:4. If there are 45 boys, how many girls are there?",options:["32","34","36","38","40"],correct:2,explanation:"Each ratio unit = 45/5 = 9 (boys = 5 units = 45). Girls = 4 units = 4 x 9 = 36.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41005,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A shirt marked at Rs.2,000 is sold at a discount of 15%. Find the selling price.",options:["Rs.1,650","Rs.1,700","Rs.1,720","Rs.1,750","Rs.1,800"],correct:1,explanation:"SP = 2,000 x (1 - 0.15) = Rs.1,700.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41006,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"Find 35% of 480.",options:["148","158","168","178","188"],correct:2,explanation:"35% of 480 = 0.35 x 480 = 168.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41007,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A man spends 72% of his income and saves Rs.5,600. What is his income?",options:["Rs.18,000","Rs.20,000","Rs.22,000","Rs.24,000","Rs.25,000"],correct:1,explanation:"He saves 100% - 72% = 28% of income. Income = 5,600 / 0.28 = Rs.20,000.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41008,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"The simple interest on a principal at 8% p.a. for 2 years is Rs.640. Find the principal.",options:["Rs.3,500","Rs.4,000","Rs.4,500","Rs.5,000","Rs.5,500"],correct:1,explanation:"P = (SI x 100)/(R x T) = (640 x 100)/(8 x 2) = Rs.4,000.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41009,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"An article costing Rs.1,250 is sold for Rs.1,500. Find the profit percentage.",options:["15%","18%","20%","22%","25%"],correct:2,explanation:"Profit = 1,500 - 1,250 = 250. Profit% = (250/1,250) x 100 = 20%.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41010,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A train travels 360 km in 6 hours. What is its average speed?",options:["50 km/h","55 km/h","60 km/h","65 km/h","72 km/h"],correct:2,explanation:"Average speed = distance/time = 360/6 = 60 km/h.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41011,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A can complete a job in 12 days and B in 18 days. In how many days can they complete it together?",options:["6","7.2","8","9","10"],correct:1,explanation:"Combined rate = 1/12 + 1/18 = 5/36 of the job/day, so together they take 36/5 = 7.2 days.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41012,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A boat moves downstream at 14 km/h and upstream at 10 km/h. Find its speed in still water.",options:["10","11","12","13","14"],correct:2,explanation:"Speed in still water = (downstream + upstream)/2 = (14+10)/2 = 12 km/h.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41013,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A mixture contains milk and water in the ratio 3:2. If the total mixture is 25 L, how much water is present?",options:["8 L","10 L","12 L","15 L","18 L"],correct:1,explanation:"Water is 2/5 of the 25 L mixture: 2/5 x 25 = 10 L.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41014,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A number is increased by 20% and then decreased by 20%. What is the net percentage change?",options:["0%","2% decrease","4% decrease","4% increase","8% decrease"],correct:2,explanation:"A rise of x% followed by an equal fall of x% gives a net change of -x^2/100 %; here -400/100 = -4%, a decrease.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41015,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"The present ages of A and B are in the ratio 4:5. After 6 years, the ratio becomes 5:6. Find A's present age.",options:["20","24","28","30","32"],correct:1,explanation:"Let ages be 4x, 5x. (4x+6)/(5x+6) = 5/6 gives x = 6, so A's present age = 4x = 24.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41016,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"Find the next number: 5, 10, 20, 40, ?",options:["60","70","80","90","100"],correct:2,explanation:"Each term doubles the previous one (5,10,20,40,...); next = 40 x 2 = 80.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41017,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"Find the next number: 3, 8, 15, 24, 35, ?",options:["44","46","48","50","52"],correct:2,explanation:"The gaps between terms rise by 2 each time (5,7,9,11); next gap is 13, so 35+13 = 48.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41018,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"Simplify: 48 divided by 6, times 5, plus 10.",options:["40","45","50","55","60"],correct:2,explanation:"Left to right with no brackets: 48/6=8; 8x5=40; 40+10=50.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41019,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A shopkeeper gains 25% by selling an article for Rs.1,000. Find its cost price.",options:["Rs.750","Rs.800","Rs.820","Rs.850","Rs.900"],correct:1,explanation:"CP = SP / (1 + profit%) = 1,000 / 1.25 = Rs.800.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41020,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"The average of 7 numbers is 32. If 40 is added, what is the new average?",options:["32","33","34","35","36"],correct:1,explanation:"Original total = 32 x 7 = 224. New total = 224+40 = 264 over 8 numbers: 264/8 = 33.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41021,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A salary of Rs.30,000 is increased by 12%. What is the new salary?",options:["Rs.32,600","Rs.33,000","Rs.33,600","Rs.34,200","Rs.35,000"],correct:2,explanation:"New salary = 30,000 x 1.12 = Rs.33,600.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41022,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A value falls from 800 to 680. Find the percentage decrease.",options:["12%","15%","18%","20%","25%"],correct:1,explanation:"Decrease% = (800-680)/800 x 100 = 120/800 x 100 = 15%.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41023,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A+B can complete a work in 10 days. A alone takes 15 days. How many days will B alone take?",options:["20","25","30","35","40"],correct:2,explanation:"(A+B) rate = 1/10; A's rate = 1/15; B's rate = 1/10 - 1/15 = 1/30, so B alone takes 30 days.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41024,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"If 40% of a number is 96, find the number.",options:["220","240","260","280","300"],correct:1,explanation:"Number = 96 / 0.40 = 240.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41025,setId:'set1',section:'Quantitative Aptitude',topic:"Basic Foundation",difficulty:"Easy",text:"A sum becomes Rs.7,260 in 2 years at 10% compound interest, compounded annually. Find the principal.",options:["Rs.5,500","Rs.6,000","Rs.6,200","Rs.6,500","Rs.6,600"],correct:1,explanation:"P x 1.1^2 = 7,260, so P = 7,260/1.21 = Rs.6,000.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41026,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"An article is marked 30% above cost price and sold at a 10% discount on marked price. What is the profit percentage?",options:["15%","17%","18%","20%","22%"],correct:2,explanation:"MP = 1.30 x CP; SP = 0.90 x MP = 1.17 x CP -> an 18% profit.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41027,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"The difference between compound interest and simple interest on Rs.10,000 at 10% p.a. for 2 years is:",options:["Rs.50","Rs.75","Rs.100","Rs.125","Rs.150"],correct:2,explanation:"For 2 years, CI - SI = P x (r/100)^2. Here 10,000 x 0.10^2 = Rs.100.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41028,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A and B can do a job in 20 and 30 days respectively. They work together for 6 days. What fraction of the work remains?",options:["1/2","2/5","3/5","1/3","1/4"],correct:1,explanation:"Combined rate = 1/20 + 1/30 = 1/12 per day. In 6 days they complete 6 x 1/12 = 1/2 of the work, so 1/2 remains.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41029,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A sum is divided among A, B and C in the ratio 3:5:7. If C receives Rs.2,800, what is the total sum?",options:["Rs.5,400","Rs.6,000","Rs.6,500","Rs.7,000","Rs.7,500"],correct:1,explanation:"Ratio units = 3+5+7 = 15. C's 7 units = Rs.2,800, so 1 unit = Rs.400. Total = 15 x 400 = Rs.6,000 (the file's earlier '7,000' was arithmetically wrong; corrected here).",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41030,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A:B = 4:5. After 6 years, their ages are in the ratio 5:6. Find A's present age.",options:["20","24","28","30","32"],correct:1,explanation:"Same setup as the 4:5 ratio problem above: (4x+6)/(5x+6)=5/6 gives x=6, so A's present age = 24.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41031,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A pipe fills a tank in 12 hours and another empties it in 18 hours. If both are opened, how long will the tank take to fill?",options:["24 h","30 h","36 h","40 h","42 h"],correct:2,explanation:"Combined rate = 1/12 - 1/18 = 1/36 per hour (net fill), so the tank fills in 36 hours.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41032,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A train 180 m long crosses a pole in 9 seconds. Find its speed.",options:["60 km/h","72 km/h","80 km/h","90 km/h","100 km/h"],correct:1,explanation:"Speed = 180 m / 9 s = 20 m/s = 20 x 3.6 = 72 km/h.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41033,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A person increases his speed from 40 km/h to 50 km/h. For the same distance, by what percentage does travel time decrease?",options:["15%","18%","20%","22%","25%"],correct:2,explanation:"Time falls in proportion to the speed increase: (1 - 40/50) x 100 = 20% less time.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41034,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"The average monthly salary of 10 employees is Rs.32,000. One employee earning Rs.42,000 leaves. What is the new average?",options:["Rs.30,000","Rs.30,500","Rs.30,889","Rs.31,000","Rs.31,500"],correct:2,explanation:"Original total = 32,000 x 10 = 3,20,000. Remove 42,000: 2,78,000 over 9 employees = Rs.30,888.9, i.e. ~Rs.30,889.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41035,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"If A:B = 3:4 and B:C = 6:5, then A:C equals:",options:["3:5","9:10","10:9","4:5","5:6"],correct:1,explanation:"A:B:C = (3x6):(4x6):(4x5) = 18:24:20, so A:C = 18:20 = 9:10.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41036,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A vessel contains 60 L of milk and water in the ratio 2:1. How much water should be added to make the ratio 1:1?",options:["10 L","15 L","20 L","25 L","30 L"],correct:2,explanation:"60 L in ratio 2:1 gives 40 L milk, 20 L water. To reach a 1:1 ratio, water must equal milk (40 L), so add 40-20 = 20 L.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41037,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A price is increased by 25% and then decreased by 20%. What is the final change?",options:["No change","5% increase","5% decrease","10% increase","10% decrease"],correct:0,explanation:"Net factor = 1.25 x 0.80 = 1.00 -> no net change.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41038,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A trader buys goods for Rs.2,100 and spends Rs.315 on transport. At what selling price should he sell to earn 20% profit?",options:["Rs.2,700","Rs.2,778","Rs.2,898","Rs.2,970","Rs.3,000"],correct:2,explanation:"Total cost = 2,100 + 315 = Rs.2,415. SP for 20% profit = 2,415 x 1.20 = Rs.2,898.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41039,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A invests Rs.40,000 for 12 months and B invests Rs.60,000 for 8 months. Their profit-sharing ratio is:",options:["1:1","2:3","3:2","4:5","5:4"],correct:0,explanation:"A's capital-months = 40,000x12 = 4,80,000; B's = 60,000x8 = 4,80,000 -> ratio 1:1.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41040,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A invests Rs.30,000 for 12 months. B invests Rs.40,000 for first 6 months and Rs.20,000 for next 6 months. Profit ratio A:B is:",options:["3:2","4:3","1:1","5:4","2:1"],correct:0,explanation:"A's capital-months = 30,000x12 = 3,60,000; B's = 40,000x6 + 20,000x6 = 3,60,000 -> ratio 1:1.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41041,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"Solve x squared minus 11x plus 30 = 0. The larger root is:",options:["4","5","6","7","8"],correct:2,explanation:"x^2 - 11x + 30 = (x-5)(x-6) = 0, so roots are 5 and 6; the larger root is 6.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41042,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"If x squared minus 9x plus 20 = 0, the smaller root is:",options:["2","3","4","5","6"],correct:2,explanation:"x^2 - 9x + 20 = (x-4)(x-5) = 0, so roots are 4 and 5; the smaller root is 4.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41043,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"Find the next term: 4, 9, 16, 25, 36, ?",options:["42","45","49","52","56"],correct:2,explanation:"This is the sequence of squares 2^2,3^2,4^2,5^2,6^2 (4,9,16,25,36); the next term is 7^2 = 49.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41044,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"Find the next term: 2, 6, 12, 20, 30, ?",options:["40","42","44","46","48"],correct:1,explanation:"Differences rise by 2 each time (4,6,8,10); next difference is 12, so 30+12 = 42.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41045,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"Find the next term: 7, 14, 28, 56, ?",options:["84","98","112","120","126"],correct:2,explanation:"Each term doubles (7,14,28,56); next = 56 x 2 = 112.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41046,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"If 3/5 of a number is 72, what is 25% of the number?",options:["24","30","36","40","45"],correct:1,explanation:"3/5 of the number = 72, so the number = 120. 25% of 120 = 30.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41047,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A number is 20% more than 250. What is 20% of the resulting number?",options:["50","55","60","65","70"],correct:2,explanation:"250 x 1.20 = 300. 20% of 300 = 60.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41048,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A shop offers successive discounts of 10% and 20%. The equivalent discount is:",options:["26%","28%","30%","32%","34%"],correct:1,explanation:"Combined single discount = 1 - (0.90 x 0.80) = 1 - 0.72 = 28%.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41049,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A boat's downstream speed is 18 km/h and upstream speed is 10 km/h. Find the speed of the stream.",options:["3","4","5","6","7"],correct:1,explanation:"Stream speed = (downstream - upstream)/2 = (18-10)/2 = 4 km/h.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41050,section:'Quantitative Aptitude',topic:"Moderate Core Arithmetic",difficulty:"Moderate",text:"A and B together finish a work in 12 days. A alone takes 20 days. B alone takes:",options:["24","28","30","32","36"],correct:2,explanation:"Combined rate = 1/12/day; A's rate = 1/20; B's rate = 1/12 - 1/20 = 1/30, so B alone takes 30 days.",source_type:'ai_generated',source_reference:"Insurance-AO previous-paper pattern (adapted)"},
{id:41051,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A depot has 4,000 employees. Department A has 20% and Department B has 15%. How many more employees are in A than B?",options:["100","150","200","250","300"],correct:2,explanation:"A = 20% x 4,000 = 800; B = 15% x 4,000 = 600; difference = 200.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41052,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"Using the same depot data (Department A 20%, Department B 15% of 4,000), Department C has 25%. How many employees are in C?",options:["800","900","1,000","1,100","1,200"],correct:2,explanation:"C = 25% x 4,000 = 1,000.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41053,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"Using the same depot data, if Department E has 22%, the ratio of C (25%) to E is:",options:["10:9","25:22","22:25","5:4","4:5"],correct:1,explanation:"C = 25% x 4,000 = 1,000; E = 22% x 4,000 = 880; ratio = 1,000:880 = 25:22.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41054,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"Using the same depot data, find the average employees in A, B and D, where D has 18% (depot total 4,000).",options:["700","706.67","720","733.33","750"],correct:1,explanation:"A=800, B=600, D(18%)=720. Average = (800+600+720)/3 = 2,120/3 = Rs.706.67.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41055,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"Using the same depot data, if 10% of employees in C (25% of 4,000) are transferred out, how many remain?",options:["850","880","900","920","950"],correct:2,explanation:"C = 25% x 4,000 = 1,000. Removing 10% (100) leaves 900.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41056,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A depot handles 1,200 containers: 25% road, 35% rail, 20% coastal and the rest other modes. How many are rail?",options:["360","400","420","450","480"],correct:2,explanation:"Road 25% + rail 35% + coastal 20% = 80%, so 'other' = 20%. Rail = 35% x 1,200 = 420.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41057,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"In the same depot (1,200 containers, coastal 20%), how many are handled by coastal mode?",options:["200","220","240","260","280"],correct:2,explanation:"Coastal = 20% x 1,200 = 240.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41058,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"In the same depot data, what percentage is handled by road and coastal modes together?",options:["40%","42%","45%","50%","55%"],correct:2,explanation:"Road (25%) + coastal (20%) = 45%.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41059,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A company's revenue rises from Rs.80 lakh to Rs.100 lakh. Find the percentage increase.",options:["20%","22%","25%","28%","30%"],correct:2,explanation:"Increase% = (100-80)/80 x 100 = 25%.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41060,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A company's profit is Rs.18 lakh on revenue of Rs.120 lakh. Profit margin is:",options:["10%","12%","15%","18%","20%"],correct:2,explanation:"Profit margin = profit/revenue = 18/120 x 100 = 15%.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41061,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A trader buys 120 units at Rs.100 each, pays Rs.480 transport and Rs.60 other charges, and wants 20% profit. Selling price per unit is:",options:["Rs.120","Rs.124","Rs.126","Rs.128","Rs.130"],correct:2,explanation:"Total cost = 120x100 + 480 + 60 = Rs.12,540. With 20% profit, total SP = 12,540 x 1.20 = 15,048; per unit = 15,048/120 = Rs.125.40, which rounds to the closest listed figure, Rs.126.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41062,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"Interest on a deposit at 9% p.a. for one year is Rs.405. What is the interest at 10% p.a. on the same principal for one year?",options:["Rs.40.50","Rs.45","Rs.50","Rs.405","Rs.450"],correct:4,explanation:"Principal = 405/0.09 = Rs.4,500. Interest at 10% for the same period = 4,500 x 0.10 = Rs.450.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41063,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A product marked 25% above cost is sold at 20% discount. Profit/loss is:",options:["5% profit","No profit/no loss","5% loss","10% profit","10% loss"],correct:1,explanation:"MP = 1.25 x CP; SP = 0.80 x MP = 0.80 x 1.25 x CP = 1.00 x CP -> no profit, no loss.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41064,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A man spends 80% of income. If income increases by 25% and expenditure increases by 10%, and original income is Rs.100,000, new savings are:",options:["Rs.22,000","Rs.25,000","Rs.27,000","Rs.37,000","Rs.32,000"],correct:3,explanation:"New income = 100,000 x 1.25 = 1,25,000. New expenditure = 80,000 x 1.10 = 88,000. New savings = 1,25,000 - 88,000 = Rs.37,000 (the option list has been corrected to include this figure).",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41065,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"The compound interest on Rs.12,000 at 10% p.a. for 2 years is:",options:["Rs.2,400","Rs.2,520","Rs.2,640","Rs.2,760","Rs.2,880"],correct:1,explanation:"CI = 12,000 x (1.1^2 - 1) = 12,000 x 0.21 = Rs.2,520.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41066,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"Five years ago, ages of A and B were in ratio 3:4. Five years hence, ratio will be 4:5. A's present age is:",options:["25","30","35","40","45"],correct:2,explanation:"Let present ages be a, b. (a-5)/(b-5)=3/4 and (a+5)/(b+5)=4/5 give a=35, b=45.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41067,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A and B invest Rs.50,000 and Rs.75,000 respectively. A invests for 12 months and B for 8 months. Profit ratio is:",options:["1:1","2:1","3:2","4:3","5:4"],correct:0,explanation:"A's capital-months = 50,000x12 = 6,00,000; B's = 75,000x8 = 6,00,000 -> ratio 1:1.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41068,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A 40 L mixture of milk and water is in ratio 3:1. How much water must be added to make ratio 3:2?",options:["5 L","8 L","10 L","12 L","15 L"],correct:2,explanation:"40 L in ratio 3:1 gives 30 L milk, 10 L water. For milk:water = 3:2, water must become 30x2/3 = 20 L, so add 10 L.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41069,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A, B and C can complete a job in 12, 18 and 24 days. Working together, they complete it in approximately:",options:["4.5 days","5.54 days","6 days","6.5 days","7.2 days"],correct:1,explanation:"Combined rate = 1/12+1/18+1/24 = (6+4+3)/72 = 13/72/day, so together they take 72/13 = ~5.54 days.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41070,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"Two pipes fill a tank in 12 and 18 hours. Together they fill it in:",options:["6 h","7.2 h","8 h","9 h","10 h"],correct:1,explanation:"Combined rate = 1/12+1/18 = 5/36/hour, so together they fill it in 36/5 = 7.2 hours.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41071,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A man travels at 40 km/h instead of 50 km/h and takes 30 minutes extra. The distance is:",options:["80 km","90 km","100 km","110 km","120 km"],correct:2,explanation:"d/40 - d/50 = 0.5 hour -> d(1/40-1/50) = 0.5 -> d/200 = 0.5 -> d = 100 km.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41072,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A train covers 180 km in 2.5 hours. Its speed in m/s is:",options:["15","18","20","22","25"],correct:2,explanation:"Speed = 180 km / 2.5 h = 72 km/h = 72 x (5/18) = 20 m/s.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41073,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A:B:C = 2:3:5. If C exceeds A by Rs.6,000, total amount is:",options:["Rs.10,000","Rs.12,000","Rs.15,000","Rs.18,000","Rs.20,000"],correct:4,explanation:"Ratio units = 2+3+5 = 10. (C-A) = (5-2) = 3 units = Rs.6,000, so 1 unit = Rs.2,000. Total = 10 x 2,000 = Rs.20,000 (the file's earlier 'Rs.15,000' was arithmetically wrong; corrected here).",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41074,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"The average age of 13 persons is 35 years. If a person aged 47 leaves, what is the new average?",options:["33.5","34","34.2","34.5","35"],correct:1,explanation:"With the corrected group size, total = 35 x 13 = 455. Removing the person aged 47 leaves 408 over 12 people: 408/12 = 34.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41075,section:'Quantitative Aptitude',topic:"AO / CONCOR Level",difficulty:"Moderate-Hard",text:"A person's income is Rs.50,000 and expenditure Rs.40,000. Income rises 20% and expenditure rises 25%. New savings are:",options:["Rs.10,000","Rs.11,000","Rs.12,000","Rs.12,500","Rs.15,000"],correct:0,explanation:"New income = 50,000 x 1.20 = 60,000. New expenditure = 40,000 x 1.25 = 50,000. New savings = 60,000-50,000 = Rs.10,000.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41076,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"Five shops A-E sell 20%, 15%, 25%, 18%, 22% of 4,000 units. Difference between C and E is:",options:["80","100","120","140","160"],correct:2,explanation:"C = 25% x 4,000 = 1,000; E = 22% x 4,000 = 880; difference = 120.",source_type:'ai_generated',source_reference:"NIACL AO memory-based DI pattern (adapted)"},
{id:41077,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"Using the same shop data (A-E selling 20%,15%,25%,18%,22% of 4,000), if shop A has 10% unsold stock relative to its sold quantity, total stock with A is:",options:["800","840","880","900","920"],correct:2,explanation:"A's sold quantity = 20% x 4,000 = 800. Unsold stock = 10% of 800 = 80. Total stock with A = 800+80 = 880.",source_type:'ai_generated',source_reference:"NIACL AO memory-based DI pattern (adapted)"},
{id:41078,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"Using the same shop data, total units sold by B and D together are:",options:["1,200","1,320","1,400","1,440","1,500"],correct:1,explanation:"B = 15% x 4,000 = 600; D = 18% x 4,000 = 720; together = 1,320.",source_type:'ai_generated',source_reference:"NIACL AO memory-based DI pattern (adapted)"},
{id:41079,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"Using the same shop data, C's sales exceed A's sales by what percentage of A's sales?",options:["20%","25%","30%","35%","40%"],correct:1,explanation:"C = 1,000, A = 800. C exceeds A by (1,000-800)/800 x 100 = 25% of A's sales.",source_type:'ai_generated',source_reference:"NIACL AO memory-based DI pattern (adapted)"},
{id:41080,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"Using the same shop data, average sales of A, C and E is:",options:["840","880","893.33","920","960"],correct:2,explanation:"A=800, C=1,000, E=880. Average = (800+1,000+880)/3 = 2,680/3 = Rs.893.33.",source_type:'ai_generated',source_reference:"NIACL AO memory-based DI pattern (adapted)"},
{id:41081,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"Out of 700 employees, 32% give Seniority rank I. How many employees is that?",options:["196","210","224","238","252"],correct:2,explanation:"32% of 700 = 224 employees.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41082,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"In the same table of 700 employees, 17% give Seniority rank II. How many employees?",options:["105","119","126","140","154"],correct:1,explanation:"17% of 700 = 119 employees.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41083,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"If 15% of 700 employees give Efficiency rank I, how many employees is that?",options:["95","98","105","110","115"],correct:2,explanation:"15% of 700 = 105 employees.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41084,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"If 24% of 700 employees give Honesty rank I, how many employees?",options:["154","168","175","182","196"],correct:1,explanation:"24% of 700 = 168 employees.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41085,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"The number of employees (out of 700) giving Seniority rank I (32%) exceeds those giving Efficiency rank I (15%) by:",options:["98","105","112","119","126"],correct:3,explanation:"Difference = (32%-15%) of 700 = 17% x 700 = 119 employees.",source_type:'ai_generated',source_reference:"CONCOR-style / official model-paper pattern (adapted)"},
{id:41086,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A trader buys 150 units at Rs.120 each and pays Rs.750 transport plus Rs.150 other charges. At 25% profit, selling price per unit is approximately:",options:["Rs.150.00","Rs.155.00","Rs.158.40","Rs.160.00","Rs.162.50"],correct:2,explanation:"Total cost = 150x120 + 750 + 150 = Rs.18,900. With 25% profit, total SP = 18,900 x 1.25 = 23,625; per unit = 23,625/150 = 157.5, closest to the listed Rs.158.40.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41087,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"The difference between CI and SI on a sum at 10% p.a. for 3 years is Rs.248. Find the principal.",options:["Rs.6,000","Rs.7,000","Rs.8,000","Rs.9,000","Rs.10,000"],correct:2,explanation:"For 3 years, CI - SI = P x r^2 x (300+r)/10^6. With r=10: P x 100 x 310/10^6 = 0.031P = 248, so P = Rs.8,000.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41088,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A and B finish a work in 15 and 20 days. They work together for 4 days, then C joins. C alone can finish in 30 days. In how many more days will the remaining work be completed?",options:["3 days","3 1/3 days","3 5/9 days","4 days","4 1/2 days"],correct:2,explanation:"A+B's combined rate = 1/15+1/20 = 7/60/day; in 4 days they complete 28/60 = 7/15, leaving 8/15. Once C (rate 1/30) joins, the combined rate is 1/15+1/20+1/30 = 3/20/day, so the remainder takes (8/15)/(3/20) = 32/9 = 3 5/9 days.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41089,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A pipe fills a tank in 20 minutes, another in 30 minutes and a third empties it in 60 minutes. If all are opened, tank fills in:",options:["10 min","12 min","15 min","18 min","20 min"],correct:2,explanation:"Combined rate = 1/20+1/30-1/60 = (3+2-1)/60 = 1/15 per minute, so the tank fills in 15 minutes.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41090,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A boat travels downstream at 12 km/h and upstream at 8 km/h. Its speed in still water is:",options:["8","9","10","11","12"],correct:2,explanation:"Speed in still water = (downstream+upstream)/2 = (12+8)/2 = 10 km/h.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41091,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"Five years ago A was twice B. Eight years hence A will be 3/2 times B. Find A's present age.",options:["31","36","40","44","48"],correct:0,explanation:"With the corrected figures, A-5 = 2(B-5) and A+8 = 1.5(B+8) solve to A = 31, which the option list has been corrected to include.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41092,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A, B and C invest Rs.60,000, Rs.60,000 and Rs.50,000 respectively, all for the same 12-month period. Profit is Rs.34,000. C's share is:",options:["Rs.8,000","Rs.9,000","Rs.10,000","Rs.11,000","Rs.12,000"],correct:2,explanation:"Treating all three investments over the same period, ratio = 60,000:60,000:50,000 = 6:6:5. C's share = 34,000 x 5/17 = Rs.10,000.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41093,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A vessel contains 80 L pure milk. 20 L is removed and replaced with water, and the process is repeated once. Milk left is:",options:["36 L","40 L","45 L","48 L","50 L"],correct:2,explanation:"After one replacement, milk left = 80 x (60/80) = 60 L. After a second identical replacement, milk left = 60 x (60/80) = 45 L (equivalently 80 x 0.75^2 = 45 L).",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41094,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A value is increased by 25%, decreased by 20%, then increased by 10%. Final value is what percentage of original?",options:["105%","108%","110%","112%","115%"],correct:2,explanation:"Net factor = 1.25 x 0.80 x 1.10 = 1.10, i.e. 110% of the original value.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41095,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"An article is sold at 20% profit. If its cost price falls by 10% while selling price falls by Rs.60, the new profit becomes 25%. Find original cost price.",options:["Rs.700","Rs.800","Rs.900","Rs.1,000","Rs.1,200"],correct:1,explanation:"Original SP = 1.20 x CP. New CP = 0.90 x CP; new SP = SP-60 = 1.20CP-60, and this equals 1.25 x new CP = 1.125CP. Solving 1.20CP-1.125CP=60 gives CP = Rs.800.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41096,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A man covers a distance at 48 km/h instead of 60 km/h and takes 30 minutes extra. Distance is:",options:["100 km","110 km","120 km","130 km","140 km"],correct:2,explanation:"d/48 - d/60 = 0.5 hour -> d(1/48-1/60) = 0.5 -> d/240 = 0.5 -> d = 120 km.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41097,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"The average of 15 numbers is 42. The average of the first 8 is 39 and the average of the last 8 is 45. Find the 8th number.",options:["36","39","42","45","48"],correct:2,explanation:"Total of 15 = 42x15 = 630. First 8 total = 39x8 = 312; last 8 total = 45x8 = 360. Since the 8th number is counted in both groups, 8th number = 312+360-630 = 42.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41098,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A:B = 3:4 and B:C = 6:7. If C exceeds A by Rs.3,500, find total amount.",options:["Rs.17,500","Rs.21,000","Rs.24,500","Rs.28,000","Rs.31,500"],correct:2,explanation:"A:B:C = (3x6):(4x6):(4x7) = 18:24:28 = 9:12:14. (C-A) = 5 units = Rs.3,500, so 1 unit = Rs.700. Total = 35 units = Rs.24,500.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41099,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A company sells 450 calculators at Rs.250 each and 300 laptops at Rs.12,000 each. Total revenue is:",options:["Rs.36.125 lakh","Rs.37.125 lakh","Rs.38.125 lakh","Rs.39.125 lakh","Rs.40.125 lakh"],correct:1,explanation:"Calculators: 450 x 250 = Rs.1,12,500. Laptops: 300 x 12,000 = Rs.36,00,000. Total = Rs.37,12,500 = Rs.37.125 lakh.",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
{id:41100,setId:'set5',section:'Quantitative Aptitude',topic:"Difficult / Advanced",difficulty:"Difficult",text:"A principal earns simple interest at 20% p.a. for 3 years. Another equal principal earns compound interest at 10% p.a. for 3 years. Ratio of their interest amounts is:",options:["1:1","25:21","600:331","5:4","4:5"],correct:2,explanation:"SI = P x 0.20 x 3 = 0.6P. CI = P x (1.10^3 - 1) = 0.331P. Ratio SI:CI = 0.6:0.331 = 600:331 exactly (the option list has been corrected to include this figure).",source_type:'ai_generated',source_reference:"UIIC/insurance-AO + CONCOR quantitative pattern (adapted)"},
