e'.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43077,section:"English Language",topic:"Vocabulary",difficulty:'Moderate',text:"Read the following passage and answer the question. Passage: If you're like most people, calling an insurance company isn't among your favorite activities. That's because the insurance industry is one of the least innovative areas for customer experience, meaning that customers typically come away from their interactions disappointed and dissatisfied. However, things are definitely changing, and artificial intelligence is playing a large role. The fast-growing technology has the potential to disrupt the entire industry and greatly improve the insurance customer experience. The insurance agency is notorious for its outdated processes. Filing a claim often looks the same today as it did decades ago because the industry isn't consistently leveraging new technologies that are available to them. If an employee is busy or on vacation, a claims request could sit still until the right person is back. The outdated processes make it harder for agents by increasing the workload and forcing them to work with antiquated systems and frustrated customers. However, AI can be applied to improve the claims process. Claims currently are touched by multiple employees. However, a new process of \"touch less\" claims is introduced in the industry. This process uses artificial intelligence and other technology to report the claim, capture damage, audit the system, and communicate with the customer. The potential here is huge, as the process could allow clients the chance to file claims without having to wade through red tape. Companies that have already automated some aspects of their claims process have seen a significant reduction in processing times and quality. AI-powered claims could also fight against one of the most costly elements of the insurance industry: fraudulent claims, which cost the industry more than $40 billion a year. Instead of relying on humans to manually comb through reports to catch inaccurate claims, AI algorithms can identify patterns in the data and recognize when something is fraudulent. The industry is definitely ripe for AI disruption. Customers expect to be able to interact with companies through modern technology; a recent survey found that 74% of consumers say they would be happy to get computer-generated insurance advice. Many insurance companies are already using artificial intelligence to some degree, and the number of companies following in their footsteps is sure to increase dramatically over the coming years. Artificial Intelligence has never been less expensive or more accessible, which means most companies don't have a reason not to adopt it in at least some form. Chatbots work through messaging apps many customers already have on their phones, which makes them a natural next step in customer interaction. In order to truly be effective, chatbots must have natural language processing and sentiment analysis so they can understand what customers are really asking. In the insurance space, chatbots can be used to answer basic questions and resolve claims, as well as sell products, address leads, or make sure customers are properly covered by their insurance. Traditionally, insurance companies used blanket methods like cold calling customers, but today's customers expect personalized sales tactics. AI can pull in customer data to create a full profile, instead of spending valuable time and money on the underwriting process, which typically includes invasive questions and surveys. AI can analyze data better than humans to more accurately predict each customer's risk, thereby providing customers with the right amount of insurance and companies with protection from risky customers. Question: Choose the word opposite in meaning to 'Antiquated' as used in the passage.",options:["Outmoded","Quaint","State of the art","Obsolete","None of these"],correct:2,explanation:"'Antiquated' means old-fashioned/outdated, so its opposite is 'State of the art'.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43078,setId:'set3',section:"English Language",topic:"Usage in Context",difficulty:'Moderate',text:"Mantle -- choose the sentence that uses the word correctly. (a) Ever since I was young, we've hung a stocking from the mantle on Christmas Eve. (b) He finally settled on the mantle across from his bed, deciding to buy something for the party. (c) Although the mantle was sparsely decorated, each item had been artfully placed. (d) His mantle was filled to the brim with framed pictures of his children and grandchildren.",options:["Sentence (a)","Sentence (b)","Sentence (c)","Sentence (d)","None of these"],correct:1,explanation:"'Mantle' means a cloak/shawl; the fireplace shelf is spelled 'Mantel'. Only sentence (b) correctly uses 'mantle' as a garment-like covering he 'settled on' (i.e. decided on, non-literal), while the other sentences wrongly use 'mantle' for the shelf.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43079,setId:'set3',section:"English Language",topic:"Usage in Context",difficulty:'Moderate',text:"Feat -- choose the sentence that uses the word correctly. (a) He sat down on the edge of the bed, staring at his feat. (b) Pete threw his feat over the wagon seat and dropped to the ground. (c) It felt good to be off her feat, even if only momentarily. (d) It was perhaps the most astonishing single feat of arms in the World War.",options:["Sentence (a)","Sentence (b)","Sentence (c)","Sentence (d)","None of these"],correct:3,explanation:"'Feat' means an achievement requiring skill; 'feet' is the plural of foot. Only sentence (d) uses 'feat' correctly (a feat of arms/an achievement); the rest wrongly use 'feat' where 'feet' was meant.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43080,setId:'set3',section:"English Language",topic:"Usage in Context",difficulty:'Moderate',text:"Flair -- choose the sentence that uses the word correctly. (a) You can bring in Asian accents to add a bit more flair and style to the tent. (b) A flair of interest was in Komal's black gaze. (c) Lana watched the sky flair with rocket and laser fire from the battle. (d) You'll find patterned designs, perfect for adding a bit of flairs to your outfit.",options:["Sentence (a)","Sentence (b)","Sentence (c)","Sentence (d)","None of these"],correct:0,explanation:"'Flair' means a special talent/style; 'flare' means a burst of light/flame. Only sentence (a) uses 'flair' correctly.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43081,setId:'set3',section:"English Language",topic:"Cloze Test",difficulty:'Moderate',text:"Insuring body parts has a surprisingly exotic connotation, despite the morbid subject matter. There are various insurance schemes ___(BLANK)___ property, life, health and automobiles, but until recently, nobody would have thought of having separate body parts insured. Now it is possible to have their body parts insured with an insurance company. If you are a footballer, you can insure your legs as this body part is ___(BLANK)___ you to earn your bread and butter. This policy is usually taken by celebrities all over the world as they can afford the high expenses associated with it. Body part insurance is part of Specialty insurance which has already gained a good market abroad. It is usually taken and issued to celebrities who stand to lose from damage or injury to their body part, and this policy ___(BLANK)___ the business loss to a celebrity for that part of their body or talent that is important for their business. The payout from dismemberment tends to depend on how critical that individual part is to your ability to function, as this relates to the level of ___(BLANK)___. These celebrities can afford to pay the ___(BLANK)___ insurance premiums on these kinds of policies because they are wealthy and the insured body parts are essential to their work. Fill in the blank number 1:",options:["Ranging","Excluding","Covering","Governing","None of these"],correct:2,explanation:"'Covering property, life, health and automobiles' correctly conveys the range of insurance schemes.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43082,setId:'set3',section:"English Language",topic:"Cloze Test",difficulty:'Moderate',text:"Insuring body parts has a surprisingly exotic connotation, despite the morbid subject matter. There are various insurance schemes ___(BLANK)___ property, life, health and automobiles, but until recently, nobody would have thought of having separate body parts insured. Now it is possible to have their body parts insured with an insurance company. If you are a footballer, you can insure your legs as this body part is ___(BLANK)___ you to earn your bread and butter. This policy is usually taken by celebrities all over the world as they can afford the high expenses associated with it. Body part insurance is part of Specialty insurance which has already gained a good market abroad. It is usually taken and issued to celebrities who stand to lose from damage or injury to their body part, and this policy ___(BLANK)___ the business loss to a celebrity for that part of their body or talent that is important for their business. The payout from dismemberment tends to depend on how critical that individual part is to your ability to function, as this relates to the level of ___(BLANK)___. These celebrities can afford to pay the ___(BLANK)___ insurance premiums on these kinds of policies because they are wealthy and the insured body parts are essential to their work. Fill in the blank number 2:",options:["Serviced","Aiding","Yearning","Abiding","None of these"],correct:1,explanation:"'This body part is aiding you to earn your bread and butter' fits contextually and grammatically.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43083,setId:'set3',section:"English Language",topic:"Cloze Test",difficulty:'Moderate',text:"Insuring body parts has a surprisingly exotic connotation, despite the morbid subject matter. There are various insurance schemes ___(BLANK)___ property, life, health and automobiles, but until recently, nobody would have thought of having separate body parts insured. Now it is possible to have their body parts insured with an insurance company. If you are a footballer, you can insure your legs as this body part is ___(BLANK)___ you to earn your bread and butter. This policy is usually taken by celebrities all over the world as they can afford the high expenses associated with it. Body part insurance is part of Specialty insurance which has already gained a good market abroad. It is usually taken and issued to celebrities who stand to lose from damage or injury to their body part, and this policy ___(BLANK)___ the business loss to a celebrity for that part of their body or talent that is important for their business. The payout from dismemberment tends to depend on how critical that individual part is to your ability to function, as this relates to the level of ___(BLANK)___. These celebrities can afford to pay the ___(BLANK)___ insurance premiums on these kinds of policies because they are wealthy and the insured body parts are essential to their work. Fill in the blank number 3:",options:["Amplified","Aided","Rectified","Indemnify","None of these"],correct:3,explanation:"'This policy indemnifies the business loss' correctly uses the insurance term for compensating a loss.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43084,setId:'set3',section:"English Language",topic:"Cloze Test",difficulty:'Moderate',text:"Insuring body parts has a surprisingly exotic connotation, despite the morbid subject matter. There are various insurance schemes ___(BLANK)___ property, life, health and automobiles, but until recently, nobody would have thought of having separate body parts insured. Now it is possible to have their body parts insured with an insurance company. If you are a footballer, you can insure your legs as this body part is ___(BLANK)___ you to earn your bread and butter. This policy is usually taken by celebrities all over the world as they can afford the high expenses associated with it. Body part insurance is part of Specialty insurance which has already gained a good market abroad. It is usually taken and issued to celebrities who stand to lose from damage or injury to their body part, and this policy ___(BLANK)___ the business loss to a celebrity for that part of their body or talent that is important for their business. The payout from dismemberment tends to depend on how critical that individual part is to your ability to function, as this relates to the level of ___(BLANK)___. These celebrities can afford to pay the ___(BLANK)___ insurance premiums on these kinds of policies because they are wealthy and the insured body parts are essential to their work. Fill in the blank number 4:",options:["Disablement","Functionality","Reimbursement","Enigma","None of these"],correct:0,explanation:"'The level of disablement' fits the context of how critical a body part is to one's ability to function.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43085,setId:'set3',section:"English Language",topic:"Cloze Test",difficulty:'Moderate',text:"Insuring body parts has a surprisingly exotic connotation, despite the morbid subject matter. There are various insurance schemes ___(BLANK)___ property, life, health and automobiles, but until recently, nobody would have thought of having separate body parts insured. Now it is possible to have their body parts insured with an insurance company. If you are a footballer, you can insure your legs as this body part is ___(BLANK)___ you to earn your bread and butter. This policy is usually taken by celebrities all over the world as they can afford the high expenses associated with it. Body part insurance is part of Specialty insurance which has already gained a good market abroad. It is usually taken and issued to celebrities who stand to lose from damage or injury to their body part, and this policy ___(BLANK)___ the business loss to a celebrity for that part of their body or talent that is important for their business. The payout from dismemberment tends to depend on how critical that individual part is to your ability to function, as this relates to the level of ___(BLANK)___. These celebrities can afford to pay the ___(BLANK)___ insurance premiums on these kinds of policies because they are wealthy and the insured body parts are essential to their work. Fill in the blank number 5:",options:["Miniscule","Superficial","Humongous","Gold","None of these"],correct:2,explanation:"'The humongous insurance premiums' fits contextually, describing the very high premiums wealthy celebrities can afford.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43086,setId:'set3',section:"English Language",topic:"Error Spotting / Spelling",difficulty:'Moderate',text:"Sentence: 'The priest together with (Part A) his followers were fataly injured (Part B, bold word: fataly) in the accident which occurred last night (Part C) near the unmanned railway crossing. (Part D, bold word: unmanned)'",options:["Part A: 'The priest together with'","Part B: 'his followers were fataly injured' (spelling error: fataly -> fatally)","Part C: 'in the accident which occurred last night'","Part D: 'near the unmanned railway crossing.'","No Error"],correct:1,explanation:"'Fataly' is misspelled -- the correct spelling is 'fatally' (with death as a result).",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43087,setId:'set3',section:"English Language",topic:"Error Spotting / Spelling",difficulty:'Moderate',text:"Sentence: 'The young woman who is watching television in that room (Part A, bold word: watching) lived here for more than (Part B) a year but she has never created (Part C) any problem for us. (Part D, bold word: problem)'",options:["Part A: 'The young woman who is watching television in that room'","Part B: 'lived here for more than' (grammar error -- should be 'has lived')","Part C: 'a year but she has never created'","Part D: 'any problem for us.'","No Error"],correct:1,explanation:"The sentence is in present tense throughout ('is watching', 'has never created'), so 'lived' should be 'has lived'.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43088,setId:'set3',section:"English Language",topic:"Error Spotting / Spelling",difficulty:'Moderate',text:"Sentence: 'Each of the employees, (Part A, bold word: employees) whom the company has chosen to take part (Part B) in the international seminar to be conducted (Part C) in the City Hal, are up to the mark (Part D, bold word: Hal)'",options:["Part A: 'Each of the employees,'","Part B: 'whom the company has chosen to take part'","Part C: 'in the international seminar to be conducted'","Part D: 'in the City Hal, are up to the mark' (grammar + spelling error: are->is, Hal->Hall)","No Error"],correct:3,explanation:"'Each of' takes a singular verb, so 'are' should be 'is'; also 'Hal' is misspelled -- it should be 'Hall'.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43089,setId:'set3',section:"English Language",topic:"Error Spotting / Spelling",difficulty:'Moderate',text:"Sentence: 'Needless to say, (Part A) no sooner were all these large and rather expensive operations finished (Part B, bold word: operations) when the main electrecity was brought in (Part C, bold word: electrecity) and the turbine became obsolete. (Part D)'",options:["Part A: 'Needless to say,'","Part B: 'no sooner were all these large and rather expensive operations finished'","Part C: 'when the main electrecity was brought in' (grammar error: when->than; spelling error: electrecity->electricity)","Part D: 'and the turbine became obsolete.'","No Error"],correct:2,explanation:"'No sooner' should be followed by 'than', not 'when'; also 'electrecity' is misspelled -- it should be 'electricity'.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43090,setId:'set3',section:"English Language",topic:"Error Spotting / Spelling",difficulty:'Moderate',text:"Sentence: 'Plastic bags less than 50 microns thick (Part A) are banned, (Part B) but neither the states nor the city corporations (Part C, bold word: corporations) cares to enforce this rule. (Part D, bold word: enforce)'",options:["Part A: 'Plastic bags less than 50 microns thick'","Part B: 'are banned,'","Part C: 'but neither the states nor the city corporations'","Part D: 'cares to enforce this rule.' (grammar error: cares->care)","No Error"],correct:3,explanation:"With 'neither...nor', the verb agrees with the nearer subject ('city corporations', plural), so 'cares' should be 'care'.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43091,section:"English Language",topic:"Paragraph Rearrangement",difficulty:'Moderate',text:"Statements: (a) However, in order for continuous success to take place; it is the Government's responsibility to provide the youth with proper facilities for getting equipped with the knowledge of the modern era. (b) Banks have been focusing on laws, policies and legal frameworks that have been developed with the participation of young people and which help them realize their full potential. (c) They also need to know how to read, write, think, understand, analyze, and discuss the issues their country faces. (d) The entire success of the nation depends on the youths. (e) The primary role of young people is to get a good education in order to become better citizens of tomorrow. (F) They need to learn skills to do the job that their country's economy needs. Considering statement (e) as the first sentence of the paragraph, which one among the following becomes the last sentence to make the paragraph coherent?",options:["A","C","B","E","D"],correct:0,explanation:"The correct rearrangement is E-F-C-D-A, so statement (a) becomes the last sentence.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43092,section:"English Language",topic:"Paragraph Rearrangement",difficulty:'Moderate',text:"Statements: (a) However, in order for continuous success to take place; it is the Government's responsibility to provide the youth with proper facilities for getting equipped with the knowledge of the modern era. (b) Banks have been focusing on laws, policies and legal frameworks that have been developed with the participation of young people and which help them realize their full potential. (c) They also need to know how to read, write, think, understand, analyze, and discuss the issues their country faces. (d) The entire success of the nation depends on the youths. (e) The primary role of young people is to get a good education in order to become better citizens of tomorrow. (F) They need to learn skills to do the job that their country's economy needs. Considering statement (e) as the first sentence of the paragraph, which among the following does not coherently relate to the paragraph after rearrangement?",options:["D","C","A","B","F"],correct:3,explanation:"Statement (b), about banks' focus on laws and policies, does not fit the paragraph's theme about youth and government/education.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43093,section:"English Language",topic:"Paragraph Rearrangement",difficulty:'Moderate',text:"Statements: (a) However, in order for continuous success to take place; it is the Government's responsibility to provide the youth with proper facilities for getting equipped with the knowledge of the modern era. (b) Banks have been focusing on laws, policies and legal frameworks that have been developed with the participation of young people and which help them realize their full potential. (c) They also need to know how to read, write, think, understand, analyze, and discuss the issues their country faces. (d) The entire success of the nation depends on the youths. (e) The primary role of young people is to get a good education in order to become better citizens of tomorrow. (F) They need to learn skills to do the job that their country's economy needs. Considering statement (e) as the first sentence of the paragraph, which one of the following statements should consecutively follow statement (F)?",options:["A","B","C","D","E"],correct:2,explanation:"Correct rearrangement is E-F-C-D-A, so statement (c) follows statement (F).",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43094,section:"English Language",topic:"Paragraph Rearrangement",difficulty:'Moderate',text:"Statements: (a) However, in order for continuous success to take place; it is the Government's responsibility to provide the youth with proper facilities for getting equipped with the knowledge of the modern era. (b) Banks have been focusing on laws, policies and legal frameworks that have been developed with the participation of young people and which help them realize their full potential. (c) They also need to know how to read, write, think, understand, analyze, and discuss the issues their country faces. (d) The entire success of the nation depends on the youths. (e) The primary role of young people is to get a good education in order to become better citizens of tomorrow. (F) They need to learn skills to do the job that their country's economy needs. Considering statement (e) as the first sentence of the paragraph, which one of the following is the FOURTH statement of the paragraph after rearrangement?",options:["F","B","A","D","E"],correct:3,explanation:"In the sequence E-F-C-D-A, the fourth statement is (d).",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43095,section:"English Language",topic:"Paragraph Rearrangement",difficulty:'Moderate',text:"Statements: (a) However, in order for continuous success to take place; it is the Government's responsibility to provide the youth with proper facilities for getting equipped with the knowledge of the modern era. (b) Banks have been focusing on laws, policies and legal frameworks that have been developed with the participation of young people and which help them realize their full potential. (c) They also need to know how to read, write, think, understand, analyze, and discuss the issues their country faces. (d) The entire success of the nation depends on the youths. (e) The primary role of young people is to get a good education in order to become better citizens of tomorrow. (F) They need to learn skills to do the job that their country's economy needs. Considering statement (e) as the first sentence of the paragraph, choose the correct sequence of the paragraph after rearrangement.",options:["EDCBA","ECDAB","EAFDC","EFCDA","ECADB"],correct:3,explanation:"The coherent rearrangement of the six statements starting from (e) is E-F-C-D-A.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43096,section:"English Language",topic:"Correct Usage",difficulty:'Moderate',text:"(I) Priyamvada was unhappy to hear the news of her son's failing in the final examination. (II) Tax evaders should be heavily fined as they are doing it intentionally. (III) The information supplied to us were not as useful as we first thought it would be. (IV) Statistics suggests that the population of this town will double in five years.",options:["Only (I) is correct","Only (IV) is correct","Both (I) and (II) are correct","Both (II) and (IV) are correct","All are correct"],correct:2,explanation:"(III) is wrong -- 'information' is uncountable and singular, so it should be 'was'; (IV) is wrong -- 'statistics' referring to one field of study takes a singular verb, so it should be 'suggest'.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43097,section:"English Language",topic:"Correct Usage",difficulty:'Moderate',text:"(I) He asked what the weather had been like during my holidays and I said that it had been awful. (II) Shruti has such a fine memory that she can recollect anything what happened many years ago. (III) The last of the Mughal emperors of India was imprisoned and was later sent into exile by the British. (IV) We strongly encourage school's support and teacher's participation to maximize the performance standard.",options:["Only (I) is correct","Only (II) is correct","Both (I) and (III) are correct","Both (II) and (IV) are correct","All are correct"],correct:0,explanation:"Sentence (II) wrongly uses 'what' instead of 'that' after 'anything'; (III) needs 'later on'; (IV) needs the plural possessive teachers'. Only (I) is correct.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43098,section:"English Language",topic:"Correct Usage",difficulty:'Moderate',text:"(I) He is not only sincere in his responsibilities but also very competent to handle the job. (II) One of my brothers told me about the sad demise of your uncle. (III) As a practice the last batch of the tins undergoes through checkup. (IV) Past experience constituted another important factor in establishing the interpretation of signs noted.",options:["Only (I) is correct","Only (II) is correct","Both (I) and (II) are correct","Both (II) and (III) are correct","All are correct"],correct:4,explanation:"All four sentences are grammatically correct as written.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43099,section:"English Language",topic:"Correct Usage",difficulty:'Moderate',text:"(I) The boy who you see there made the top score in the last match. (II) Only by working hard did he prosper as a business consultant since he arrived in America 20 years ago. (III) In a fit of temper, he tore up the sweet letter which his wife had written to him. (IV) It was rather cold again today, but tomorrow we expect the temperature to rise.",options:["Only (I) is correct","Only (III) is correct","Both (I) and (II) are correct","Both (I) and (III) are correct","All are correct"],correct:1,explanation:"(I) wrongly uses 'who' instead of the objective case 'whom'; (II) wrongly uses 'has he prospered' logic with 'since' + simple past instead of present perfect; only (III) is correct.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43100,section:"English Language",topic:"Correct Usage",difficulty:'Moderate',text:"(I) The teacher drew the attention of the boys to the importance of regular practice. (II) The teacher said that Ajay was capable of doing more better work. (III) Did you see any of the child when you were in the garden? (IV) Today, automobiles have taken the place of horses in the principal means of transportation.",options:["Both (I) and (IV) are correct","Only (III) is correct","Both (I) and (II) are correct","Both (I) and (III) are correct","All are correct"],correct:0,explanation:"(II) wrongly uses the double comparative 'more better'; (III) wrongly uses singular 'child' after 'any of' where the plural 'children' is needed; (I) and (IV) are correct.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},

{id:42001,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Under the Industrial Disputes Act, 1947, a 'lay-off' differs from a 'retrenchment' primarily because a lay-off is:",options:["A permanent termination for misconduct","A temporary inability/refusal of the employer to give employment due to reasons like shortage of raw material, without severing the employment relationship","Always accompanied by retrenchment compensation","Applicable only to managerial staff"],correct:1,explanation:"A lay-off is a temporary refusal/inability to give employment (e.g. shortage of raw material) without ending the employment relationship, unlike retrenchment which is a permanent discharge of surplus labour.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42002,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"As per the Industrial Disputes Act, 1947, before retrenching a workman who has completed one year of continuous service in an industrial establishment, the employer must generally give:",options:["No notice at all","One month's notice or wages in lieu, notice to the appropriate government, and retrenchment compensation","Only a verbal warning","Compensation equal to five years' wages"],correct:1,explanation:"Section 25F requires one month's notice (or wages in lieu), notice to the appropriate government, and retrenchment compensation before retrenching a workman with one year of continuous service.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42003,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"The 'last come, first go' principle referred to in retrenchment law is more precisely known as:",options:["Standing order 'B'","Principle of natural justice","First-in-first-out inventory rule","Seniority list"],correct:3,explanation:"The 'last come, first go' seniority principle in retrenchment (Section 25G) is formally called the seniority list/rule.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42004,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Under the Factories Act, 1948, a 'young person' includes a child and:",options:["Any person above 60 years","An adolescent","Only apprentices","Only contract labour"],correct:1,explanation:"Under the Factories Act, 1948, a 'young person' covers both a child and an adolescent (someone who has completed 15 but not 18 years).",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42005,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Under the Factories Act, 1948, the maximum number of hours an adult worker may ordinarily be required to work in a factory in a day, subject to the prescribed weekly limit, is:",options:["9 hours in a day (48 hours a week), subject to statutorily governed exceptions and rest-interval requirements","24 hours","6 hours only, with no exceptions","14 hours with no rest interval"],correct:0,explanation:"Section 51 of the Factories Act caps an adult worker's ordinary working hours at 9 hours a day / 48 hours a week, subject to statutory exceptions and rest intervals. LAW UPDATE: the Factories Act, 1948 was repealed on 21 Nov 2025 and subsumed into the Occupational Safety, Health and Working Conditions (OSH) Code, 2020, which caps ordinary daily hours at 8 hours/day (48 hours/week retained). Confirm which framework your exam is testing.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42006,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"The Payment of Wages Act, 1936 primarily seeks to ensure:",options:["Provision of retirement benefits","Timely payment of wages and regulate permissible deductions from wages of specified categories of employees","Registration of trade unions","Fixation of minimum wage rates"],correct:1,explanation:"The Payment of Wages Act, 1936 regulates timely wage payment and permissible deductions for specified employee categories; it does not fix wage rates.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42007,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Under the Minimum Wages Act, 1948, the 'appropriate government' fixing minimum rates of wages considers:",options:["Only the employer's profit margin","Cost of living and other relevant factors for the scheduled employment concerned","Only the employee's educational qualification","Only company turnover"],correct:1,explanation:"Under the Minimum Wages Act, 1948, the appropriate government sets minimum rates considering cost of living and other relevant factors for the scheduled employment.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42008,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"The Employees' Provident Funds and Miscellaneous Provisions Act, 1952 is best described as providing for:",options:["A framework for trade union recognition","A mechanism for fixing wages","A contributory retirement/social-security savings scheme for employees in covered establishments","A scheme purely for recruitment of employees"],correct:2,explanation:"The EPF & MP Act, 1952 establishes a contributory retirement/social-security savings scheme for employees in covered establishments.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42009,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Under the Employees' State Insurance Act, 1948, the scheme is primarily intended to provide:",options:["Certain benefits to employees in case of sickness, maternity and employment injury, funded through contributions","Housing loans to employees","Recruitment assistance","Only pension after 60 years of age"],correct:0,explanation:"The ESI Act, 1948 provides contribution-funded benefits for sickness, maternity and employment injury.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42010,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"The Maternity Benefit Act, 1961 (as amended) currently entitles an eligible woman employee (with fewer than two surviving children) to paid maternity leave of up to:",options:["12 weeks","52 weeks","6 weeks","26 weeks"],correct:3,explanation:"Under the Maternity Benefit Act, 1961 (as amended 2017), a woman with fewer than two surviving children is entitled to 26 weeks of paid maternity leave.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42011,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"The Sexual Harassment of Women at Workplace (Prevention, Prohibition and Redressal) Act, 2013 mandates the constitution of an Internal Committee at any office/branch with:",options:["10 or more employees","No minimum threshold at all","100 or more employees","50 or more employees"],correct:0,explanation:"Section 4 of the POSH Act, 2013 mandates an Internal Committee at any office/branch with 10 or more employees.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42012,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Under the POSH Act, 2013, the Internal Committee must ordinarily complete its inquiry within:",options:["90 days from the date of the complaint","There is no prescribed timeline","1 year","10 days"],correct:0,explanation:"Under the POSH Act, the Internal Committee must ordinarily complete its inquiry within 90 days of the complaint.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42013,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"The Trade Unions Act, 1926 primarily provides for:",options:["Registration of trade unions and defines rights/liabilities of registered trade unions","Occupational safety standards","Retrenchment compensation","Fixation of bonus"],correct:0,explanation:"The Trade Unions Act, 1926 provides for the registration of trade unions and defines the rights/liabilities that follow from registration.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42014,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Under the Payment of Bonus Act, 1965, the minimum bonus payable, subject to eligibility conditions, is generally:",options:["8.33% of salary/wages or a specified minimum amount, whichever is higher","No minimum is prescribed","Equal to one month's basic pay always","33% of annual salary"],correct:0,explanation:"Under the Payment of Bonus Act, 1965, the minimum bonus is 8.33% of wages or a prescribed minimum amount, whichever is higher.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42015,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A 'certified' Standing Order under the Industrial Employment (Standing Orders) Act, 1946 primarily governs:",options:["Matters such as classification of workmen, hours of work, leave, and conduct/discipline in an industrial establishment","Only recruitment advertisements","Company's annual budget","Only board-level appointments"],correct:0,explanation:"Certified Standing Orders under the 1946 Act govern classification of workmen, hours of work, leave and conduct/discipline matters.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42016,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Under the Industrial Disputes Act, a settlement arrived at in the course of conciliation proceedings is binding on:",options:["Only the workman who signed it","All parties to the industrial dispute, including those who were not present at the conciliation","No one until ratified by a court","Only the employer"],correct:1,explanation:"A settlement reached during conciliation binds all parties to the dispute, including those not actually present at the proceedings, once it is a settlement arrived at 'in the course of conciliation'.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42017,setId:'set4',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A 'works committee' under the Industrial Disputes Act is primarily constituted to:",options:["Promote measures for securing amity and good relations between employer and workmen and to discuss matters of common interest","Fix wages independently","Replace collective bargaining entirely","Conduct disciplinary trials only"],correct:0,explanation:"A works committee is meant to promote amity/good relations between employer and workmen and discuss matters of common interest, not to fix wages or replace collective bargaining.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42018,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"An employer wishing to declare a lock-out or a workman/union wishing to go on strike in a public utility service must, under the Industrial Disputes Act, ordinarily give prior notice of at least:",options:["Six weeks before striking/locking out, and not within 14 days of giving notice, among other conditions","No notice is required","24 hours only","One year"],correct:0,explanation:"For a strike/lock-out in a public utility service, the Industrial Disputes Act requires at least six weeks' prior notice, with further conditions such as not striking within 14 days of giving notice. LAW UPDATE: the Industrial Disputes Act, 1947 was repealed on 21 Nov 2025 and subsumed into the Industrial Relations Code, 2020, which now requires 60 days' notice (still cannot strike within 14 days of the notice) and applies to ALL industrial establishments, not just public utility services. Confirm which framework your exam is testing.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42019,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"An 'unfair labour practice' under industrial relations law would most typically include:",options:["Following certified standing orders","Granting statutory bonus on time","Discharging or discriminating against a workman for legitimate trade union activities","Providing safety equipment"],correct:2,explanation:"Discriminating against or discharging a workman for legitimate trade union activity is a textbook example of an unfair labour practice.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42020,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A Labour Court, as distinguished from an Industrial Tribunal, generally adjudicates disputes relating mainly to:",options:["Matters specified in the Second Schedule such as legality of an order, discharge or dismissal, and interpretation of standing orders","Only wage-fixation policy for the entire industry","Constitutional amendments","Company mergers"],correct:0,explanation:"Labour Courts adjudicate the Second Schedule matters — e.g. legality of an order, discharge/dismissal, and interpretation of standing orders — while Tribunals typically handle broader/Third Schedule issues like wages and bonus. LAW UPDATE: the Industrial Disputes Act, 1947 was repealed on 21 Nov 2025 and subsumed into the Industrial Relations Code, 2020, which replaced this five-body dispute-resolution structure with a streamlined two-tier system: Industrial Tribunal and National Industrial Tribunal. The old Labour Court vs Industrial Tribunal distinction no longer maps directly onto current law. Confirm which framework your exam is testing.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42021,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A well-designed grievance redressal mechanism should ideally ensure resolution of grievances within a:",options:["Reasonably defined and communicated time-frame, with escalation levels","Indefinite period without any timeline","Single meeting with no follow-up","Timeline decided solely by the aggrieved employee"],correct:0,explanation:"An effective grievance mechanism sets a clear, communicated timeframe with escalation levels so grievances don't linger indefinitely.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42022,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"'Quasi-judicial' disciplinary proceedings in an organization require the enquiry officer to primarily ensure:",options:["Fair opportunity, proper charge-sheet, evidence-based findings and a reasoned order","A predetermined guilty finding regardless of evidence","Immediate punishment without inquiry","No cross-examination of witnesses"],correct:0,explanation:"A quasi-judicial disciplinary enquiry must give the employee a fair opportunity, a proper charge-sheet, evidence-based findings, and a reasoned order — not a predetermined outcome.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42023,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A 'charge-sheet' in a domestic disciplinary enquiry should ideally specify:",options:["Vague general allegations only","Specific, clear misconduct allegations with reference to applicable conduct rules","No misconduct details at all","Only the proposed punishment"],correct:1,explanation:"A charge-sheet should specify the misconduct clearly and with reference to the applicable conduct rules, so the employee can meaningfully respond.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42024,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Suspension pending enquiry is best understood as:",options:["An interim administrative measure, usually accompanied by subsistence allowance as per applicable rules, pending outcome of the enquiry","A punishment in itself","A promotion-related decision","Automatic termination"],correct:0,explanation:"Suspension pending enquiry is an interim administrative measure (usually with subsistence allowance), not a punishment or automatic termination in itself.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42025,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"'Constructive dismissal' broadly refers to a situation where:",options:["An employee retires on superannuation","An employee is formally dismissed after a full enquiry","An employer's conduct is such that the employee is left with little option but to resign, treated in effect as forced termination","An employee resigns for better prospects unrelated to employer conduct"],correct:2,explanation:"Constructive dismissal is when the employer's conduct effectively forces the employee to resign — it's treated in substance as a forced termination, not a voluntary exit.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42026,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Job enrichment differs from job enlargement mainly because job enrichment involves:",options:["Adding more tasks of the same skill level","Adding greater autonomy, responsibility and meaningful challenge (vertical loading) to a job","Reducing the number of tasks","Reducing employee decision-making authority"],correct:1,explanation:"Job enrichment adds vertical elements — autonomy, responsibility, meaningful challenge — whereas job enlargement just adds more tasks at the same skill level.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42027,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"The Hay/point-factor method of job evaluation typically assesses jobs using factors such as:",options:["Know-how, problem-solving, and accountability","Only employee attendance","Only length of service","Only educational qualification"],correct:0,explanation:"The Hay/point-factor method evaluates jobs on know-how, problem-solving and accountability.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42028,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A 'broadbanding' approach to pay structure design is characterized by:",options:["Consolidating multiple narrow grades into fewer, wider salary bands to increase flexibility","Fixing identical pay for every job regardless of level","A very large number of narrow, closely spaced pay grades","Eliminating all salary structures"],correct:0,explanation:"Broadbanding consolidates many narrow pay grades into fewer, wider salary bands, giving more flexibility in pay management.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42029,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"The 'cafeteria approach' to employee benefits allows employees to:",options:["Receive identical mandatory benefits with no choice","Forfeit all benefits","Choose from a menu of benefit options within a defined budget/value, based on individual needs","Negotiate benefits individually outside policy"],correct:2,explanation:"A cafeteria approach lets employees pick benefits from a menu within a set budget/value, based on individual need.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42030,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"'Red-circled' employees in a compensation context are those whose:",options:["Performance rating is average","Current pay exceeds the maximum of the revised grade/range for their role","Current pay is below the new minimum of their grade","Service record shows disciplinary action"],correct:1,explanation:"Red-circled employees are those whose current pay already exceeds the maximum of their revised grade/range.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42031,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Succession planning risk is highest when an organization relies on:",options:["Multiple structured development plans","A single identified successor for each critical role with no contingency","A deep, diversified bench of ready-now and ready-in-2-years successors for critical roles","Regular potential assessments"],correct:1,explanation:"Succession-planning risk is highest with a single named successor and no backup/contingency for a critical role — the opposite of a deep bench.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42032,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A 9-box grid in talent management typically plots employees on:",options:["Age versus tenure","Performance versus potential","Salary versus grade","Attendance versus punctuality"],correct:1,explanation:"A 9-box grid plots employees on performance (one axis) versus potential (the other).",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42033,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"'Bell-curve' forced ranking in performance appraisal is most criticized because it:",options:["Always motivates every employee equally","May create artificial scarcity of top ratings and can harm morale/collaboration if teams genuinely perform well overall","Removes all subjectivity","Is legally mandatory everywhere"],correct:1,explanation:"Forced bell-curve ranking is criticized because it can create artificial scarcity of top ratings and hurt morale/collaboration, even where a team performs well overall.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42034,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"An employee net promoter score (eNPS) is primarily used to measure:",options:["Overall employee sentiment/likelihood to recommend the organization as a place to work","Statutory bonus percentage","Recruitment cost per hire","Training hours delivered"],correct:0,explanation:"eNPS measures overall employee sentiment — how likely employees are to recommend the organization as a place to work.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42035,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"'Quiet quitting', as commonly discussed in contemporary HR literature, refers to employees:",options:["Formally resigning without notice","Doing only the minimum required, psychologically disengaging while remaining employed","Taking approved sabbaticals","Filing collective grievances"],correct:1,explanation:"'Quiet quitting' describes employees doing only the bare minimum while psychologically disengaging, without formally resigning.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42036,setId:'set5',section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A skip-level meeting in organizational communication is best described as:",options:["A meeting between a manager and their direct manager's superior, bypassing the immediate reporting layer, to gather candid feedback","A disciplinary hearing","A meeting exclusively among peers","A statutory works committee meeting"],correct:0,explanation:"A skip-level meeting bypasses the immediate manager to gather candid feedback directly from their boss's boss.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42037,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"'Talent hoarding' by managers refers to the tendency to:",options:["Actively support high performers' internal mobility","Recruit excessive numbers of employees","Block high-performing subordinates from moving to other roles/teams to protect one's own team's output","Over-invest in training budgets"],correct:2,explanation:"Talent hoarding is a manager blocking high performers from moving to other roles/teams to protect their own team's output.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42038,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"An HR shared services model is primarily designed to:",options:["Centralize transactional/administrative HR activities for efficiency and consistency across business units","Decentralize every HR decision to individual managers","Eliminate the HR function entirely","Outsource only recruitment"],correct:0,explanation:"HR shared services centralizes transactional/administrative HR work for efficiency and consistency, rather than decentralizing or eliminating HR.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42039,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"The 'ambidextrous organization' concept in HR/strategy refers to a firm's ability to simultaneously:",options:["Exploit existing capabilities and explore new opportunities/innovation","Increase headcount and reduce headcount at the same time","Follow only rigid hierarchical structures","Avoid all structural change"],correct:0,explanation:"Organizational ambidexterity is the ability to exploit existing capabilities while exploring new opportunities/innovation at the same time.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42040,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A key limitation of exit interviews as a sole diagnostic tool for attrition is that:",options:["Departing employees may understate true reasons to preserve references/relationships, so triangulation with other data (e.g., engagement surveys, stay interviews) is advisable","They are legally mandatory everywhere","They eliminate the need for any other retention analytics","They always reveal the complete, unbiased truth"],correct:0,explanation:"Exit interviews can understate true reasons (to protect references/relationships), so triangulating with other data like engagement or stay interviews is advisable.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42041,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"'Boomerang employees' refers to:",options:["Employees who are dismissed and never rehired","Former employees who are rehired by the same organization after having left","Employees on probation","Employees serving notice period"],correct:1,explanation:"Boomerang employees are former staff who are rehired by the same organization after having left.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42042,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"An HR business partner (HRBP) model is primarily intended to:",options:["Embed HR expertise closely with business units to align people strategy with business goals","Focus exclusively on payroll processing","Eliminate line-manager involvement in people decisions","Keep HR purely transactional and reactive"],correct:0,explanation:"The HRBP model embeds HR expertise within business units to align people strategy with business goals, rather than keeping HR purely transactional.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42043,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"'Silent layoffs' (attrition-based downsizing without formal severance) are generally criticized for:",options:["Potentially circumventing statutory retrenchment/notice obligations and creating uncertainty/low morale among remaining staff","Having no legal or reputational risk","Improving employee trust automatically","Being fully transparent and compliant with labour law notice requirements"],correct:0,explanation:"Silent layoffs (attrition-based downsizing without formal severance) risk sidestepping statutory notice/retrenchment obligations and can hurt morale among remaining staff.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42044,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Reverse mentoring in organizational development typically involves:",options:["Senior employees mentoring only other senior employees","Younger/junior employees mentoring senior leaders, often on areas like technology or emerging trends","Eliminating all mentoring programs","Mentoring only for statutory compliance training"],correct:1,explanation:"Reverse mentoring has junior employees mentor senior leaders, often on technology or emerging trends.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42045,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A 'stay interview', unlike an exit interview, is conducted:",options:["After an employee has already resigned","With current employees to proactively understand what keeps them engaged and what might cause them to leave","Only with new joinees on day one","Only as part of disciplinary proceedings"],correct:1,explanation:"A stay interview is held with current employees to proactively understand engagement drivers, unlike an exit interview conducted after resignation.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42046,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"In workforce planning, a 'skills inventory' primarily helps an organization:",options:["Track only attendance records","Map existing employee competencies/skills against current and future business requirements","Calculate only statutory deductions","Determine retirement dates"],correct:1,explanation:"A skills inventory maps existing employee competencies against current and future business needs — it isn't just attendance or deduction tracking.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42047,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"'Onboarding debt' refers to the risk that:",options:["Onboarding costs are always fully recovered within a month","Probation periods are legally invalid","Gaps or delays in structured onboarding accumulate and surface later as productivity, engagement or early-attrition problems","New hires are over-trained in their first week"],correct:2,explanation:"Onboarding debt is the accumulated risk from gaps/delays in structured onboarding, which later surfaces as productivity, engagement or early-attrition problems.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42048,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A well-governed whistle-blower policy should generally ensure:",options:["No investigation unless senior management approves informally","Automatic termination of the person reported against","Confidentiality/anonymity options, protection against retaliation, and an independent investigation mechanism","Public disclosure of the complainant's identity"],correct:2,explanation:"A sound whistle-blower policy offers confidentiality/anonymity, protection from retaliation and an independent investigation — not public exposure of the complainant.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42049,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"Which of the following is the most balanced description of 'organizational ambidexterity' in change management contexts?",options:["Running day-to-day operations efficiently while simultaneously building capability for future transformation","Avoiding any operational efficiency measures","Pursuing transformation only, ignoring current operations","Delegating all change management to external consultants exclusively"],correct:0,explanation:"Organizational ambidexterity in change management means running current operations efficiently while simultaneously building capability for future transformation.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42050,section:"HR / Labour Law & Personnel Administration",topic:"HR / Labour Law & Personnel Administration",difficulty:'Moderate-Hard',text:"A Management Trainee is being evaluated on 'business acumen' during induction. This most closely refers to their ability to:",options:["Recite company history verbatim","Understand how organizational decisions affect financial, operational and strategic outcomes","Only follow instructions without independent judgment","Focus solely on their own department's KPIs"],correct:1,explanation:"Business acumen is the ability to see how organizational decisions ripple into financial, operational and strategic outcomes — not rote knowledge or narrow departmental focus.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},

{id:42061,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"Statements: All efficient managers are decisive. No decisive person is indecisive. Conclusion I: All efficient managers are not indecisive. Conclusion II: Some decisive persons are efficient managers.",options:["Only conclusion I follows","Only conclusion II follows","Both conclusions follow","Neither conclusion follows"],correct:2,explanation:"Since all efficient managers (EM) are decisive (D), and no decisive person is indecisive, every EM is 'not indecisive' — Conclusion I holds. Also, since EM is a non-empty subset of D, it follows that some D are EM — Conclusion II holds too. Both conclusions follow.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42062,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"In a row of employees facing north, D is 4th from the left and F is 5th from the right. If there are 15 employees in total and D is to the left of F, how many employees are between D and F?",options:["7","6","4","5"],correct:1,explanation:"With 15 employees, D is 4th from the left and F is 5th from the right, i.e. 11th from the left (15-5+1). Since D is to the left of F, the number of people strictly between them is 11-4-1 = 6.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42063,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"If in a certain code, 'MANAGE' is written as 'NBOBHF', how is 'RECORD' written in the same code?",options:["SFDPQE","SFCPSE","SFDPSE","SEDPSE"],correct:2,explanation:"Each letter of MANAGE is shifted one place forward (M->N, A->B, N->O, A->B, G->H, E->F) to give NBOBHF. Applying the same +1 shift to RECORD gives SFDPSE.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42064,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"Six colleagues P, Q, R, S, T and U are seated around a circular table facing the centre. Q is second to the right of P. R is immediately to the left of Q. S is opposite P. Who is immediately to the right of S?",options:["T or U (either, based on remaining arrangement)","R","Q","P"],correct:0,explanation:"Placing P, Q, R, S around the table per the clues (Q second to P's right, R immediately left of Q, S opposite P) leaves the two remaining seats interchangeable between T and U, so the person to S's right could be either.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42065,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"A person walks 5 km north, then turns right and walks 5 km, then turns right again and walks 5 km, then turns left and walks 3 km. What is the shortest distance from the starting point?",options:["√(25+4) km i.e. approx 5.4 km","8 km","5 km","3 km"],correct:1,explanation:"Plotting the path (5 km N, then right/E 5 km, then right/S 5 km, then left/E 3 km) lands the person 8 km east and 0 km north of the start, so the shortest distance back is 8 km.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42066,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"Find the next term in the series: 5, 11, 23, 47, 95, ?",options:["191","190","193","192"],correct:0,explanation:"Each term is roughly doubled and increased by 1: 5x2+1=11, 11x2+1=23, 23x2+1=47, 47x2+1=95, 95x2+1=191.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42067,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"Among five friends, A is taller than B but shorter than C. D is taller than C but shorter than E. Who is the second tallest?",options:["E","A","C","D"],correct:3,explanation:"From the clues, the order (tallest to shortest) is E, D, C, A, B, so D is the second tallest.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42068,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"Statement: 'No genuine leader avoids accountability.' Which of the following is the closest logical converse-consistent inference?",options:["Everyone who avoids accountability is definitely not a leader at all, genuine or otherwise","No person who avoids accountability is a genuine leader","All leaders avoid accountability","Some genuine leaders avoid accountability occasionally"],correct:1,explanation:"'No genuine leader avoids accountability' is logically equivalent to its contrapositive: 'No person who avoids accountability is a genuine leader.'",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42069,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"Eight people sit in two parallel rows of four, facing each other. Row 1, left to right: J, K, L, M. Row 2, left to right: W, X, Y, Z. Each person faces the person directly opposite, but Row 2 is seated in the reverse order relative to Row 1 (i.e., W, at the left end of Row 2, sits opposite M, the rightmost person in Row 1). Who faces L?",options:["Y","X","Z","W"],correct:1,explanation:"Row 2 is seated in reverse order relative to Row 1, so J-Z, K-Y, L-X and M-W are the facing pairs. L therefore faces X.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42070,setId:'set4',section:"Logical & Analytical Reasoning",topic:"Logical & Analytical Reasoning",difficulty:'Moderate-Hard',text:"A statement is followed by two courses of action. Statement: 'Absenteeism in the packing unit has risen sharply after the shift-timing change.' Course of Action I: Revert to the earlier shift timing immediately without analysis. Course of Action II: Conduct a focused investigation into causes before deciding on any change.",options:["Only I follows","Only II follows","Both I and II follow","Neither follows"],correct:1,explanation:"Reverting the shift timing immediately, without investigating the cause of rising absenteeism, is a rash action; investigating first (Course of Action II) is the sound, evidence-based response, so only II follows.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42071,setId:'set5',section:"Quantitative Aptitude",topic:"Quantitative Aptitude",difficulty:'Moderate-Hard',text:"A sum of \u20b915,000 is lent at compound interest of 12% per annum, compounded half-yearly, for one year. The compound interest earned is closest to:",options:["₹1,927","₹1,909","₹1,854","₹1,800"],correct:2,explanation:"For 12% p.a. compounded half-yearly (6% per half-year, 2 periods in a year): CI = 15,000 x (1.06^2 - 1) = 15,000 x 0.1236 = Rs.1,854.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42072,setId:'set5',section:"Quantitative Aptitude",topic:"Quantitative Aptitude",difficulty:'Moderate-Hard',text:"Three partners A, B and C invest \u20b940,000, \u20b960,000 and \u20b980,000 respectively for a full year, but B joins the business only 4 months after A and C start (so B's capital is invested for 8 months). If the total annual profit is \u20b936,000, B's share is:",options:["₹10,500","₹7,500","₹6,000","₹9,000"],correct:3,explanation:"Capital-months: A = 40,000x12 = 4,80,000; C = 80,000x12 = 9,60,000; B = 60,000x8 = 4,80,000 (joins 4 months late). Total = 19,20,000. B's share = 36,000 x 4,80,000/19,20,000 = Rs.9,000.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},

{id:42096,setId:'set4',section:"General Awareness, Logistics & CONCOR-specific",topic:"General Awareness, Logistics & CONCOR-specific",difficulty:'Moderate-Hard',text:"The Union Budget's classification of expenditure into 'capital' and 'revenue' expenditure primarily distinguishes based on whether the expenditure:",options:["Is spent in the first or second half of the fiscal year","Creates/acquires an asset or reduces a liability (capital) versus meets recurring operational costs (revenue)","Relates to defence or non-defence purposes","Is spent in urban or rural areas"],correct:1,explanation:"The Union Budget classifies expenditure as capital (creates/acquires an asset or reduces a liability) versus revenue (meets recurring operating costs).",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42097,setId:'set4',section:"General Awareness, Logistics & CONCOR-specific",topic:"General Awareness, Logistics & CONCOR-specific",difficulty:'Moderate-Hard',text:"The term 'multimodal transport operator' (MTO), as used in logistics/trade documentation, refers to an entity that:",options:["Issues a single transport document and assumes liability for carriage of goods across two or more modes under one contract","Operates only railway wagons","Regulates customs duty rates","Issues only marine insurance policies"],correct:0,explanation:"A Multimodal Transport Operator issues a single transport document and takes liability for carriage across two or more transport modes under one contract.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42098,setId:'set4',section:"General Awareness, Logistics & CONCOR-specific",topic:"General Awareness, Logistics & CONCOR-specific",difficulty:'Moderate-Hard',text:"'Bonded warehousing' in the context of customs administration primarily allows:",options:["Goods to be stored without immediate payment of customs duty until cleared for home consumption or re-exported","Permanent duty exemption for all goods","Storage of only perishable goods","Elimination of customs documentation entirely"],correct:0,explanation:"Bonded warehousing lets goods be stored without immediate customs-duty payment, until they're cleared for home consumption or re-exported.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42099,setId:'set4',section:"General Awareness, Logistics & CONCOR-specific",topic:"General Awareness, Logistics & CONCOR-specific",difficulty:'Moderate-Hard',text:"The Sagarmala Programme is primarily associated with:",options:["Port-led development and coastal shipping/inland waterways promotion","Development of national highways only","Urban housing schemes","Digital payment infrastructure"],correct:0,explanation:"The Sagarmala Programme is built around port-led development along with coastal shipping and inland waterways promotion.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
{id:42100,setId:'set4',section:"General Awareness, Logistics & CONCOR-specific",topic:"General Awareness, Logistics & CONCOR-specific",difficulty:'Moderate-Hard',text:"Which of the following best describes the objective of India's 'Make in India' initiative in relation to logistics and manufacturing?",options:["Discourage all foreign investment in manufacturing","Restrict exports of manufactured goods","Focus exclusively on the services sector","Encourage domestic and foreign investment in manufacturing, which in turn increases demand for efficient logistics and container movement infrastructure"],correct:3,explanation:"'Make in India' encourages domestic and foreign manufacturing investment, which in turn increases demand for efficient logistics and container-movement infrastructure — directly relevant to CONCOR's business.",source_type:'ai_generated',source_reference:'CONCOR MT (P&A) Predicted 2026 Paper'},
