{id:44090,setId:'set3',section:"English Language",topic:"Para Jumbles",difficulty:'Moderate',text:"In the passage six coherent sentences are given, which are not arranged in meaningful order. Rearrange these sentences in the correct order to answer the following questions. (A) As renewable energy production requires land, water, and labor, it imposes costs on people and the environment (B) But renewables need to be further scrutinized before being championed as forging a path toward a low-carbon future. (C) Furthermore, even if renewable energy can be produced in small-scale, such an approach might not generate the high returns on capital. (D) In a low-carbon world, renewable energy technologies are hot business. (E) Every impact of renewable energy must be examined to ensure that a climate-smart future does not intensify social and environmental harm. (F)For investors looking to redirect funds, wind turbines and solar panels, seem a straightforward choice. Which of the following sentences is the last statement of the rearrangement?",options:["A", "B", "C", "F", "E"],correct:2,explanation:"By going through given passage, it is clear that the passage is about the profitability aspects of renewables and in contrast to the popular opinion, the social and environmental harms the renewables posse. Here, sentence (D) says the same, i.e., the business aspect of renewable energy, thus setting the premise on which other sentences are based and needed to be rearranged. The next sentence should be statement (F) which establishes the fact mentioned in the first statement. Sentence (B) initiated the opposite opinion which is then further analyzed in the letter sentences. Sentence (E) and sen",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44091,setId:'set3',section:"English Language",topic:"Fill in the Blanks",difficulty:'Moderate',text:"Each of the given questions contains a sentence with one blank. Choose from the following options the word that can be most appropriately used to complete the sentence grammatically and contextually. As it _________________ back and forth, the spastic train car appeared to be close to derailing.",options:["lurched", "alerted", "collected", "detected", "pretended"],correct:0,explanation:"The definitions of the words given by the options are given below for reference. lurch \u2013 make an abrupt, unsteady, uncontrolled movement or series of movements; stagger alert \u2013 warn (someone) of a danger or problem collect \u2013 bring or gather together (a number of things) detect \u2013 discover or identify the presence or existence of pretend \u2013 behave so as to make it appear that something is the case when in fact it is not",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44092,setId:'set3',section:"English Language",topic:"Fill in the Blanks",difficulty:'Moderate',text:"Each of the given questions contains a sentence with one blank. Choose from the following options the word that can be most appropriately used to complete the sentence grammatically and contextually. Because of the school\u2019s behavioural problems, the principal is unlikely to _________________ a school dance competition this year.",options:["present", "obey", "sanction", "nod", "label"],correct:2,explanation:"The definitions of the words given by the options are given below for reference. present \u2013 give or award formally or ceremonially obey \u2013 submit to the authority of (someone) or comply with (a law) sanction \u2013 official permission or approval for an action label \u2013 attach a label to (something) \u201cNod\u201d cannot be used as the required phrase in context would be \u201cgive the nod\u201d. \u201cGive someone the nod\u201d means to \u201cto give someone approval\u201d. \u201cNod\u201d by itself is a physical action of the head. www.sscadda.com | www.careerpower.in | Adda247 App",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44093,setId:'set3',section:"English Language",topic:"Fill in the Blanks",difficulty:'Moderate',text:"Each of the given questions contains a sentence with one blank. Choose from the following options the word that can be most appropriately used to complete the sentence grammatically and contextually. In today\u2019s world, many people _________________ money and power constitute happiness.",options:["intend", "believe", "exist", "include", "muddle"],correct:1,explanation:"The definitions of the words given in the options are given below for reference. intend \u2013 have (a course of action) as one's purpose or intention; plan believe \u2013 accept that (something) is true, especially without proof exist \u2013 have objective reality or being include \u2013 comprise or contain as part of a whole muddle \u2013 bring into a disordered or confusing state",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44094,setId:'set3',section:"English Language",topic:"Fill in the Blanks",difficulty:'Moderate',text:"Each of the given questions contains a sentence with one blank. Choose from the following options the word that can be most appropriately used to complete the sentence grammatically and contextually. The king was __________________ of his adviser\u2019s motive for wanting to declare war.",options:["brave", "cynical", "honourable", "irritable", "jumbled"],correct:1,explanation:"Here, only \u201ccynical\u201d can be used because only \u201ccynical of\u201d is the correct collocation among the ones from the given options. The definitions of the words given by the options are given below for further reference. brave \u2013 ready to face and endure danger or pain; showing courage cynical \u2013 having or showing the attitude or temper of a cynic: such as - distrustful of human sincerity or integrity honourable \u2013 bringing or deserving honour irritable \u2013 having or showing a tendency to be easily annoyed jumbled \u2013 mix up in a confused or untidy way",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44095,setId:'set3',section:"English Language",topic:"Fill in the Blanks",difficulty:'Moderate',text:"Each of the given questions contains a sentence with one blank. Choose from the following options the word that can be most appropriately used to complete the sentence grammatically and contextually. If you want to feel better about yourself, you need to _________________ your self-esteem.",options:["succeed", "mark", "separate", "bolster", "scatter"],correct:3,explanation:"The definitions of the words given by the options are given below for reference. succeed \u2013 achieve the desired aim or result mark \u2013 make a visible impression or stain on separate \u2013 cause to move or be apart bolster \u2013 support or strengthen scatter \u2013 throw in various random directions",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44096,setId:'set3',section:"English Language",topic:"Error Spotting",difficulty:'Moderate',text:"Each question is divided into four parts in which one part contains the error. Choose the incorrect part as your answer. If the sentence is correct as it is, choose \u201cNo Error\u201d as your answer choice. It is him who (A)/ must take the responsibility (B)/ of completing the task (C)/within the given deadline (D)/ No error (E).",options:["A", "B", "C", "D", "No Error"],correct:0,explanation:"In part (A), \u2018him\u2019 should be replaced with \u2018he\u2019 because after \u2018to be\u2019 form we use subjective case pronouns (I/ we/ she/ he/ they/ you/it/one) only. 23 www.bankersadda.com | www.sscadda.com | www.careerpower.in | Adda247 App",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44097,setId:'set3',section:"English Language",topic:"Error Spotting",difficulty:'Moderate',text:"Each question is divided into four parts in which one part contains the error. Choose the incorrect part as your answer. If the sentence is correct as it is, choose \u201cNo Error\u201d as your answer choice. In the current scenario (A)/ solar energy is expected to (B)/ become increasing attractive as (C)/ a renewable energy source (D). / No error (E)",options:["A", "B", "C", "D", "No Error"],correct:2,explanation:"The error lies in part (C). To modify adjective \u2018attractive\u2019 we need an adverb because only an adverb modifies an adjective hence \u2018increasing\u2019 should be replaced with \u2018increasingly\u2019. Note- An adverb is a part of speech that modifies a verb, an adjective, and another adverb. When modifying an adjective, an adverb can answer questions regarding the extent to which an adjective describes a noun.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44098,setId:'set3',section:"English Language",topic:"Error Spotting",difficulty:'Moderate',text:"Each question is divided into four parts in which one part contains the error. Choose the incorrect part as your answer. If the sentence is correct as it is, choose \u201cNo Error\u201d as your answer choice. Although urban areas are (A)/ usually more polluted than (B)/the countryside, but pollution can (C)/ spread to remote places (D). / No error (E)",options:["A", "B", "C", "D", "No Error"],correct:2,explanation:"The error is in part (C). \u2018Although\u2019 is a subordinating conjunction and \u2018but\u2019 is a coordinating conjunction and they never be used together in a sentence.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44099,setId:'set3',section:"English Language",topic:"Error Spotting",difficulty:'Moderate',text:"Each question is divided into four parts in which one part contains the error. Choose the incorrect part as your answer. If the sentence is correct as it is, choose \u201cNo Error\u201d as your answer choice. Construction incurs most (A)/ occupational fatalities than (B)/ any other sector (C)/throughout the world (D). / No error (E)",options:["A", "B", "C", "D", "No Error"],correct:0,explanation:"The error is in part (A). In part (A), \u2018most\u2019 should be replaced with \u2018more\u2019 as we need comparative adjective here.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},
{id:44100,setId:'set3',section:"English Language",topic:"Error Spotting",difficulty:'Moderate',text:"Each question is divided into four parts in which one part contains the error. Choose the incorrect part as your answer. If the sentence is correct as it is, choose \u201cNo Error\u201d as your answer choice. Pigments that (A)/ are responsible for the colour (B)/ of plants are carotenoids that (C)/ plays a key role in their health (D). / No error (E)",options:["A", "B", "C", "D", "No Error"],correct:3,explanation:"The error is in part (D). Here, verb \u2018plays\u2019 should be in plural form for plural noun \u2018carotenoids\u2019.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb)'},

{id:43001,setId:'set3',section:"Reasoning Ability",topic:"Seating Arrangement",difficulty:'Moderate',text:"Ten persons A, B, C, D, E, P, Q, R, S and T are sitting in a single row and all are facing to the North direction, but not necessarily in same order. A sits 4th from the extreme end. Three persons sit between A and B. C sits immediate right of B. Two persons sit between C and D. Three persons sit between R and C. R sits immediate left of P. E sits to the right of R. Two persons sit between S and T. S sits to the left of T. Who among the following person sits 3rd to the left of P?",options:["C","T","Q","A","None of these"],correct:2,explanation:"Working out the arrangement from the clues places Q three seats to the left of P.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43002,setId:'set3',section:"Reasoning Ability",topic:"Seating Arrangement",difficulty:'Moderate',text:"Ten persons A, B, C, D, E, P, Q, R, S and T are sitting in a single row and all are facing to the North direction, but not necessarily in same order. A sits 4th from the extreme end. Three persons sit between A and B. C sits immediate right of B. Two persons sit between C and D. Three persons sit between R and C. R sits immediate left of P. E sits to the right of R. Two persons sit between S and T. S sits to the left of T. How many persons sit between R and T?",options:["None","One","Two","Three","More than three"],correct:2,explanation:"Two persons sit between R and T once the row is fixed from the clues.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43003,setId:'set3',section:"Reasoning Ability",topic:"Seating Arrangement",difficulty:'Moderate',text:"Ten persons A, B, C, D, E, P, Q, R, S and T are sitting in a single row and all are facing to the North direction, but not necessarily in same order. A sits 4th from the extreme end. Three persons sit between A and B. C sits immediate right of B. Two persons sit between C and D. Three persons sit between R and C. R sits immediate left of P. E sits to the right of R. Two persons sit between S and T. S sits to the left of T. Who among the following persons are sitting at extreme end?",options:["A and B","B and C","C and D","D and E","None of these"],correct:3,explanation:"D and E occupy the two extreme ends of the row.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43004,setId:'set3',section:"Reasoning Ability",topic:"Seating Arrangement",difficulty:'Moderate',text:"Ten persons A, B, C, D, E, P, Q, R, S and T are sitting in a single row and all are facing to the North direction, but not necessarily in same order. A sits 4th from the extreme end. Three persons sit between A and B. C sits immediate right of B. Two persons sit between C and D. Three persons sit between R and C. R sits immediate left of P. E sits to the right of R. Two persons sit between S and T. S sits to the left of T. Who among the following person sit 2nd to the right of S?",options:["A","B","C","E","None of these"],correct:2,explanation:"C sits second to the right of S in the fixed arrangement.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43005,setId:'set3',section:"Reasoning Ability",topic:"Seating Arrangement",difficulty:'Moderate',text:"Ten persons A, B, C, D, E, P, Q, R, S and T are sitting in a single row and all are facing to the North direction, but not necessarily in same order. A sits 4th from the extreme end. Three persons sit between A and B. C sits immediate right of B. Two persons sit between C and D. Three persons sit between R and C. R sits immediate left of P. E sits to the right of R. Two persons sit between S and T. S sits to the left of T. The number of persons sitting left of B is same as the number of persons sitting right of which of the following person?",options:["P","R","Q","S","None of these"],correct:1,explanation:"Matching the counts on each side identifies R as the person.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43006,setId:'set2',section:"Reasoning Ability",topic:"Direction Sense",difficulty:'Moderate',text:"Point A is 20m east of B. Point D is 15m west of point C. Point E is 45m south of point D. Point C is 30m north of point B. Point F is 15m north of point A. G is the midpoint of point B and point C. If H is the 15m south of point D, then what is the distance between point E and point H?",options:["20m","25m","30m","45m","None of these"],correct:2,explanation:"Plotting the points on a grid, E and H are 30m apart.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43007,setId:'set2',section:"Reasoning Ability",topic:"Direction Sense",difficulty:'Moderate',text:"Point A is 20m east of B. Point D is 15m west of point C. Point E is 45m south of point D. Point C is 30m north of point B. Point F is 15m north of point A. G is the midpoint of point B and point C. Four of the following five belongs to a group find the one that does not belong to that group? (E,B) is the odd pair.",options:["F,C","A,G","A,C","E,B","B,D"],correct:3,explanation:"F-C, A-G, A-C and B-D are pairs of points on the same north-south or east-west line; E-B is not.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43008,setId:'set2',section:"Reasoning Ability",topic:"Direction Sense",difficulty:'Moderate',text:"Point A is 20m east of B. Point D is 15m west of point C. Point E is 45m south of point D. Point C is 30m north of point B. Point F is 15m north of point A. G is the midpoint of point B and point C. In which direction and at what distance is point G, with respect to point F?",options:["20m east","30m west","30m east","20m west","None of these"],correct:3,explanation:"G lies 20m west of F once all coordinates are plotted.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43009,setId:'set2',section:"Reasoning Ability",topic:"Inequality",difficulty:'Moderate',text:"Statements: A>=M>=H>=K>=L<N<=B. Conclusions: I. A>L II. B>=K",options:["Only conclusion I follows","Only conclusion II follows","If either conclusion I or II follows","If neither conclusion I nor II follows","If both conclusions I and II follow"],correct:3,explanation:"L<N breaks the chain both ways, so neither A>L nor B>=K can be concluded with certainty.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43010,setId:'set3',section:"Reasoning Ability",topic:"Inequality",difficulty:'Moderate',text:"Statements: A>=M>=H>=K>=L>N>=B. Conclusions: I. A>=B II. B<K",options:["Only conclusion I follows","Only conclusion II follows","If either conclusion I or II follows","If neither conclusion I nor II follows","If both conclusions I and II follow"],correct:1,explanation:"A>=B cannot be guaranteed, but since L>N>=B and K>=L, B<K definitely holds -- only conclusion II follows.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43011,setId:'set3',section:"Reasoning Ability",topic:"Inequality",difficulty:'Moderate',text:"Statements: P<A<=R=K, S<=R<=N. Conclusions: I. N>P II. K<=N",options:["Only conclusion I follows","Only conclusion II follows","If either conclusion I or II follows","If neither conclusion I nor II follows","If both conclusions I and II follow"],correct:4,explanation:"Since R<=N and R=K, K<=N follows; and since P<A<=R<=N, N>P also follows -- both conclusions hold.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43012,setId:'set3',section:"Reasoning Ability",topic:"Inequality",difficulty:'Moderate',text:"Statements: M<=E<=L<=T>S, L>V. Conclusions: I. V>=S II. S>V",options:["Only conclusion I follows","Only conclusion II follows","If either conclusion I or II follows","If neither conclusion I nor II follows","If both conclusions I and II follow"],correct:2,explanation:"Statements imply V and S cannot both be ordered definitively; conclusions I (V>=S) and II (S>V) are complementary, so either I or II follows.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43013,setId:'set3',section:"Reasoning Ability",topic:"Inequality",difficulty:'Moderate',text:"Statements: P<A<=R=K, S<=R<=N. Conclusions: I. K>A II. A<=K",options:["Only conclusion I follows","Only conclusion II follows","If either conclusion I or II follows","If neither conclusion I nor II follows","If both conclusions I and II follow"],correct:1,explanation:"Since A<=R=K, A<=K definitely follows, but K>A is not guaranteed (they could be equal) -- only conclusion II follows.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43014,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Seminar Schedule)",difficulty:'Moderate',text:"Six Teachers P, Q, T, R, S and U attend seminars on two different dates, 15th and 28th, of three given months -- January, April and July. They all attend seminars on different subjects: Physics, Economics, History, Chemistry, Biology and Geography, but not necessarily in that order. T attends the seminar in the month having 30 days. Only one person attends the seminar between T and the one who attends the Geography seminar. Only three teachers attend the seminar between the History and Geography seminars. The number of persons attending before Q is the same as the number attending after the History seminar. Only two persons attend between Q and the Physics seminar. R attends the Biology seminar. U attends immediately after S. S does not attend in a month having fewer than 31 days. Q and P do not attend the Economics or Geography seminars. Who among the following teachers attends the seminar on 15th of April?",options:["Q","U","S","T","None of these"],correct:1,explanation:"Working through the schedule clues, U is the teacher on 15th April.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43015,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Seminar Schedule)",difficulty:'Moderate',text:"Six Teachers P, Q, T, R, S and U attend seminars on two different dates, 15th and 28th, of three given months -- January, April and July. They all attend seminars on different subjects: Physics, Economics, History, Chemistry, Biology and Geography, but not necessarily in that order. T attends the seminar in the month having 30 days. Only one person attends the seminar between T and the one who attends the Geography seminar. Only three teachers attend the seminar between the History and Geography seminars. The number of persons attending before Q is the same as the number attending after the History seminar. Only two persons attend between Q and the Physics seminar. R attends the Biology seminar. U attends immediately after S. S does not attend in a month having fewer than 31 days. Q and P do not attend the Economics or Geography seminars. Who among the following teachers attends the seminar immediately after T?",options:["R","U","S","P","None of these"],correct:0,explanation:"R attends immediately after T in the finalised schedule.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43016,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Seminar Schedule)",difficulty:'Moderate',text:"Six Teachers P, Q, T, R, S and U attend seminars on two different dates, 15th and 28th, of three given months -- January, April and July. They all attend seminars on different subjects: Physics, Economics, History, Chemistry, Biology and Geography, but not necessarily in that order. T attends the seminar in the month having 30 days. Only one person attends the seminar between T and the one who attends the Geography seminar. Only three teachers attend the seminar between the History and Geography seminars. The number of persons attending before Q is the same as the number attending after the History seminar. Only two persons attend between Q and the Physics seminar. R attends the Biology seminar. U attends immediately after S. S does not attend in a month having fewer than 31 days. Q and P do not attend the Economics or Geography seminars. How many teachers attend the seminar between S and P?",options:["One","Two","Four","Three","None of these"],correct:3,explanation:"Three teachers' seminars fall between S's and P's slots.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43017,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Seminar Schedule)",difficulty:'Moderate',text:"Six Teachers P, Q, T, R, S and U attend seminars on two different dates, 15th and 28th, of three given months -- January, April and July. They all attend seminars on different subjects: Physics, Economics, History, Chemistry, Biology and Geography, but not necessarily in that order. T attends the seminar in the month having 30 days. Only one person attends the seminar between T and the one who attends the Geography seminar. Only three teachers attend the seminar between the History and Geography seminars. The number of persons attending before Q is the same as the number attending after the History seminar. Only two persons attend between Q and the Physics seminar. R attends the Biology seminar. U attends immediately after S. S does not attend in a month having fewer than 31 days. Q and P do not attend the Economics or Geography seminars. Q attends the seminar on which of the following date and month?",options:["15 July","28 January","15 April","28 July","None of these"],correct:4,explanation:"None of the listed date/month options matches Q's actual slot.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43018,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Seminar Schedule)",difficulty:'Moderate',text:"Six Teachers P, Q, T, R, S and U attend seminars on two different dates, 15th and 28th, of three given months -- January, April and July. They all attend seminars on different subjects: Physics, Economics, History, Chemistry, Biology and Geography, but not necessarily in that order. T attends the seminar in the month having 30 days. Only one person attends the seminar between T and the one who attends the Geography seminar. Only three teachers attend the seminar between the History and Geography seminars. The number of persons attending before Q is the same as the number attending after the History seminar. Only two persons attend between Q and the Physics seminar. R attends the Biology seminar. U attends immediately after S. S does not attend in a month having fewer than 31 days. Q and P do not attend the Economics or Geography seminars. Which of the following teacher pairs attend the seminar in the same month?",options:["S and U","P and U","U and R","T and P","Q and S"],correct:4,explanation:"Q and S both attend seminars scheduled in the same month.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43019,setId:'set3',section:"Reasoning Ability",topic:"Number/Digit Analysis",difficulty:'Moderate',text:"How many such digits are there in the number '6384257' which are as far from the beginning of the number as they are from its end when the number is reversed (i.e. same as in the number series both from backward and forward)?",options:["None","One","Two","Three","More than three"],correct:4,explanation:"Checking each digit's position from both ends shows more than three digits satisfy the condition.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43020,setId:'set3',section:"Reasoning Ability",topic:"Classification",difficulty:'Moderate',text:"Four of the following five follow a certain pattern; find the one that does not belong to the group.",options:["ECA","QOM","GEC","FBD","MKI"],correct:3,explanation:"ECA, QOM, GEC and MKI each use alternate letters of the alphabet in reverse order; FBD breaks this pattern.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43021,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Sequencing)",difficulty:'Moderate',text:"Seven persons P, Q, R, S, T, V and W are buying different items one after another, not necessarily in that order. One person buys an item between Q and R. Three persons buy items between S and Q. T buys immediately before V. S buys before T. More than two persons buy items between T and S. W buys before P. How many persons buy items before R?",options:["None","One","Two","Three","More than three"],correct:2,explanation:"Buying order: S, W, R, P, Q, T, V. Two persons (S and W) buy before R.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43022,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Sequencing)",difficulty:'Moderate',text:"Seven persons P, Q, R, S, T, V and W are buying different items one after another, not necessarily in that order. One person buys an item between Q and R. Three persons buy items between S and Q. T buys immediately before V. S buys before T. More than two persons buy items between T and S. W buys before P. Who among the following buys an item just before T?",options:["P","Q","R","W","None of these"],correct:1,explanation:"Q buys the item immediately before T in the finalised order.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43023,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Sequencing)",difficulty:'Moderate',text:"Seven persons P, Q, R, S, T, V and W are buying different items one after another, not necessarily in that order. One person buys an item between Q and R. Three persons buy items between S and Q. T buys immediately before V. S buys before T. More than two persons buy items between T and S. W buys before P. The number of persons who buy items before W is the same as the number who buy after which of the following persons?",options:["T","V","P","Q","None of these"],correct:0,explanation:"The count before W matches the count after T.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43024,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Sequencing)",difficulty:'Moderate',text:"Seven persons P, Q, R, S, T, V and W are buying different items one after another, not necessarily in that order. One person buys an item between Q and R. Three persons buy items between S and Q. T buys immediately before V. S buys before T. More than two persons buy items between T and S. W buys before P. Which of the following is true regarding W?",options:["No one buys items before W","W buys before S","Two persons buy items between W and Q","One person buys between R and W","None is true"],correct:2,explanation:"Two persons buy items between W and Q in the finalised sequence.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43025,setId:'set3',section:"Reasoning Ability",topic:"Puzzle (Sequencing)",difficulty:'Moderate',text:"Seven persons P, Q, R, S, T, V and W are buying different items one after another, not necessarily in that order. One person buys an item between Q and R. Three persons buy items between S and Q. T buys immediately before V. S buys before T. More than two persons buy items between T and S. W buys before P. Four of the following five are alike in a certain way based on the group; find the one which does not belong.",options:["T-P","V-Q","P-W","Q-T","S-R"],correct:3,explanation:"T-P, V-Q, P-W and S-R share the same positional gap in the sequence; Q-T does not.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43026,setId:'set3',section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: Only a few books are reading. All readings are general. Conclusions: I. All books are general. II. Some general are reading.",options:["If only conclusion II follows","If neither I nor II follows","If both I and II follow","If only conclusion I follows","If either I or II follows"],correct:0,explanation:"'All readings are general' combined with 'only a few books are reading' means some general are reading follows, but not that all books are general.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43027,setId:'set3',section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: Only a few woods are trees. Only a few woods are stems. Conclusions: I. Some stems are trees is a possibility. II. Some stems are tree.",options:["If only conclusion II follows","If neither I nor II follows","If both I and II follow","If only conclusion I follows","If either I or II follows"],correct:3,explanation:"Since woods overlap partially with both trees and stems, 'some stems are trees' remains only a possibility, not a certainty -- only conclusion I follows.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43028,setId:'set3',section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: All jungles are parks. All parks are lake. Only a few lakes are rivers. Conclusions: I. All jungles are lakes. II. Some rivers are parks is a possibility.",options:["If only conclusion II follows","If neither I nor II follows","If both I and II follow","If only conclusion I follows","If either I or II follows"],correct:2,explanation:"Jungles are parks are lakes, so all jungles are lakes follows; and since some lakes are rivers overlapping parks, 'some rivers are parks' is a valid possibility -- both follow.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43029,setId:'set3',section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: No centers are venues. All places are venues. No places are laboratory. Conclusions: I. No places are centers. II. No center are laboratory.",options:["If only conclusion II follows","If neither I nor II follows","If both I and II follow","If either I or II follows","If only conclusion I follows"],correct:4,explanation:"Since no centers are venues and all places are venues, no places are centers follows -- only conclusion I follows.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43030,setId:'set3',section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: Some guns are steel. All steels are iron. All iron is silver. Conclusions: I. All guns are silver. II. Some guns are not silver.",options:["If only conclusion II follows","If neither I nor II follows","If both I and II follow","If either I or II follows","If only conclusion I follows"],correct:3,explanation:"Some guns are steel, all steel is iron, all iron is silver -- so some guns are definitely silver, but since only 'some' guns are steel, we cannot say all guns are silver, nor can we say some definitely aren't -- either conclusion I or II follows.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43031,setId:'set3',section:"Reasoning Ability",topic:"Circular Arrangement",difficulty:'Moderate',text:"Nine persons A, B, C, D, E, F, G, H and J are sitting around a circular table, not necessarily in the same order, all facing towards the centre. A sits 2nd to the right of B. F sits 4th to the left of A. Two persons sit between C and F. G is an immediate neighbour of J. G sits 2nd to the right of H. D sits 2nd to the left of E. E is not an immediate neighbour of A. Who among the following sits 3rd to the right of E?",options:["B","A","C","F","None of these"],correct:1,explanation:"A sits three seats to the right of E once the circle is fixed.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43032,setId:'set3',section:"Reasoning Ability",topic:"Circular Arrangement",difficulty:'Moderate',text:"Nine persons A, B, C, D, E, F, G, H and J are sitting around a circular table, not necessarily in the same order, all facing towards the centre. A sits 2nd to the right of B. F sits 4th to the left of A. Two persons sit between C and F. G is an immediate neighbour of J. G sits 2nd to the right of H. D sits 2nd to the left of E. E is not an immediate neighbour of A. How many persons sit between E and F?",options:["Two","One","Three","None","More than three"],correct:3,explanation:"E and F turn out to be adjacent, so no one sits between them.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43033,setId:'set3',section:"Reasoning Ability",topic:"Circular Arrangement",difficulty:'Moderate',text:"Nine persons A, B, C, D, E, F, G, H and J are sitting around a circular table, not necessarily in the same order, all facing towards the centre. A sits 2nd to the right of B. F sits 4th to the left of A. Two persons sit between C and F. G is an immediate neighbour of J. G sits 2nd to the right of H. D sits 2nd to the left of E. E is not an immediate neighbour of A. Who among the following sits exactly between C and E?",options:["B","A","D","F","None of these"],correct:0,explanation:"B sits exactly between C and E in the finalised circle.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43034,setId:'set3',section:"Reasoning Ability",topic:"Circular Arrangement",difficulty:'Moderate',text:"Nine persons A, B, C, D, E, F, G, H and J are sitting around a circular table, not necessarily in the same order, all facing towards the centre. A sits 2nd to the right of B. F sits 4th to the left of A. Two persons sit between C and F. G is an immediate neighbour of J. G sits 2nd to the right of H. D sits 2nd to the left of E. E is not an immediate neighbour of A. Who among the following sits immediately to the right of A?",options:["B","C","D","G","None of these"],correct:4,explanation:"None of the named persons sits immediately right of A; it's someone else in the arrangement.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43035,setId:'set3',section:"Reasoning Ability",topic:"Circular Arrangement",difficulty:'Moderate',text:"Nine persons A, B, C, D, E, F, G, H and J are sitting around a circular table, not necessarily in the same order, all facing towards the centre. A sits 2nd to the right of B. F sits 4th to the left of A. Two persons sit between C and F. G is an immediate neighbour of J. G sits 2nd to the right of H. D sits 2nd to the left of E. E is not an immediate neighbour of A. Four of the following five are alike in a certain way based on the group; find the one which does not belong.",options:["E-C","B-F","D-J","A-C","C-H"],correct:3,explanation:"E-C, B-F, D-J and C-H share the same seating gap; A-C does not.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43036,setId:'set3',section:"Quantitative Aptitude",topic:"Number Series",difficulty:'Moderate',text:"Find the wrong number in the given series: 212, 242, 278, 324, 392, 482, 602",options:["212","324","392","602","278"],correct:1,explanation:"The differences between consecutive terms should be 30,36,48,66,90,120 (itself increasing by 6,12,18,24,30); 324 breaks this pattern and should be 326.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43037,setId:'set3',section:"Quantitative Aptitude",topic:"Number Series",difficulty:'Moderate',text:"Find the wrong number in the given series: 12, 13, 28, 87, 351, 1765, 10596",options:["87","1765","10596","12","351"],correct:4,explanation:"The pattern is (previous x n) + n for n=1,2,3...: 12x1+1=13, 13x2+2=28, 28x3+3=87, 87x4+4=352 (not 351), 352x5+5=1765, 1765x6+6=10596.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43038,setId:'set3',section:"Quantitative Aptitude",topic:"Number Series",difficulty:'Moderate',text:"Find the wrong number in the given series: 189, 701, 1044, 1263, 1385, 1449, 1476",options:["1263","701","189","1449","1476"],correct:0,explanation:"The pattern adds successive cubes (8^3, 7^3, 6^3, 5^3, 4^3, 3^3); the correct fourth term should be 1260, not 1263.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43039,setId:'set3',section:"Quantitative Aptitude",topic:"Number Series",difficulty:'Moderate',text:"Find the wrong number in the given series: 9, 18, 76, 432, 3456, 34560, 414720",options:["414720","34560","3456","76","9"],correct:3,explanation:"The pattern multiplies by 2,4,6,8,10,12 successively; the correct third term should be 72, not 76.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43040,setId:'set3',section:"Quantitative Aptitude",topic:"Number Series",difficulty:'Moderate',text:"Find the wrong number in the given series: 12, 18, 30, 48, 72, 126, 204",options:["18","72","126","48","204"],correct:1,explanation:"The pattern is each term equals the sum of the previous two; the correct term should be 78, not 72.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43041,setId:'set3',section:"Quantitative Aptitude",topic:"Pie Chart + Table DI",difficulty:'Moderate',text:"A pie chart gives the percentage distribution of people who visited a park over four days (Monday 30%, Tuesday 35%, Wednesday 20%, Thursday 15%) out of a total of 1200 people, and a table gives the number of females who visited on each day: Monday 144, Tuesday 314, Wednesday 96, Thursday 128. Number of males who visited the park on Wednesday are what percent of total people visited on that day?",options:["40%","45%","60%","20%","25%"],correct:2,explanation:"People visiting on Wednesday = 1200x20% = 240; males = 240-96 = 144; 144/240 x100 = 60%.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43042,setId:'set3',section:"Quantitative Aptitude",topic:"Pie Chart + Table DI",difficulty:'Moderate',text:"Using the same park-visitor pie chart and female-count table (Monday 30% 144 females, Tuesday 35% 314 females, Wednesday 20% 96 females, Thursday 15% 128 females, total 1200), what is the ratio of males who visited on Monday to females who visited on Thursday?",options:["27:16","3:2","7:4","25:18","None of these"],correct:0,explanation:"Males on Monday = 1200x30%-144 = 216; ratio 216:128 = 27:16.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43043,setId:'set3',section:"Quantitative Aptitude",topic:"Pie Chart + Table DI",difficulty:'Moderate',text:"Using the same data, total females are how much more or less than the total number of males who visited the park over the 4 days?",options:["172","164","188","194","178"],correct:1,explanation:"Total females = 144+314+96+128 = 682; total males = 1200-682 = 518; difference = 682-518 = 164.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43044,setId:'set3',section:"Quantitative Aptitude",topic:"Pie Chart + Table DI",difficulty:'Moderate',text:"Using the same data, total males who visited the park on Wednesday are what percent of total people who visited on Monday?",options:["20%","25%","37.5%","40%","44.44%"],correct:3,explanation:"Males on Wednesday = 240-96 = 144; people on Monday = 1200x30% = 360; 144/360x100 = 40%.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43045,setId:'set3',section:"Quantitative Aptitude",topic:"Pie Chart + Table DI",difficulty:'Moderate',text:"Using the same data, if 25% of males who visited on Monday equals the number of males who visited the park on Friday, what is the ratio of males visited on Tuesday to males visited on Friday?",options:["2:1","5:4","3:2","5:6","None of the above"],correct:4,explanation:"Males on Tuesday = 1200x35%-314 = 106; males on Friday = 25%x216 = 54; ratio 106:54 = 53:27, which matches none of the listed ratios.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43046,setId:'set3',section:"Quantitative Aptitude",topic:"Trains",difficulty:'Moderate',text:"A train 200 m long moving at the speed of 25 m/sec crosses a man moving at a speed of 5 m/sec in the same direction. Find the time taken by the train to cross the man.",options:["18 sec","8 sec","10 sec","12 sec","6 sec"],correct:2,explanation:"Relative speed = 25-5 = 20 m/s; time = 200/20 = 10 seconds.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43047,setId:'set3',section:"Quantitative Aptitude",topic:"Probability",difficulty:'Moderate',text:"In a simultaneous throw of two dice, find the probability of getting a sum of 6.",options:["1/6","1/9","5/36","7/36","1/4"],correct:2,explanation:"Favourable outcomes for sum 6: (1,5),(2,4),(3,3),(4,2),(5,1) = 5 out of 36 total outcomes = 5/36.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43048,setId:'set3',section:"Quantitative Aptitude",topic:"Partnership",difficulty:'Moderate',text:"A started a business by investing Rs 12,000. After 7 months B joined him with some money. After a year the total profit was equally shared between the two. Find the amount invested by B.",options:["Rs 20880","Rs 24400","Rs 12800","Rs 28800","Rs 20550"],correct:3,explanation:"Equal profit share means 12000x12 = B x 5 (B invested for 5 months), so B = 144000/5 = Rs 28,800.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43049,setId:'set3',section:"Quantitative Aptitude",topic:"Mixtures",difficulty:'Moderate',text:"In one liter of mixture of alcohol and water, water is 30%. The amount of alcohol that must be added to the mixture so that the part of water in the mixture becomes 15% is:",options:["1.5 lit","0.5 lit","2 lit","3 lit","1 lit"],correct:4,explanation:"Water = 0.3 lit stays fixed; for water to be 15% of the new mixture, new total = 0.3/0.15 = 2 lit, so 1 lit of alcohol must be added.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43050,setId:'set3',section:"Quantitative Aptitude",topic:"Pipes & Cisterns",difficulty:'Moderate',text:"Two pipes A and B can fill a cistern in 15 hours and 12 hours respectively. Both pipes are opened simultaneously; due to a leakage in the cistern it takes 20 minutes extra to fill it up. Find the time taken by the leakage to empty the full cistern alone.",options:["80 hours","120 hours","180 hours","150 hours","140 hours"],correct:4,explanation:"A and B together take 60/9 hours normally; with the leak it takes 60/9+1/3 hours; solving for the leak's own rate gives 140 hours to empty the cistern alone.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43051,setId:'set3',section:"Quantitative Aptitude",topic:"Ages",difficulty:'Moderate',text:"The ratio of the age of father and son is 8:1. Father is 6 years older than mother. The ratio of the age of the son and mother is 1:7. Find the age of the father.",options:["56","42","36","34","48"],correct:4,explanation:"Let son=x, father=8x, mother=7x; father is 6 years older than mother: 8x=7x+6, so x=6; father's age = 8x = 48.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43052,section:"Quantitative Aptitude",topic:"Bar Graph DI",difficulty:'Moderate',text:"A bar chart shows laptops sold in April and May by 5 companies: A(800,1200), B(400,1000), C(1000,800), D(1200,960), E(600,1200). Laptops sold by companies B & C together in May are what percent more than laptops sold by company D in April?",options:["90%","50%","80%","20%","40%"],correct:1,explanation:"B+C in May = 1000+800 = 1800; D in April = 1200; (1800-1200)/1200x100 = 50%.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43053,section:"Quantitative Aptitude",topic:"Bar Graph DI",difficulty:'Moderate',text:"Using the same laptop-sales data, laptops sold by companies A & B together in April are how much more or less than the average number sold by companies C & E in May?",options:["400","1000","800","200","600"],correct:3,explanation:"A+B in April = 800+400 = 1200; average of C & E in May = (800+1200)/2 = 1000; difference = 200.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43054,section:"Quantitative Aptitude",topic:"Bar Graph DI",difficulty:'Moderate',text:"Using the same laptop-sales data, find the ratio of laptops sold by companies B & E together in April to laptops sold by companies C & D together in May.",options:["13:18","25:44","7:15","11:23","None of the above"],correct:1,explanation:"B+E in April = 400+600 = 1000; C+D in May = 800+960 = 1760; ratio = 1000:1760 = 25:44.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43055,section:"Quantitative Aptitude",topic:"Bar Graph DI",difficulty:'Moderate',text:"Using the same laptop-sales data, the average number of laptops sold by companies A, D & E in May is what percent of laptops sold by company C in April?",options:["112%","128%","84%","156%","144%"],correct:0,explanation:"Average of A, D, E in May = (1200+960+1200)/3 = 1120; C in April = 1000; 1120/1000x100 = 112%.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43056,section:"Quantitative Aptitude",topic:"Bar Graph DI",difficulty:'Moderate',text:"Using the same laptop-sales data, find total laptops sold by all 5 companies in May as what percent more or less than in April.",options:["18%","45%","50%","36%","29%"],correct:4,explanation:"Total in May = 1200+1000+800+960+1200 = 5160; total in April = 800+400+1000+1200+600 = 4000; (5160-4000)/4000x100 = 29%.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43057,section:"Quantitative Aptitude",topic:"Bar Graph DI",difficulty:'Moderate',text:"Using the same laptop-sales data, find the ratio of laptops sold by companies A & E together in April to laptops sold by companies B & D together in May.",options:["1:4","2:9","5:7","7:12","3:7"],correct:2,explanation:"A+E in April = 800+600 = 1400; B+D in May = 1000+960 = 1960; ratio = 1400:1960 = 5:7.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43058,section:"Quantitative Aptitude",topic:"Profit & Loss",difficulty:'Moderate',text:"The total cost price of two products is Rs 4400. One product is sold at 15% profit while the second is sold at 18% loss. If neither profit nor loss occurs overall, find the cost price of the first product.",options:["Rs 2400","Rs 2200","Rs 3000","Rs 3400","Rs 2800"],correct:0,explanation:"Setting x+y=4400 and 15%x=18%y for equal profit/loss cancellation gives x:y=6:5, so x = 6/11 x4400 = Rs 2400.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43059,section:"Quantitative Aptitude",topic:"Percentages / Salary",difficulty:'Moderate',text:"A man deposits 10% of his salary in PF and saves 30% of the remaining. His expenses on medicine and groceries are in ratio 3:4 of the remaining salary after saving. If his medicine expense was Rs 8100, find his monthly salary.",options:["Rs 30,000","Rs 25,000","Rs 20,000","Rs 35,000","None of these"],correct:0,explanation:"Working through the successive percentage deductions, monthly salary comes out to Rs 30,000.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43060,section:"Quantitative Aptitude",topic:"Mensuration",difficulty:'Moderate',text:"The surface area of a sphere is 616 sq.cm. Find the perimeter of a square if the diameter of the sphere is twice the side of the square.",options:["35 cm","28 cm","21 cm","42 cm","49 cm"],correct:1,explanation:"4*pi*r^2=616 gives r=7cm, so the square's side is half the diameter = 7cm; perimeter = 4x7 = 28 cm.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43061,section:"Quantitative Aptitude",topic:"Boats & Streams",difficulty:'Moderate',text:"A boat sailing at 10 km/h in still water starts chasing, from 10 km behind, another boat sailing at 4 km/h upstream, if the stream flows at 2 km/h. After how many hours will it catch up?",options:["4 h","2.5 h","2 h","3.5 h","None of these"],correct:1,explanation:"Upstream speeds: chasing boat 8 km/h, other boat 4 km/h; relative speed 4 km/h; time = 10/4 = 2.5 hours.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43062,section:"Quantitative Aptitude",topic:"Mensuration",difficulty:'Moderate',text:"The area of a rectangle is four times the area of a square. The rectangle's length is 60 cm and its breadth equals the square's side. Find the side of the square.",options:["20 cm","25 cm","18 cm","15 cm","22 cm"],correct:3,explanation:"60a = 4a^2, giving a = 15 cm.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43063,section:"Quantitative Aptitude",topic:"Time & Work",difficulty:'Moderate',text:"The ratio of efficiency of A and B in completing a work is 3:4. Both start working together but A leaves after 2 days. C then joins B, and together they complete the remaining work in 6 days. If A and B together can complete the work in 8 days, find how long C alone would take.",options:["27/4 days","56/3 days","41/3 days","28/3 days","49/3 days"],correct:1,explanation:"Setting A=3x, B=4x units/day, total work=56x from A+B's 8-day rate; after 2 days of A+B and 6 more days of B+C, solving gives C's alone time as 56/3 days.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43064,section:"Quantitative Aptitude",topic:"Partnership",difficulty:'Moderate',text:"A, B and C invest in a business in the ratio 6:8:9, for time periods in the ratio 4:3:4. If B's profit share at year end is Rs 16,750, find C's profit share.",options:["20225","22125","25225","25125","23125"],correct:3,explanation:"Profit ratio = 6x4:8x3:9x4 = 24:24:36 = 2:2:3; B's 2 parts = 16750, so 1 part = 8375, and C's 3 parts = 25125.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43065,section:"Quantitative Aptitude",topic:"Simplification",difficulty:'Moderate',text:"Simplify the value of (?): 3.02 squared over ?, plus 9.02 times 49.01, equals 12.02 times 6.03 divided by ?",options:["1/9","1/7","1/6","1/3","1/5"],correct:1,explanation:"Approximating each decimal to the nearest whole number and solving the resulting equation gives ? = 1/7.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43066,section:"Quantitative Aptitude",topic:"Simplification",difficulty:'Moderate',text:"Simplify the value of (?): 110.1 times (419.97 divided by 69.87), plus 499.9, minus 39.9, equals ? percent of 5600",options:["15","25","20","10","30"],correct:2,explanation:"Approximating gives 110x6+460=1120=?%of 5600, so ?=20.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43067,section:"Quantitative Aptitude",topic:"Simplification",difficulty:'Moderate',text:"Simplify the value of (?): 59.8% of 1539.5, plus 37.5% of 95.78, plus 0.99, equals (?) squared",options:["28","31","26","25","35"],correct:1,explanation:"Approximating: 60%of1540 + 3/8x96 + 1 = 924+36+1=961, and the square root of 961 is 31.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43068,section:"Quantitative Aptitude",topic:"Simplification",difficulty:'Moderate',text:"Simplify the value of (?): 74.98 squared, minus 24.99 squared, minus 30.02 squared, equals (?) cubed",options:["14","15","18","17","16"],correct:4,explanation:"Approximating: 75^2-25^2-30^2 = 5625-625-900=4100, whose cube root is approximately 16.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43069,section:"Quantitative Aptitude",topic:"Simplification",difficulty:'Moderate',text:"Simplify the value of (?): 2 raised to the power (?+2), equals (511.79 divided by 31.89) times (64.03 divided by 127.95) times 8.01",options:["6","5","4","3","7"],correct:2,explanation:"Approximating and equating powers of 2 on both sides gives ?+2=6, so ?=4.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43070,section:"Quantitative Aptitude",topic:"Simplification",difficulty:'Moderate',text:"Simplify the value of (?): 69.9% of 445.12, divided by 14.04, equals 436.1 divided by ?",options:["20","15","25","30","5"],correct:0,explanation:"Approximating gives 70%x445/14 = 436/?, solving gives ? approximately 20.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
{id:43071,section:"English Language",topic:"Reading Comprehension",difficulty:'Moderate',text:"Read the following passage and answer the question. Passage: If you're like most people, calling an insurance company isn't among your favorite activities. That's because the insurance industry is one of the least innovative areas for customer experience, meaning that customers typically come away from their interactions disappointed and dissatisfied. However, things are definitely changing, and artificial intelligence is playing a large role. The fast-growing technology has the potential to disrupt the entire industry and greatly improve the insurance customer experience. The insurance agency is notorious for its outdated processes. Filing a claim often looks the same today as it did decades ago because the industry isn't consistently leveraging new technologies that are available to them. If an employee is busy or on vacation, a claims request could sit still until the right person is back. The outdated processes make it harder for agents by increasing the workload and forcing them to work with antiquated systems and frustrated customers. However, AI can be applied to improve the claims process. Claims currently are touched by multiple employees. However, a new process of \"touch less\" claims is introduced in the industry. This process uses artificial intelligence and other technology to report the claim, capture damage, audit the system, and communicate with the customer. The potential here is huge, as the process could allow clients the chance to file claims without having to wade through red tape. Companies that have already automated some aspects of their claims process have seen a significant reduction in processing times and quality. AI-powered claims could also fight against one of the most costly elements of the insurance industry: fraudulent claims, which cost the industry more than $40 billion a year. Instead of relying on humans to manually comb through reports to catch inaccurate claims, AI algorithms can identify patterns in the data and recognize when something is fraudulent. The industry is definitely ripe for AI disruption. Customers expect to be able to interact with companies through modern technology; a recent survey found that 74% of consumers say they would be happy to get computer-generated insurance advice. Many insurance companies are already using artificial intelligence to some degree, and the number of companies following in their footsteps is sure to increase dramatically over the coming years. Artificial Intelligence has never been less expensive or more accessible, which means most companies don't have a reason not to adopt it in at least some form. Chatbots work through messaging apps many customers already have on their phones, which makes them a natural next step in customer interaction. In order to truly be effective, chatbots must have natural language processing and sentiment analysis so they can understand what customers are really asking. In the insurance space, chatbots can be used to answer basic questions and resolve claims, as well as sell products, address leads, or make sure customers are properly covered by their insurance. Traditionally, insurance companies used blanket methods like cold calling customers, but today's customers expect personalized sales tactics. AI can pull in customer data to create a full profile, instead of spending valuable time and money on the underwriting process, which typically includes invasive questions and surveys. AI can analyze data better than humans to more accurately predict each customer's risk, thereby providing customers with the right amount of insurance and companies with protection from risky customers. Question: Which option best explains the reason for customers to avoid interaction with insurance companies?",options:["Lack of modern technology.","Invasion through plethora of questions and surveys.","Busy schedules of customers","Both (a) and (b)","None of these"],correct:1,explanation:"The passage attributes customer dissatisfaction to invasive questions/surveys and outdated processes, not to modern technology or busy schedules.",source_type:'official',source_reference:'LIC AAO Prelims 2019 (Memory-Based)'},
