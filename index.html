{id:300,setId:'set3',section:'Reasoning Ability',topic:'Coding-Decoding',difficulty:'Moderate',text:"If in the word 'NEUROPATHY' all letters coming before Q in the alphabet are changed to their immediate succeeding letter, and all letters coming after Q are changed to their immediately preceding letter, then all repeated letters are eliminated and the remaining letters arranged alphabetically from left to right — find the letter that is 4th from the right end in the word thus formed.",options:['S','P','I','B','T'],correct:1,explanation:"After the letter-shift rule, NEUROPATHY becomes OFTQPQBSIX (with a repeated Q eliminated), giving BFIOPSTX in alphabetical order — the 4th letter from the right end is P.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:301,section:'Reasoning Ability',topic:'Syllogism (Possibility)',difficulty:'Moderate',text:"Statements: All rock is resist. Only a few resist is red. Some red is not real. Conclusions: I. All resist being red is a possibility. II. No real being rock is a possibility.",options:['Only I follows','Only II follows','Neither I nor II follows','Both I and II follow','Either I or II follows'],correct:1,explanation:"'Only a few resist is red' rules out the possibility that ALL resist is red, so conclusion I fails. Nothing in the statements links 'real' and 'rock' directly, so 'no real is rock' remains a valid possibility — only conclusion II follows.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:302,section:'Reasoning Ability',topic:'Syllogism (Possibility)',difficulty:'Moderate',text:"Statements: Only a few skirt is jeans. No jeans is shirt. All dress is shirt. Conclusions: I. Some dress is not jeans. II. No skirt is shirt.",options:['Only I follows','Only II follows','Neither I nor II follows','Both I and II follow','Either I or II follows'],correct:0,explanation:"Since all dress is shirt and no jeans is shirt, no dress can be jeans — which makes 'some dress is not jeans' true, so conclusion I follows. Since only a few skirt is jeans, the relation between the rest of skirt and shirt is undetermined, so conclusion II doesn't necessarily follow.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},

{id:303,section:'Reasoning Ability',topic:'Letter-Number Series',difficulty:'Moderate',text:"If we form a four-letter meaningful word using the first, third, fifth and eighth letters (from the left) of the word 'PROGRAMMING', what is the second letter (from the left) of the meaningful word thus formed? (Mark Z if more than one word is possible, X if none is possible.)",options:["P","R","O","X"],correct:2,explanation:"The 1st, 3rd, 5th and 8th letters of PROGRAMMING are P, O, R, M — these rearrange into the meaningful word 'ROMP', whose second letter is O.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},

{id:304,section:'Quantitative Aptitude',topic:'Boats & Streams',difficulty:'Moderate',text:"A boat takes 12 hours to cover (D + 30) km upstream and 8 hours to cover D km downstream. If the speed of the stream is 4 km/hr, find the time (in hours) taken by the boat to cover (D − 64) km upstream.",options:['8','10','7.5','6','10.5'],correct:0,explanation:"Solving the two time equations together gives D = 252 km and the boat's still-water speed = 27.5 km/hr (upstream speed 23.5 km/hr). Time for (252 − 64) = 188 km upstream = 188/23.5 = 8 hours.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:305,section:'Quantitative Aptitude',topic:'Simple Interest',difficulty:'Moderate',text:"A man invested Rs. x in scheme A at 20% p.a. simple interest for 3 years, and Rs. (x + 3000) in scheme B at 20% p.a. simple interest for 2 years. If the interest from scheme B is Rs. 400 more than from scheme A, find x (in Rs.).",options:['2000','4000','6000','8000','3000'],correct:1,explanation:"(x+3000)×0.4 − x×0.6 = 400 → 0.4x + 1200 − 0.6x = 400 → −0.2x = −800 → x = 4000.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:306,section:'Quantitative Aptitude',topic:'Ages',difficulty:'Moderate',text:"The present age of A is 40% less than B, and the present age of B is 25% less than C. Four years hence, the sum of ages of B and C will be 78 years. Find the present age (in years) of A.",options:['28','12','18','24','20'],correct:2,explanation:"Let C = 4x, so B = 3x (25% less than C), and A = 60% of B = 1.8x. From (4x+3x)+8=78, 7x=70, x=10, so A = 1.8×10 = 18 years.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:307,section:'Quantitative Aptitude',topic:'Partnership',difficulty:'Moderate',text:"A, B and C invested in a business in the ratio 5:4:6. After four months, B and C left the business. At the end of a year, the total profit is Rs. 2500. Find the profit share of A.",options:['1000 Rs.','1800 Rs.','1200 Rs.','1500 Rs.','900 Rs.'],correct:3,explanation:"Profit ratio = 5×12 : 4×4 : 6×4 = 60:16:24 = 15:4:6. A's share = 2500 × 15/25 = Rs. 1500.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:308,section:'Quantitative Aptitude',topic:'Mensuration',difficulty:'Moderate',text:"The length and breadth of a rectangular park are 300 m and 200 m respectively. If a 10 m wide path is constructed outside the park, find the area (in m²) of the path.",options:['12400','1040','11400','8400','10400'],correct:4,explanation:"Park area = 300×200 = 60,000 m². Including the path: 320×220 = 70,400 m². Path area = 70,400 − 60,000 = 10,400 m².",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:309,section:'Quantitative Aptitude',topic:'Mixtures & Alligation',difficulty:'Moderate',text:"A vessel contains a mixture of milk and water. The quantity of milk is 6 litres more than water, and the ratio of milk to water is 3:2. If 50% of the mixture is taken out, find the quantity of milk remaining in the final mixture.",options:['9','12','6','7.5','3'],correct:0,explanation:"Water = x, milk = x+6; (x+6)/x = 3/2 gives x = 12, so milk = 18 L in a 30 L mixture. Removing half (15 L) still leaves the 3:2 ratio, so remaining milk = 15 × 3/5 = 9 litres.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:310,section:'Quantitative Aptitude',topic:'Time & Work',difficulty:'Moderate',text:"A and B together read 88 pages in 11 hours, and B's efficiency is 40% less than A's. If A, B and C together can read 150 pages in 10 hours, find how many hours B and C together take to read 120 pages.",options:['10 hours','12 hours','8 hours','15 hours','16 hours'],correct:1,explanation:"A+B read 8 pages/hr. With B at 60% of A's rate, A=5 and B=3 pages/hr. A+B+C read 15 pages/hr, so C=7 pages/hr. B+C = 10 pages/hr, so 120 pages takes 12 hours.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:311,section:'Quantitative Aptitude',topic:'Trains',difficulty:'Moderate',text:"A 600 m long train crosses a bridge twice its own length in 90 seconds, and crosses another train moving in the opposite direction in 36 seconds. If the second train's speed is 6 km/hr more than the first, find the length of the second train.",options:['720 meters','640 meters','750 meters','840 meters','900 meters'],correct:4,explanation:"Bridge length = 1200 m, so train speed = 1800/90 = 20 m/s = 72 km/hr. Second train's speed = 78 km/hr. Combined speed × 36 sec gives (600+L) = 1500, so L = 900 meters.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:312,section:'Quantitative Aptitude',topic:'Pipes & Cisterns',difficulty:'Moderate',text:"Pipe A can fill 200/3% of a tank in 20 minutes, and pipes A & B together can fill 50% of the same tank in 12 minutes. Find what part of the tank pipe B can fill in 15 minutes.",options:['1/3rd','2/3rd','None of these','1/4th','3/4th'],correct:4,explanation:"Taking the tank as 60 units, pipe A fills at 2 units/min and pipes A+B together at 5 units/min, so B alone fills 3 units/min. In 15 minutes B fills 45 units — that's 3/4th of the tank.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:313,section:'Quantitative Aptitude',topic:'Profit & Loss',difficulty:'Moderate',text:"The cost price of article A is Rs. 600 more than that of article B, and the selling price of A is Rs. 1200 more than that of B. If the difference between the profits earned on the two articles is 40/3% of the cost price of A, and the profit received on A is 100/3%, find the profit earned on article B.",options:['Rs 800','Rs 900','Rs 840','Rs 960','Rs 1000'],correct:1,explanation:"Working through the cost-price and profit relationships gives the cost price of B as Rs. 3900, and the profit earned on article B works out to Rs. 900.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},

{id:314,section:'Quantitative Aptitude',topic:'Number Series',difficulty:'Moderate',text:"Find the wrong number in the series: 400, 689, 1050, 1579, 2306, 3381, 4750",options:['2306','689','4750','3381','400'],correct:0,explanation:"The pattern adds the square of consecutive primes: 400+17²=689, 689+19²=1050, 1050+23²=1579, 1579+29²=2420 (not 2306), 2420+31²=3381, 3381+37²=4750 — so 2306 is the wrong number.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:315,section:'Quantitative Aptitude',topic:'Number Series',difficulty:'Moderate',text:"Find the wrong number in the series: 6, 6, 18, 36, 144, 720, 4320",options:['144','18','4320','720','36'],correct:1,explanation:"The pattern multiplies by 1, 2, 3, 4, 5, 6 in turn: 6×1=6, 6×2=12 (not 18), 12×3=36, 36×4=144, 144×5=720, 720×6=4320 — so 18 is the wrong number.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},

{id:316,section:'English Language',topic:'Spelling',difficulty:'Moderate',text:"Find the incorrectly spelt word: 'The girl dishonoured her family as all her sibllings had graduated from college and she couldn't.'",options:['dishonoured','sibllings','graduated','college','No spelling errors'],correct:1,explanation:"'Sibllings' is misspelled — the correct spelling is 'siblings'.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:317,section:'English Language',topic:'Spelling',difficulty:'Moderate',text:"Find the incorrectly spelt word: 'As a way of offering congratulasions to the man, his new employees brought him presents.'",options:['congratulasions','employees','brought','presents','No spelling errors'],correct:0,explanation:"'Congratulasions' is misspelled — the correct spelling is 'congratulations'.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:318,section:'English Language',topic:'Spelling',difficulty:'Moderate',text:"Find the incorrectly spelt word: 'The protective attorney declined to disclose his client's current location.'",options:['protective','declined','disclose','current','No spelling errors'],correct:4,explanation:"All four highlighted words are spelled correctly, so the answer is 'No spelling errors'.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:319,section:'English Language',topic:'Spelling',difficulty:'Moderate',text:"Find the incorrectly spelt word: 'The instructor praised the photogrephy skills of the new intern.'",options:['instructor','praised','photogrephy','intern','No spelling errors'],correct:2,explanation:"'Photogrephy' is misspelled — the correct spelling is 'photography'.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:320,section:'English Language',topic:'Spelling',difficulty:'Moderate',text:"Find the incorrectly spelt word: 'Because of resent budget cuts, the government will cut down on many social subsidies.'",options:['resent','budget','social','subsidies','No spelling errors'],correct:0,explanation:"'Resent' is used where 'recent' (meaning happened not long ago) is intended — 'resent' is a different word with a different meaning, so it's the error here.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},

{id:321,section:'English Language',topic:'Vocabulary (Fill in the Blank)',difficulty:'Moderate',text:"Fill in the blank: 'As it ___ back and forth, the spastic train car appeared to be close to derailing.'",options:['lurched','alerted','collected','detected','pretended'],correct:0,explanation:"'Lurched' means made an abrupt, unsteady movement — exactly describing a train car rocking back and forth close to derailing.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:322,section:'English Language',topic:'Vocabulary (Fill in the Blank)',difficulty:'Moderate',text:"Fill in the blank: 'Because of the school's behavioural problems, the principal is unlikely to ___ a school dance competition this year.'",options:['present','obey','sanction','nod','label'],correct:2,explanation:"'Sanction' means to give official permission or approval for an action — fitting the context of the principal approving (or not) the competition.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:323,section:'English Language',topic:'Vocabulary (Fill in the Blank)',difficulty:'Moderate',text:"Fill in the blank: 'In today's world, many people ___ money and power constitute happiness.'",options:['intend','believe','exist','include','muddle'],correct:1,explanation:"'Believe' fits naturally with a clause expressing an opinion held to be true — 'many people believe that X constitutes happiness'.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},
{id:324,section:'English Language',topic:'Vocabulary (Fill in the Blank)',difficulty:'Moderate',text:"Fill in the blank: 'The king was ___ of his adviser's motive for wanting to declare war.'",options:['brave','cynical','honourable','irritable','jumbled'],correct:1,explanation:"'Cynical of' is the correct collocation, meaning distrustful of someone's sincerity or motives — fitting a king suspicious of his adviser's reasons.",source_type:'official',source_reference:'LIC AAO Prelims Memory Based Paper 2023 (17 Feb) — Official Source Questions'},

{"id": 48001, "section": "Reasoning Ability", "topic": "Coding-Decoding", "difficulty": "Moderate-Hard", "text": "Study the following information carefully.\n\"Jacket coat pen paper\" is coded as \"fl rp ms dv\"\n\"Sharp pen paper note\" is coded as \"yt ms dv kc\"\n\"The jacket big note\" is coded as \"tx kc fl hz\"\n\"Sharp big coat paper\" is coded as \"dv hz rp yt\"\n\nWhat is the code for 'coat'?", "options": ["yt", "kc", "rp", "dv", "hz"], "correct": 2, "explanation": "Decoded: jacket=fl, coat=rp, pen=ms, paper=dv, sharp=yt, note=kc, big=hz, the=tx. So coat = rp.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48002, "section": "Reasoning Ability", "topic": "Coding-Decoding", "difficulty": "Moderate-Hard", "text": "Study the following information carefully.\n\"Jacket coat pen paper\" is coded as \"fl rp ms dv\"\n\"Sharp pen paper note\" is coded as \"yt ms dv kc\"\n\"The jacket big note\" is coded as \"tx kc fl hz\"\n\"Sharp big coat paper\" is coded as \"dv hz rp yt\"\n\nWhat is the code for 'pen note'?", "options": ["ms kc", "kc dv", "yt kc", "ms gb", "rp kc"], "correct": 0, "explanation": "Decoded: jacket=fl, coat=rp, pen=ms, paper=dv, sharp=yt, note=kc, big=hz, the=tx. pen note = ms kc.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48003, "section": "Reasoning Ability", "topic": "Coding-Decoding", "difficulty": "Moderate-Hard", "text": "Study the following information carefully.\n\"Jacket coat pen paper\" is coded as \"fl rp ms dv\"\n\"Sharp pen paper note\" is coded as \"yt ms dv kc\"\n\"The jacket big note\" is coded as \"tx kc fl hz\"\n\"Sharp big coat paper\" is coded as \"dv hz rp yt\"\n\nWhich of the following words is definitely coded as 'tx'?", "options": ["Paper", "The", "Big", "Note", "Sharp"], "correct": 1, "explanation": "Decoded: jacket=fl, coat=rp, pen=ms, paper=dv, sharp=yt, note=kc, big=hz, the=tx. 'The' = tx.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48004, "section": "Reasoning Ability", "topic": "Coding-Decoding", "difficulty": "Moderate-Hard", "text": "Study the following information carefully.\n\"Jacket coat pen paper\" is coded as \"fl rp ms dv\"\n\"Sharp pen paper note\" is coded as \"yt ms dv kc\"\n\"The jacket big note\" is coded as \"tx kc fl hz\"\n\"Sharp big coat paper\" is coded as \"dv hz rp yt\"\n\nWhich of the following is the code for the word 'jacket'?", "options": ["fl", "dv", "ms", "hz", "Can't be determined"], "correct": 0, "explanation": "Decoded: jacket=fl, coat=rp, pen=ms, paper=dv, sharp=yt, note=kc, big=hz, the=tx. jacket = fl.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48005, "section": "Reasoning Ability", "topic": "Coding-Decoding", "difficulty": "Moderate-Hard", "text": "Study the following information carefully.\n\"Jacket coat pen paper\" is coded as \"fl rp ms dv\"\n\"Sharp pen paper note\" is coded as \"yt ms dv kc\"\n\"The jacket big note\" is coded as \"tx kc fl hz\"\n\"Sharp big coat paper\" is coded as \"dv hz rp yt\"\n\nWhich of the following statements is definitely true?", "options": ["'Pen' is coded as 'kc'.", "'Note' is coded as 'dv'.", "'Jacket' is coded as 'rp'.", "'Coat' is coded as 'fl'.", "None is true"], "correct": 4, "explanation": "Decoded: jacket=fl, coat=rp, pen=ms, paper=dv, sharp=yt, note=kc, big=hz, the=tx. Pen=ms, note=kc, jacket=fl, coat=rp, so statements A-D are all false.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48006, "section": "Reasoning Ability", "topic": "Direction & Distance", "difficulty": "Moderate-Hard", "text": "Study the following information carefully.\nPoint A is 22m north of point B. Point D is 17m south of point C. Point F is 15m west of point E. Point G is 19m north of point F. Point C is 9m east of point B. Point E is 5m east of point D.\n\nWhat is the shortest distance between point A and point D?", "options": ["40m", "42m", "√1585 m", "39m", "√1602 m"], "correct": 4, "explanation": "Taking B=(0,0): A=(0,22), C=(9,0), D=(9,-17), E=(14,-17), F=(-1,-17), G=(-1,2). A to D: horizontal 9 m, vertical 22+17 = 39 m, so distance = √(39²+9²) = √1602 m.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48007, "section": "Reasoning Ability", "topic": "Direction & Distance", "difficulty": "Moderate-Hard", "text": "Study the following information carefully.\nPoint A is 22m north of point B. Point D is 17m south of point C. Point F is 15m west of point E. Point G is 19m north of point F. Point C is 9m east of point B. Point E is 5m east of point D.\n\nFour of the following five pairs are alike in a certain way. Find the pair which doesn't belong to the group.", "options": ["AC", "GB", "CE", "BE", "BF"], "correct": 4, "explanation": "Taking B=(0,0): A=(0,22), C=(9,0), D=(9,-17), E=(14,-17), F=(-1,-17), G=(-1,2). In AC, GB, CE and BE the first point is to the north-west of the second. In BF, B is to the north-east of F, so BF is the odd one.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48008, "section": "Reasoning Ability", "topic": "Direction & Distance", "difficulty": "Moderate-Hard", "text": "Study the following information carefully.\nPoint A is 22m north of point B. Point D is 17m south of point C. Point F is 15m west of point E. Point G is 19m north of point F. Point C is 9m east of point B. Point E is 5m east of point D.\n\nIn which direction is point F with respect to point A?", "options": ["South-west", "North-west", "South-east", "North-east", "West"], "correct": 0, "explanation": "Taking B=(0,0): A=(0,22), C=(9,0), D=(9,-17), E=(14,-17), F=(-1,-17), G=(-1,2). F(-1,-17) is below and slightly left of A(0,22): south-west.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48009, "section": "Reasoning Ability", "topic": "Inequality", "difficulty": "Moderate-Hard", "text": "Statements: H > S > U = Z > N ≤ J = Q > M\nConclusions: I. Z < H   II. Q > U\n\nGive answer:", "options": ["If only conclusion I is true", "If only conclusion II is true", "If either conclusion I or II is true", "If neither conclusion I nor II is true", "If both conclusions I and II are true"], "correct": 0, "explanation": "H > S > U = Z gives Z < H (I true). Z > N ≤ J = Q gives no fixed relation between Q and U (II false). Only I follows.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48010, "section": "Reasoning Ability", "topic": "Inequality", "difficulty": "Moderate-Hard", "text": "Statements: H > M ≥ X = C ≤ Q ≥ V ≥ T > L\nConclusions: I. H > C   II. Q > L\n\nGive answer:", "options": ["If only conclusion I is true", "If only conclusion II is true", "If either conclusion I or II is true", "If both conclusions I and II are true", "If neither conclusion I nor II is true"], "correct": 3, "explanation": "H > M ≥ X = C gives H > C (I true). Q ≥ V ≥ T > L gives Q > L (II true). Both follow.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48011, "section": "Reasoning Ability", "topic": "Puzzle (Date/Month)", "difficulty": "Moderate-Hard", "text": "Ten persons – A, B, C, D, E, F, G, H, I and J – were born on two different dates, 12th and 27th, of the months January, April, May, August and October of the same year.\nD was born on an even date in the month having an odd number of days. Four persons were born between D and B. More than three persons were born between B and C. One person was born between C and E but on the same date. C was not born before May. As many persons were born before E as after J. J was not born in January. A was born three months before F. Three persons were born between A and H. H and G were born on the same date. G was not born in May.\n\nWho among the following was born on 27th May?", "options": ["E", "D", "I", "H", "F"], "correct": 2, "explanation": "Final order (Jan 12 to Oct 27): A, B, J, F, H, I, D, E, G, C. 27 May = I.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48012, "section": "Reasoning Ability", "topic": "Puzzle (Date/Month)", "difficulty": "Moderate-Hard", "text": "Ten persons – A, B, C, D, E, F, G, H, I and J – were born on two different dates, 12th and 27th, of the months January, April, May, August and October of the same year.\nD was born on an even date in the month having an odd number of days. Four persons were born between D and B. More than three persons were born between B and C. One person was born between C and E but on the same date. C was not born before May. As many persons were born before E as after J. J was not born in January. A was born three months before F. Three persons were born between A and H. H and G were born on the same date. G was not born in May.\n\nWhich of the following statement(s) is/are true?\nI. G was born in the month of October.\nII. The number of persons born after H is one more than the number born before D.\nIII. B was born after J.", "options": ["Only III", "Only II", "Both I and II", "Only I", "All I, II and III"], "correct": 3, "explanation": "Final order (Jan 12 to Oct 27): A, B, J, F, H, I, D, E, G, C. I true (G = 12 Oct). II false (5 after H, 6 before D). III false (B is before J).", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48013, "section": "Reasoning Ability", "topic": "Puzzle (Date/Month)", "difficulty": "Moderate-Hard", "text": "Ten persons – A, B, C, D, E, F, G, H, I and J – were born on two different dates, 12th and 27th, of the months January, April, May, August and October of the same year.\nD was born on an even date in the month having an odd number of days. Four persons were born between D and B. More than three persons were born between B and C. One person was born between C and E but on the same date. C was not born before May. As many persons were born before E as after J. J was not born in January. A was born three months before F. Three persons were born between A and H. H and G were born on the same date. G was not born in May.\n\nHow many persons were born between B and I?", "options": ["Four", "Two", "Three", "Six", "Five"], "correct": 2, "explanation": "Final order (Jan 12 to Oct 27): A, B, J, F, H, I, D, E, G, C. B is 2nd, I is 6th, so 3 persons (J, F, H) are between them.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48014, "section": "Reasoning Ability", "topic": "Puzzle (Date/Month)", "difficulty": "Moderate-Hard", "text": "Ten persons – A, B, C, D, E, F, G, H, I and J – were born on two different dates, 12th and 27th, of the months January, April, May, August and October of the same year.\nD was born on an even date in the month having an odd number of days. Four persons were born between D and B. More than three persons were born between B and C. One person was born between C and E but on the same date. C was not born before May. As many persons were born before E as after J. J was not born in January. A was born three months before F. Three persons were born between A and H. H and G were born on the same date. G was not born in May.\n\nOn which date and in which month was E born?", "options": ["12th April", "27th August", "27th January", "12th October", "12th August"], "correct": 1, "explanation": "Final order (Jan 12 to Oct 27): A, B, J, F, H, I, D, E, G, C. E = 27 August.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48015, "section": "Reasoning Ability", "topic": "Puzzle (Date/Month)", "difficulty": "Moderate-Hard", "text": "Ten persons – A, B, C, D, E, F, G, H, I and J – were born on two different dates, 12th and 27th, of the months January, April, May, August and October of the same year.\nD was born on an even date in the month having an odd number of days. Four persons were born between D and B. More than three persons were born between B and C. One person was born between C and E but on the same date. C was not born before May. As many persons were born before E as after J. J was not born in January. A was born three months before F. Three persons were born between A and H. H and G were born on the same date. G was not born in May.\n\nThe number of persons born between J and C is ________ the number of persons born between E and F.", "options": ["Twice", "Equal to", "One more than", "Two less than", "One less than"], "correct": 0, "explanation": "Final order (Jan 12 to Oct 27): A, B, J, F, H, I, D, E, G, C. Between J and C there are 6 persons; between E and F there are 3. 6 is twice 3.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48016, "section": "Computer Awareness", "topic": "Networking", "difficulty": "Moderate-Hard", "text": "In networking, the primary role of SMTP is to:", "options": ["File transfer", "Sending email", "Remote device control", "IP assignment", "Data encryption"], "correct": 1, "explanation": "SMTP (Simple Mail Transfer Protocol) sends email between mail servers. FTP handles file transfer, Telnet/SSH remote control, DHCP IP assignment, SSL/TLS encryption.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48017, "section": "Computer Awareness", "topic": "Cyber Security", "difficulty": "Moderate-Hard", "text": "A spam is a/an:", "options": ["unsolicited e-mail", "application", "operating system", "newsgroup", "None of the above"], "correct": 0, "explanation": "Spam is unsolicited bulk e-mail, usually advertising.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48018, "section": "Computer Awareness", "topic": "Cyber Security", "difficulty": "Moderate-Hard", "text": "\"Theft of login credentials by a fake login page\" is an example of:", "options": ["Worm infection", "Phishing attack", "Antivirus", "Software update", "None of the above"], "correct": 1, "explanation": "A fake login page used to steal credentials is a phishing attack.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48019, "section": "Computer Awareness", "topic": "Basics", "difficulty": "Moderate-Hard", "text": "Which of the following is the correct order of data hierarchy from smallest to largest?", "options": ["Bit, Byte, Kilobyte, Megabyte, Gigabyte, Terabyte, Petabyte", "Byte, Bit, Kilobyte, Megabyte, Gigabyte, Terabyte, Petabyte", "Bit, Byte, Megabyte, Kilobyte, Gigabyte, Petabyte, Terabyte", "Byte, Bit, Megabyte, Kilobyte, Gigabyte, Terabyte, Petabyte", "None of the above"], "correct": 0, "explanation": "Bit < Byte < KB < MB < GB < TB < PB; each step is about 1,024 times the previous.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48020, "section": "Computer Awareness", "topic": "Shortcuts", "difficulty": "Moderate-Hard", "text": "Which of the following shortcut keys is used to select all the content in a document?", "options": ["Ctrl + C", "Ctrl + X", "Ctrl + A", "Ctrl + S", "Ctrl + V"], "correct": 2, "explanation": "Ctrl + A selects all. C copies, X cuts, S saves, V pastes.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48021, "section": "Computer Awareness", "topic": "Basics", "difficulty": "Moderate-Hard", "text": "QWERTY is used with reference to:", "options": ["Monitor", "Mouse", "Keyboard", "Printer", "None of the above"], "correct": 2, "explanation": "QWERTY is the standard keyboard key layout.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48022, "section": "Computer Awareness", "topic": "MS Office", "difficulty": "Moderate-Hard", "text": "Which of the following shortcut keys is used to insert a hyperlink in MS Word 365?", "options": ["Shift + H", "Ctrl + K", "Ctrl + H", "Shift + K", "None of the above"], "correct": 1, "explanation": "Ctrl + K opens Insert Hyperlink. Ctrl + H is Find and Replace.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48023, "section": "Computer Awareness", "topic": "Operating Systems", "difficulty": "Moderate-Hard", "text": "Which of the following is an Open source operating system?", "options": ["MS-DOS", "iOS", "Linux", "Windows", "Internet explorer"], "correct": 2, "explanation": "Linux is open source.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48024, "section": "Computer Awareness", "topic": "Basics", "difficulty": "Moderate-Hard", "text": "Which generation of computers first introduced mini-computers and improved time-sharing and multi-programming operating systems?", "options": ["First", "Second", "Third", "Fourth", "Fifth"], "correct": 2, "explanation": "The third generation (integrated circuits, roughly 1964-71) brought mini-computers such as the PDP-8 and time-sharing systems.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48025, "section": "Computer Awareness", "topic": "Cyber Security", "difficulty": "Moderate-Hard", "text": "An attempt to obtain or alter someone's IP address or DNS information is known as which of the following?", "options": ["Phishing", "Spoofing", "Vishing", "Sniffing", "Spooling"], "correct": 1, "explanation": "Falsifying IP or DNS information is spoofing (IP spoofing, DNS spoofing).", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48026, "section": "Quantitative Aptitude", "topic": "Data Interpretation", "difficulty": "Moderate-Hard", "text": "Pie chart I shows the percentage distribution of total employees (males and females) of four companies; total = 1200: A 30%, B 25%, C 10%, D Y%.\nPie chart II shows the distribution of female employees; total females = 540: A 216, B X, C 81, D 135.\n\nFind the ratio between the total number of male employees in A and B together to the total number of female employees in D.", "options": ["111:46", "112:45", "110:47", "113:49", "115:43"], "correct": 1, "explanation": "Y = 100-(30+25+10) = 35; X = 540-(216+81+135) = 108. Totals: A 360, B 300, C 120, D 420. Males: A 144, B 192, C 39, D 285. (144+192):135 = 336:135 = 112:45.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48027, "section": "Quantitative Aptitude", "topic": "Data Interpretation", "difficulty": "Moderate-Hard", "text": "Pie chart I shows the percentage distribution of total employees (males and females) of four companies; total = 1200: A 30%, B 25%, C 10%, D Y%.\nPie chart II shows the distribution of female employees; total females = 540: A 216, B X, C 81, D 135.\n\nTotal number of male employees in C is how much percentage more or less than the total number of female employees in B (approx.)?", "options": ["64%", "69%", "45%", "41%", "57%"], "correct": 0, "explanation": "Y = 100-(30+25+10) = 35; X = 540-(216+81+135) = 108. Totals: A 360, B 300, C 120, D 420. Males: A 144, B 192, C 39, D 285. (108-39)/108 x 100 = 63.9%, about 64% (less).", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48028, "section": "Quantitative Aptitude", "topic": "Data Interpretation", "difficulty": "Moderate-Hard", "text": "Pie chart I shows the percentage distribution of total employees (males and females) of four companies; total = 1200: A 30%, B 25%, C 10%, D Y%.\nPie chart II shows the distribution of female employees; total females = 540: A 216, B X, C 81, D 135.\n\nTotal number of male employees in E is 2X and the total number of female employees in E is (Y+5)% more than that in D. Find the difference between the total employees (males and females) in A and that in E.", "options": ["60", "40", "55", "50", "45"], "correct": 4, "explanation": "Y = 100-(30+25+10) = 35; X = 540-(216+81+135) = 108. Totals: A 360, B 300, C 120, D 420. Males: A 144, B 192, C 39, D 285. Males in E = 216; females in E = 135 x 1.40 = 189; total E = 405. 405-360 = 45.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48029, "section": "Quantitative Aptitude", "topic": "Data Interpretation", "difficulty": "Moderate-Hard", "text": "Pie chart I shows the percentage distribution of total employees (males and females) of four companies; total = 1200: A 30%, B 25%, C 10%, D Y%.\nPie chart II shows the distribution of female employees; total females = 540: A 216, B X, C 81, D 135.\n\n20% of female employees in D are graduates and the rest non-graduates. The number of non-graduate male employees in D is 25% more than the number of non-graduate female employees. Find the average of the number of graduate male employees and the number of non-graduate female employees.", "options": ["128", "132", "134", "129", "130"], "correct": 3, "explanation": "Y = 100-(30+25+10) = 35; X = 540-(216+81+135) = 108. Totals: A 360, B 300, C 120, D 420. Males: A 144, B 192, C 39, D 285. Non-graduate females in D = 108; non-graduate males = 135; graduate males = 285-135 = 150. Average = (150+108)/2 = 129.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48030, "section": "Quantitative Aptitude", "topic": "Data Interpretation", "difficulty": "Moderate-Hard", "text": "Pie chart I shows the percentage distribution of total employees (males and females) of four companies; total = 1200: A 30%, B 25%, C 10%, D Y%.\nPie chart II shows the distribution of female employees; total females = 540: A 216, B X, C 81, D 135.\n\nThe total number of female employees in B is what percentage of the difference between the total number of employees (males and females) in C and D?", "options": ["31%", "36%", "34%", "33%", "39%"], "correct": 1, "explanation": "Y = 100-(30+25+10) = 35; X = 540-(216+81+135) = 108. Totals: A 360, B 300, C 120, D 420. Males: A 144, B 192, C 39, D 285. 108/(420-120) x 100 = 36%.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48031, "section": "Quantitative Aptitude", "topic": "Simplification", "difficulty": "Moderate-Hard", "text": "What should come in place of the question mark (?) in the following question?\n\n(11/7) of 210% of ? = √121 × 6", "options": ["20", "30", "50", "60", "10"], "correct": 0, "explanation": "(11/7) x 2.1 x ? = 66, so 3.3 x ? = 66 and ? = 20.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48032, "section": "Quantitative Aptitude", "topic": "Simplification", "difficulty": "Moderate-Hard", "text": "What should come in place of the question mark (?) in the following question?\n\n(36% of 2000 + 76% of 6000) ÷ 32 = ? × 47 − 1278 + 33", "options": ["50", "60", "30", "40", "70"], "correct": 2, "explanation": "(720+4560)/32 = 165. So 165 = ? x 47 - 1245, giving ? x 47 = 1410 and ? = 30.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},
{"id": 48033, "section": "Quantitative Aptitude", "topic": "Simplification", "difficulty": "Moderate-Hard", "text": "What should come in place of the question mark (?) in the following question?\n\n54 × 72 − 25 × 68 + 562 − 795 = (89 + ?) × 17", "options": ["35", "26", "42", "30", "32"], "correct": 1, "explanation": "3888-1700+562-795 = 1955 = (89+?) x 17, so 89+? = 115 and ? = 26.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},

{"id": 48036, "section": "English Language", "topic": "Cloze Test", "difficulty": "Moderate-Hard", "text": "In the following paragraph, a few parts have been omitted and denoted by letters. Select the most appropriate phrase to fill blank (A).\n\nMedical devices play an important role in modern healthcare systems, contributing to the diagnosis, treatment, and monitoring of diseases and medical conditions. ______ (A) India’s population, there is a significant demand for such devices, and yet there exists a substantial demand–supply gap. With an overall import dependency of 70% to 80%, ensuring the quality, safety, affordability, and accessibility of such devices ______ (B) of patients. Recognising the immense growth potential ______ (C), both domestic and international medical device manufacturers are actively pursuing opportunities in the Indian market.\nTo promote the domestic medical device sector, the governments in the past had introduced various initiatives and policies. The medical device sector was identified as a focus area during the “Make in India” campaign in 2014. However, in the context of inconsistent regulations, ______ (D), varying standards of manufacturing, weak research and development (R&D) ecosystem and limited capital, these initiatives have failed to deliver the desired results. Realising the challenges ______ (E) and unsustainable import bills and affordable medical technology, the union government approved the National Medical Devices Policy on 2 May 2023.", "options": ["With the subtle growth", "Even with the ever growing", "Given the large size of", "Since the giant of", "With tremendous"], "correct": 2, "explanation": "'Given the large size of India's population' is grammatical and gives the reason for the high demand.", "source_type": "official", "source_reference": "OICL AO Mains 2026 (28 Feb 2026, Shift 1) — Memory Based"},

QUESTIONS.forEach(q=>{const f=s=>String(s).replace(/<(?=[a-zA-Z\/!])/g,'&lt;');q.text=f(q.text);q.options=q.options.map(f);q.explanation=f(q.explanation||'');});


const SET_COLORS={set1:'#10b981',set2:'#14b8a6',set3:'#f59e0b',set4:'#f97316',set5:'#ef4444',concor1:'#4f46e5',uiic1:'#7c3aed',nicl24:'#0ea5e9',sbic:'#ec4899',oicl1:'#06b6d4'};
function setQs(s){if(typeof s==='string')s=SETS.find(x=>x.id===s);return s.f?QUESTIONS.filter(s.f):QUESTIONS.filter(q=>q.setId===s.id);}
function setMins(s,qs){return s.minutes||(qs.length?Math.max(20,Math.round(qs.length*1.2)):0);}
function setRow(s){const qs=setQs(s);return `<div class="setrow" style="--c:${SET_COLORS[s.id]||'#6366f1'}"><div><b>${s.label}</b><span class="pill">${s.difficulty}</span><div class="muted" style="font-size:12px;margin-top:3px">${qs.length} questions · ${setMins(s,qs)} min · −0.25 per wrong</div></div><button class="btn ${qs.length?'btn-primary':''}" ${qs.length?'':'disabled'} onclick="startSetExam('${s.id}')">${qs.length?'Start ▶':'Not ready yet'}</button></div>`;}
function secTag(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return `<span class="tag" style="background:hsl(${h} 75% 50% / .16);color:hsl(${h} 65% var(--tagL))">${s}</span>`;}
function startRandomSet(){const ready=SETS.filter(s=>setQs(s).length);if(!ready.length){alert('No sets ready yet.');return;}startSetExam(ready[Math.floor(Math.random()*ready.length)].id);}

// ---- Storage helpers ----
function loadDB(){
  try{ const raw=localStorage.getItem(STORE_KEY); return raw? JSON.parse(raw): {attempts:[], currentAttempt:null, favorites:[], customQuestions:[], settings:{}, dismissed:{}}; }
  catch(e){ return {attempts:[], currentAttempt:null, favorites:[], customQuestions:[], settings:{}, dismissed:{}}; }
}
function saveDB(db){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }catch(e){} }

function exportData(){
  db.settings=db.settings||{}; db.settings.lastBackup=Date.now(); saveDB(db);
  const payload=Object.assign({_meta:{app:'Exam Prep Engine',version:7,exportedAt:new Date().toISOString(),attempts:db.attempts.length,questionsInBank:QUESTIONS.length}},db);
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'exam-engine-backup-'+new Date().toISOString().slice(0,16).replace('T','_').replace(':','-')+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function toggleAutoBackup(v){ db.settings.autoBackup=!!v; saveDB(db); }
function backupNudge(){
  const lb=(db.settings||{}).lastBackup;
  if(!lb) return db.attempts.length?'<p style="color:var(--red);font-weight:600;font-size:13px">⚠ You have exam history but no backup yet — click Export now.</p>':'<p class="muted" style="font-size:13px">No backup made yet.</p>';
  const d=Math.floor((Date.now()-lb)/86400000);
  return `<p style="font-size:13px;${d>7?'color:var(--red);font-weight:600':'color:var(--green)'}">Last backup: ${new Date(lb).toLocaleString()} (${d} day${d===1?'':'s'} ago)${d>7?' — time for a fresh one.':''}</p>`;
}

function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ alert('This file is not valid JSON — import cancelled.'); return; }
    if(!parsed || !Array.isArray(parsed.attempts)){ alert('This does not look like an Exam Engine backup file — import cancelled.'); return; }
    if(!confirm('This will replace all current data (attempts, favourites, settings, custom questions) in this browser with the imported backup. Continue?')) return;
    db = parsed; delete db._meta; db.settings=db.settings||{}; db.dismissed=db.dismissed||{};
    if(!db.favorites) db.favorites = [];
    if(!db.customQuestions) db.customQuestions = [];
    (db.customQuestions||[]).forEach(q=>{ if(!QUESTIONS.find(x=>x.id===q.id)) QUESTIONS.push(q); });
    saveDB(db);
    render();
  };
  reader.readAsText(file);
}

let db = loadDB();
db.settings=db.settings||{}; db.dismissed=db.dismissed||{};
if(!db.favorites) db.favorites = [];
let timerInterval = null;

function activeQuestions(att){
  const ids = att.questionIds || QUESTIONS.map(q=>q.id);
  return ids.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
}

function flushTimeSpent(att){
  if(!att || !att.questionEnteredAt) return;
  const qs = activeQuestions(att);
  const q = qs[att.currentQ];
  if(!q) return;
  const elapsed = (Date.now()-att.questionEnteredAt)/1000;
  att.responses[q.id].timeSpent = (att.responses[q.id].timeSpent||0) + elapsed;
  att.questionEnteredAt = Date.now();
}

function startNewAttempt(questionIds, opts){
  opts = opts || {};
  const ids = questionIds && questionIds.length ? questionIds : QUESTIONS.map(q=>q.id);
  const responses = {};
  ids.forEach(id=> responses[id]={selected:null, marked:false, visited:false, timeSpent:0});
  const durationMinutes = opts.durationMinutes!==undefined ? opts.durationMinutes : CONFIG.durationMinutes;
  db.currentAttempt = {
    id: 'a_'+Date.now(),
    examSetId: CONFIG.id,
    attemptType: opts.attemptType || 'mock',
    title: opts.title || CONFIG.name,
    mode: opts.mode || 'mock',
    startTime: Date.now(),
    durationSec: durationMinutes===null ? null : durationMinutes*60,
    questionIds: ids,
    responses,
    currentQ: 0,
    questionEnteredAt: Date.now(),
    finished: false
  };
  saveDB(db);
  render();
}

function resumeAttempt(){ if(db.currentAttempt) db.currentAttempt.questionEnteredAt = Date.now(); render(); }
function discardAttempt(){ db.currentAttempt=null; saveDB(db); render(); }

function remainingSeconds(att){
  if(att.durationSec===null || att.durationSec===undefined) return Infinity;
  const elapsed = (Date.now()-att.startTime)/1000;
  return Math.max(0, Math.round(att.durationSec-elapsed));
}

function fmtTime(s){
  if(s===Infinity) return '∞';
  const m=Math.floor(s/60), sec=Math.round(s%60);
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

function setAnswer(qid, optIdx){
  const att=db.currentAttempt;
  att.responses[qid].selected = optIdx;
  att.responses[qid].visited = true;
  saveDB(db);
  renderQuestion();
  renderNav();
}
function clearResponse(qid){
  const att=db.currentAttempt;
  att.responses[qid].selected = null;
  saveDB(db);
  renderQuestion();
  renderNav();
}
function toggleMark(qid){
  const att=db.currentAttempt;
  att.responses[qid].marked = !att.responses[qid].marked;
  att.responses[qid].visited = true;
  saveDB(db);
  renderQuestion();
  renderNav();
}
function goTo(idx){
  const att=db.currentAttempt;
  flushTimeSpent(att);
  const qs = activeQuestions(att);
  att.responses[qs[att.currentQ].id].visited = true;
  att.currentQ = idx;
  saveDB(db);
  renderQuestion();
  renderNav();
}

function computeResult(att){
  let correct=0, incorrect=0, unattempted=0;
  const sectionStats={};
  const qs = activeQuestions(att);
  qs.forEach(q=>{ if(!sectionStats[q.section]) sectionStats[q.section]={attempted:0,correct:0,wrong:0,total:0,score:0}; });
  qs.forEach(q=>{
    const r=att.responses[q.id];
    sectionStats[q.section].total++;
    if(r.selected===null){ unattempted++; }
    else if(r.selected===q.correct){ correct++; sectionStats[q.section].attempted++; sectionStats[q.section].correct++; sectionStats[q.section].score+=CONFIG.negativeMarking.correct; }
    else { incorrect++; sectionStats[q.section].attempted++; sectionStats[q.section].wrong++; sectionStats[q.section].score+=CONFIG.negativeMarking.incorrect; }
  });
  const score = correct*CONFIG.negativeMarking.correct + incorrect*CONFIG.negativeMarking.incorrect;
  const total = qs.length;
  const accuracy = (correct+incorrect)>0 ? (correct/(correct+incorrect)*100) : 0;
  const attemptRate = ((correct+incorrect)/total*100);
  const rem = remainingSeconds(att);
  const timeTaken = rem===Infinity ? Math.round((Date.now()-att.startTime)/1000) : att.durationSec - rem;
  return {score, maxScore: total*CONFIG.negativeMarking.correct, correct, incorrect, unattempted, accuracy, attemptRate, timeTaken, sectionStats, total};
}

function submitExam(){
  const att=db.currentAttempt;
  flushTimeSpent(att);
  att.finished=true;
  att.endTime=Date.now();
  att.result = computeResult(att);
  db.attempts.push(att);
  db.currentAttempt=null;
  saveDB(db);
  clearInterval(timerInterval);
  if(db.settings.autoBackup) exportData();
  renderResultFromHistory(db.attempts[db.attempts.length-1]);
}

function computeDashboardStats(attempts){
  const n = attempts.length;
  const sum = arr=>arr.reduce((a,b)=>a+b,0);
  const scores = attempts.map(a=>a.result.score);
  const accuracies = attempts.map(a=>a.result.accuracy);
  const attemptRates = attempts.map(a=>a.result.attemptRate);
  const totalQuestions = sum(attempts.map(a=>a.result.correct+a.result.incorrect+a.result.unattempted));
  const totalCorrect = sum(attempts.map(a=>a.result.correct));
  const avgTimePerQ = attempts.map(a=> a.result.timeTaken / (a.result.total||1));
  return {
    n,
    avgScore: n? sum(scores)/n : 0,
    bestScore: n? Math.max(...scores) : 0,
    avgAccuracy: n? sum(accuracies)/n : 0,
    avgAttemptRate: n? sum(attemptRates)/n : 0,
    totalQuestions, totalCorrect,
    scores, accuracies,
    speed: avgTimePerQ
  };
}

function lineChartSVG(values, opts){
  opts = opts||{};
  const color = opts.color || 'var(--accent)';
  const fmt = opts.fmt || (v=>v.toFixed(1));
  const w=560, h=160, pad=32;
  if(!values.length) return `<p class="muted">No data yet.</p>`;
  if(values.length===1) values=[values[0],values[0]];
  const max=Math.max(...values), min=Math.min(...values);
  const range=(max-min)||1;
  const stepX=(w-2*pad)/(values.length-1);
  const pts=values.map((v,i)=>[pad+i*stepX, h-pad-((v-min)/range)*(h-2*pad)]);
  const path=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const circles=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" style="fill:${color}"></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:150px">
    <path d="${path}" style="fill:none;stroke:${color};stroke-width:2"/>
    ${circles}
    <text x="${pad}" y="14" font-size="10" style="fill:var(--muted)">${fmt(max)}</text>
    <text x="${pad}" y="${h-pad+14}" font-size="10" style="fill:var(--muted)">${fmt(min)}</text>
    <text x="${w-pad}" y="${h-8}" font-size="10" text-anchor="end" style="fill:var(--muted)">Attempt ${values.length}</text>
    <text x="${pad}" y="${h-8}" font-size="10" style="fill:var(--muted)">Attempt 1</text>
  </svg>`;
}

function tick(){
  const att = db.currentAttempt;
  if(!att || att.finished || att.durationSec===null) return;
  const rem = remainingSeconds(att);
  const t = document.getElementById('timer');
  if(t){ t.textContent = fmtTime(rem); t.classList.toggle('low', rem<=120); }
  if(rem<=0){ autoSubmitTimeUp(); }
}

function renderQuestion(){
  const att = db.currentAttempt;
  const qs = activeQuestions(att);
  const q = qs[att.currentQ];
  const r = att.responses[q.id];
  r.visited = true;
  const badge = q.source_type==='official'
    ? `<span class="badge badge-official">Official — ${q.source_reference||''}</span>`
    : q.source_type==='current_affairs_user'
    ? `<span class="badge badge-ai">Current Affairs — ${q.source_reference||''}</span>`
    : `<span class="badge badge-ai">AI-generated Practice Question — ${q.source_reference||''}</span>`;
  const practiceReveal = att.mode==='practice';
  const answered = r.selected!==null;
  document.getElementById('qcard').innerHTML = `
    <div class="qmeta">${badge}${secTag(q.section)}<span class="tag">${q.topic}</span><span class="tag">${q.difficulty}</span></div>
    <div class="qtext">Q${att.currentQ+1}. ${q.text}</div>
    <div id="opts">${q.options.map((o,i)=>{
      let cls = r.selected===i?'selected':'';
      if(practiceReveal && answered){
        if(i===q.correct) cls+=' ' ; // handled via inline style below
      }
      const revealStyle = practiceReveal && answered ? (i===q.correct? 'border-color:var(--green);background:var(--green-bg)' : (i===r.selected? 'border-color:var(--red);background:var(--red-bg)':'')) : '';
      return `<label class="option ${cls}" style="${revealStyle}">
        <input type="radio" name="opt" ${r.selected===i?'checked':''} onchange="setAnswer(${q.id},${i})" ${practiceReveal && answered ?'disabled':''}>
        <span>${String.fromCharCode(65+i)}. ${o}</span>
      </label>`;
    }).join('')}</div>
    ${practiceReveal && answered ? `
    <div class="review-item" style="margin-top:10px">
      <div class="${r.selected===q.correct?'ans-correct':'ans-incorrect'}">${r.selected===q.correct?'✅ Correct':'❌ Incorrect'} — Correct answer: ${String.fromCharCode(65+q.correct)}. ${q.options[q.correct]}</div>

    <div class="qactions">
      <button class="btn" onclick="prevQ()" ${att.currentQ===0?'disabled':''}>Previous</button>

function renderNav(){

// ---- Phase 3: Topic aggregation, Mistake Book, Retry Mode, Question Bank ----
function aggregateTopics(){
  const map = {};
  db.attempts.forEach(att=>{
    activeQuestions(att).forEach(q=>{
      const r = att.responses[q.id];
      if(!r || r.selected===null) return;
      if(!map[q.topic]) map[q.topic]={attempted:0,correct:0,timeSum:0,exams:new Set()};
      map[q.topic].attempted++;
      if(r.selected===q.correct) map[q.topic].correct++;
      map[q.topic].timeSum += (r.timeSpent||0);
      map[q.topic].exams.add(att.id);
    });
  });
  return Object.entries(map).map(([topic,v])=>({
    topic, attempted:v.attempted, correct:v.correct,
    accuracy: v.attempted? v.correct/v.attempted*100:0,
    avgTime: v.attempted? v.timeSum/v.attempted:0,
    exams: v.exams.size
  }));
}

function topicStatement(t){
  const mins=Math.floor(t.avgTime/60), secs=Math.round(t.avgTime%60);
  const timeStr = mins>0? `${mins}m ${secs}s` : `${secs}s`;
  let note;
  if(t.accuracy<50 && t.avgTime>90) note="Both accuracy and speed need attention.";
  else if(t.accuracy<50) note="Accuracy needs the most attention here.";
  else if(t.avgTime>90) note="Accuracy is fine, but speed needs work.";
  else note="This is a solid area.";
  return `You attempted ${t.attempted} ${t.topic} question${t.attempted===1?'':'s'} across ${t.exams} exam${t.exams===1?'':'s'} and got ${t.correct} correct (${t.accuracy.toFixed(1)}% accuracy). Average time per question: ${timeStr}. ${note}`;
}

function renderTopics(){
  const agg = aggregateTopics();
  const ranked = agg.filter(t=>t.attempted>=5).sort((a,b)=>a.accuracy-b.accuracy);

  const weak = ranked.slice(0,5);
  const strong = ranked.slice(-5).reverse().filter(t=>!weak.includes(t));
  app.innerHTML = `
  ${renderTopNav('topics')}
  <div class="container">
    <div class="card"><h1>Weak Topics</h1>

      weak.map(t=>`<div class="review-item"><b>${t.topic}</b><p style="font-size:13px">${topicStatement(t)}</p></div>`).join('')}
    </div>

      strong.map(t=>`<div class="review-item"><b>${t.topic}</b><p style="font-size:13px">${topicStatement(t)}</p></div>`).join('')}

function getWrongQuestionsInfo(){
  const map = new Map();
  db.attempts.slice().sort((a,b)=>a.startTime-b.startTime).forEach(att=>{

      const r = att.responses[q.id];
      if(r && r.selected!==null && r.selected!==q.correct){ if(att.startTime>(db.dismissed[q.id]||0)) map.set(q.id, {q, attemptId:att.id, attemptTime:att.startTime}); } else if(r && r.selected===q.correct) map.delete(q.id);

  });
  return Array.from(map.values());
}

function seenQuestions(){
  const seenIds = new Set();
  db.attempts.forEach(att=> Object.keys(att.responses).forEach(qid=>{ if(att.responses[qid].visited) seenIds.add(Number(qid)); }));
  return QUESTIONS.filter(q=>seenIds.has(q.id));
}

function lastResponseInfo(qid){
  let last=null;
  db.attempts.slice().sort((a,b)=>a.startTime-b.startTime).forEach(att=>{
    const r=att.responses[qid];
    if(r && r.selected!==null) last = {correct: r.selected===QUESTIONS.find(q=>q.id===qid).correct};
  });
  return last;
}

function applyBankFilters(){
  const sec=document.getElementById('fSection')?.value||'';
  const diff=document.getElementById('fDifficulty')?.value||'';
  const src=document.getElementById('fSource')?.value||'';
  const res=document.getElementById('fResult')?.value||'';
  const fav=document.getElementById('fFav')?.value||'';
  const list = window._bankSeen.filter(q=>{
    if(sec && q.section!==sec) return false;
    if(diff && q.difficulty!==diff) return false;
    if(src && q.source_type!==src) return false;
    const info = lastResponseInfo(q.id);
    if(res==='correct' && !(info && info.correct)) return false;
    if(res==='incorrect' && !(info && !info.correct)) return false;
    if(fav==='fav' && !(db.favorites||[]).includes(q.id)) return false;
    return true;
  });
  document.getElementById('bankList').innerHTML = (list.length? list.map(q=>{
    const info=lastResponseInfo(q.id);
    const isFav=(db.favorites||[]).includes(q.id);
    const badge = q.source_type==='official'?`<span class="badge badge-official">Official</span>`:`<span class="badge badge-ai">AI-generated</span>`;
    return `<div class="review-item">

  }).join('') : `<div class="card"><p class="muted">No questions match these filters.</p></div>`);
}

function toggleFavorite(qid){
  db.favorites = db.favorites||[];
  const idx=db.favorites.indexOf(qid);
  if(idx>=0) db.favorites.splice(idx,1); else db.favorites.push(qid);
  saveDB(db);
  applyBankFilters();
}

// ---- Phase 4: Current Affairs Input (material-only generation) & Practice Mode support ----
function splitSentences(text){
  return text.replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s+/).filter(s=>s.trim().length>15);
}
function extractEntities(sentence){
  const entities=[];
  (sentence.match(/\b\d+(\.\d+)?%?\b/g)||[]).forEach(n=>entities.push({type:'number',value:n}));
  (sentence.match(/\b([A-Z][a-zA-Z]+(?:\s+[A-Z][a-zA-Z]+){0,3})\b/g)||[]).forEach(p=>{
    if(!['The','This','It','A','An','In','On','At','For','As','Its'].includes(p)) entities.push({type:'proper',value:p});
  });
  return entities;
}
function buildFactCandidates(text){
  const candidates=[];
  splitSentences(text).forEach(s=>{
    const seen=new Set();
    extractEntities(s).forEach(e=>{ if(!seen.has(e.value)){ seen.add(e.value); candidates.push({sentence:s.trim(), entity:e.value, type:e.type}); } });
  });
  return candidates;
}
function generateCAQuestions(text, period, count, difficulty){
  const candidates = buildFactCandidates(text);
  if(!candidates.length) return [];
  for(let i=candidates.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [candidates[i],candidates[j]]=[candidates[j],candidates[i]]; }
  const chosen = candidates.slice(0, Math.min(count, candidates.length));
  const pools = {
    number:[...new Set(candidates.filter(c=>c.type==='number').map(c=>c.entity))],
    proper:[...new Set(candidates.filter(c=>c.type==='proper').map(c=>c.entity))]
  };
  let base = 20000 + (db.customQuestions||[]).length;
  return chosen.map((c,idx)=>{
    const blanked = c.sentence.replace(c.entity, '_____');
    const stem = difficulty==='Difficult' ? `Based on the current affairs material: "${blanked}" — what fills the blank?` : `Fill in the blank: "${blanked}"`;
    let pool = pools[c.type].filter(v=>v!==c.entity);
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    let distractors = pool.slice(0,3);
    while(distractors.length<3){
      if(c.type==='number'){ const n=parseFloat(c.entity)||0; const bump=(distractors.length+1)*((n*0.15)||5); distractors.push((n+bump).toFixed(c.entity.includes('.')?1:0)+(c.entity.includes('%')?'%':'')); }
      else distractors.push(c.entity+' (alternate)');
    }
    const options=[c.entity,...distractors];
    const order=[0,1,2,3];
    for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; }
    return {
      id: base+idx, section:'Current Affairs', topic: period, difficulty,
      text: stem, options: order.map(i=>options[i]), correct: order.indexOf(0),
      explanation: `Source material states: "${c.sentence}"`,
      source_type:'current_affairs_user',
      source_reference: `Current Affairs — ${period}. Source: User-provided material.`
    };
  });
}

function srsState(){
  const st={};
  db.attempts.slice().sort((a,b)=>a.startTime-b.startTime).forEach(att=>{
    const ts=att.endTime||att.startTime;
    Object.entries(att.responses||{}).forEach(([id,r])=>{
      if(r.selected===null||r.selected===undefined) return;
      const q=qById(+id); if(!q) return;
      if(r.selected!==q.correct) st[id]={streak:0,due:ts+DAY,lw:ts};
      else if(st[id]){ st[id].streak++; st[id].due=ts+(st[id].streak===1?3:7)*DAY; }
    });
  });
  return st;
}
function srsBuckets(){
  const st=srsState(), now=Date.now(), out={due:[],soon:0,mastered:0};
  Object.entries(st).forEach(([id,s])=>{
    if(!qById(+id)||isFlagged(+id)) return;
    if(s.streak>=2||(db.dismissed[id]||0)>s.lw){out.mastered++;return;}
    if(s.due<=now) out.due.push({id:+id,due:s.due}); else if(s.due<=now+7*DAY) out.soon++;
  });

  const ids=sh(pool.filter(q=>!seen.has(q.id))).concat(sh(pool.filter(q=>seen.has(q.id)))).slice(0,10).map(q=>q.id);
  startNewAttempt(ids,{durationMinutes:10,attemptType:'sprint',title:'Quick Sprint (10 Qs)'});

      <div class="qactions" style="justify-content:flex-end">
        <button class="btn btn-danger" id="discardBtn">Discard Attempt</button>
        <button class="btn btn-primary" id="resumeBtn">Resume Exam</button>
      </div>
    </div>`;
    document.body.appendChild(div);
    div.querySelector('#discardBtn').onclick=()=>{ div.remove(); discardAttempt(); };
    div.querySelector('#resumeBtn').onclick=()=>{ div.remove(); resumeAttempt(); };
  } else {
    render();
  }
})();
</script>
</body>
</html>
