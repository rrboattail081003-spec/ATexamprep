<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --text:#1a1d23; --muted:#666f7a; --border:#dfe3e8;
  --accent:#2451c9; --accent-d:#1a3a99; --green:#1a8a4a; --green-bg:#e3f6ea;
  --red:#c62828; --red-bg:#fdeaea; --orange:#b46a00; --orange-bg:#fdf1de;
  --purple:#6a2fb0; --purple-bg:#f0e6fb; --grey-bg:#eceef1;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --panel:#1e2126; --text:#e8eaed; --muted:#9aa2ab; --border:#31353c;
    --green-bg:#12321f; --red-bg:#3a1414; --orange-bg:#3a2a0a; --purple-bg:#241338; --grey-bg:#2a2d33;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1e2126; --text:#e8eaed; --muted:#9aa2ab; --border:#31353c;
  --green-bg:#12321f; --red-bg:#3a1414; --orange-bg:#3a2a0a; --purple-bg:#241338; --grey-bg:#2a2d33;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-size:15px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:6px;padding:8px 14px;font-size:14px}
.btn{background:var(--panel);border:1px solid var(--border);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-d)}
.btn-danger{background:var(--red);color:#fff}
.container{max-width:960px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.badge-official{background:var(--green-bg);color:var(--green)}
.badge-ai{background:var(--orange-bg);color:var(--orange)}
.hidden{display:none !important}
/* exam header */
#examHeader{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;z-index:10}
.hstat{font-size:13px;color:var(--muted)}
.hstat b{color:var(--text)}
#timer{font-size:18px;font-weight:700;padding:4px 12px;border-radius:6px;background:var(--grey-bg)}
#timer.low{background:var(--red-bg);color:var(--red)}
/* exam layout */
.exam-wrap{display:flex;gap:16px;max-width:1100px;margin:0 auto;padding:16px;align-items:flex-start}
.qpanel{flex:1;min-width:0}
.navpanel{width:260px;flex-shrink:0}
@media (max-width:760px){.exam-wrap{flex-direction:column}.navpanel{width:100%;order:2}}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:12px}
.qtext{font-size:16px;line-height:1.5;margin-bottom:16px;white-space:pre-wrap}
.option{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer}
.option:hover{border-color:var(--accent)}
.option.selected{border-color:var(--accent);background:var(--grey-bg)}
.option input{margin-top:3px}
.qactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.navcell{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--panel);color:var(--text)}
.nc-notvisited{background:var(--grey-bg);color:var(--muted)}
.nc-unanswered{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.nc-answered{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.nc-marked{background:var(--purple-bg);color:var(--purple);border-color:var(--purple)}
.nc-answered-marked{background:var(--purple-bg);color:var(--purple);border:2px solid var(--green)}
.legend{font-size:11px;display:flex;flex-direction:column;gap:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border-radius:10px;padding:22px;max-width:420px;width:100%}
.modal .row{display:flex;justify-content:space-between;margin:6px 0;font-size:14px}
/* results */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--grey-bg);border-radius:8px;padding:12px;text-align:center}
.stat .v{font-size:20px;font-weight:700}
.stat .l{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--border)}
.review-item{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px}
.ans-correct{color:var(--green);font-weight:600}
.ans-incorrect{color:var(--red);font-weight:600}
.ans-blank{color:var(--muted);font-weight:600}
.tag{font-size:11px;background:var(--grey-bg);border-radius:20px;padding:2px 8px;margin-right:4px;color:var(--muted)}
.overflow-x{overflow-x:auto}

/* ===== Visual refresh ===== */
:root{--accent:#4f46e5;--accent-d:#4338ca;--grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#ec4899 100%);--shadow:0 6px 24px rgba(79,70,229,.12);--tagL:36%;--bg:#f3f4fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tagL:74%;--bg:#0f1020;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--tagL:74%;--bg:#0f1020;--shadow:0 6px 24px rgba(0,0,0,.4)}
body{font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background-image:radial-gradient(1100px 480px at 8% -8%,rgba(124,58,237,.14),transparent),radial-gradient(900px 420px at 100% 0,rgba(236,72,153,.11),transparent);background-attachment:fixed}
h1{font-weight:800;letter-spacing:-.02em}h2{font-weight:700}
.card{border-radius:16px;box-shadow:var(--shadow)}
.btn{border-radius:10px;font-weight:600;transition:transform .15s,box-shadow .15s,border-color .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn-primary{background:var(--grad);border:none;color:#fff;box-shadow:0 4px 14px rgba(79,70,229,.35)}
.btn-primary:hover{background:var(--grad);filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.topnav{display:flex;gap:6px;flex-wrap:wrap;background:var(--panel);padding:8px;border-radius:14px;border:1px solid var(--border);box-shadow:var(--shadow)}
.topnav .btn{padding:7px 12px;font-size:13px;border-color:transparent;background:transparent}
.topnav .btn-primary{background:var(--grad)}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:28px;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(79,70,229,.38)}
.hero:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;right:90px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{font-size:30px;color:#fff;margin:6px 0 8px}.hero p{margin:0;opacity:.93;max-width:560px}
.hero>*{position:relative;z-index:1}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:10px 16px;min-width:96px;font-size:12px;backdrop-filter:blur(4px)}
.chip b{display:block;font-size:21px}

{id:46001,section:"English Language",topic:"Reading Comprehension",difficulty:'Moderate-Hard',text:"What is the author's primary point of view regarding fasting? Read the following passage and answer the given questions. Recent research from the National University of Ireland (NUI) has presented sharp insights into the connection between fasting and diabetes control. The study focused on individuals who adopted intermittent fasting as a lifestyle choice. Participants who fasted for specific hours each day showed a marked reduction in body fat levels. Interestingly, this fat loss was not just cosmetic\u2014it significantly impacted insulin sensitivity, the key hormone involved in blood sugar regulation. The study\u2019s findings are hard to ignore, especially in the context of increasing global diabetes cases. The controlled fasting regimen helped stabilize glucose levels, which is critical for both preventing and managing Type 2 diabetes. According to NUI researchers, fasting helps the body shift from burning glucose to utilizing fat stores as energy, which not only reduces fat accumulation but also eases the burden on pancreatic function. Furthermore, fasting appears to trigger metabolic rewiring. This change encourages improved mitochondrial activity and reduced inflammation, two factors often linked to diabetes development. Unlike sharp dietary restrictions that cause nutrient deficiencies, strategic fasting offers a sustainable approach to health. It demands discipline but rewards the individual with better metabolic efficiency and sugar regulation. Doctors are now considering time-restricted eating as a non-pharmacological tool for pre-diabetic individuals. While fasting may not replace medications in chronic cases, its preventive potential is impressive. It also encourages a sharper focus on eating windows, thereby eliminating erratic eating behaviors that often worsen blood sugar instability. For individuals with consistently high glucose readings, fasting may offer a safe and structured method to regain control. The mental clarity reported by some participants also indicates potential cognitive benefits, although more research is required to confirm this. However, researchers warn against overdoing fasting, as extremely hard fasting routines can induce stress responses that may disrupt hormonal balance. A guided, scientifically backed fasting method remains the safest path toward leveraging its full benefits. Personalization of fasting schedules, based on age, health status, and daily activity levels, may further enhance its efficacy and long-term safety.",options:["Fasting is harmful if not paired with high-intensity exercise routines", "Fasting is an overly promoted trend with little scientific basis", "Fasting should replace medication in all cases of diabetes", "Fasting, when done correctly, can aid in prevention and control of diabetes", "Fasting is mainly helpful for those who already have advanced diabetes"],correct:3,explanation:"Correct option is (d) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},

ently high glucose readings, fasting may offer a safe and structured method to regain control. The mental clarity reported by some participants also indicates potential cognitive benefits, although more research is required to confirm this. However, researchers warn against overdoing fasting, as extremely hard fasting routines can induce stress responses that may disrupt hormonal balance. A guided, scientifically backed fasting method remains the safest path toward leveraging its full benefits. Personalization of fasting schedules, based on age, health status, and daily activity levels, may further enhance its efficacy and long-term safety.",options:["Because fasting reduces digestive load and increases glucose creation in the liver", "Because the body starts relying more on internal fat storage for energy", "Because fasting blocks insulin secretion temporarily and improves liver capacity", "Because sugar intake increases during eating hours and trains the body to adapt", "Because glucose metabolism is replaced entirely with protein synthesis"],correct:1,explanation:"Correct option is (b) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},
{id:46003,section:"English Language",topic:"Reading Comprehension",difficulty:'Moderate-Hard',text:"Which of the following statements is/are correct according to the passage? (I) Fasting reduces the pressure on pancreatic functioning. (II) Intermittent fasting increases nutrient deficiencies over time. (III) Time-restricted eating could be considered as a non-drug-based solution for some cases. Read the following passage and answer the given questions. Recent research from the National University of Ireland (NUI) has presented sharp insights into the connection between fasting and diabetes control. The study focused on individuals who adopted intermittent fasting as a lifestyle choice. Participants who fasted for specific hours each day showed a marked reduction in body fat levels. Interestingly, this fat loss was not just cosmetic\u2014it significantly impacted insulin sensitivity, the key hormone involved in blood sugar regulation. The study\u2019s findings are hard to ignore, especially in the context of increasing global diabetes cases. The controlled fasting regimen helped stabilize glucose levels, which is critical for both preventing and managing Type 2 diabetes. According to NUI researchers, fasting helps the body shift from burning glucose to utilizing fat stores as energy, which not only reduces fat accumulation but also eases the burden on pancreatic function. Furthermore, fasting appears to trigger metabolic rewiring. This change encourages improved mitochondrial activity and reduced inflammation, two factors often linked to diabetes development. Unlike sharp dietary restrictions that cause nutrient deficiencies, strategic fasting offers a sustainable approach to health. It demands discipline but rewards the individual with better metabolic efficiency and sugar regulation. Doctors are now considering time-restricted eating as a non-pharmacological tool for pre-diabetic individuals. While fasting may not replace medications in chronic cases, its preventiv {id:46009,section:"English Language",topic:"Reading Comprehension",difficulty:'Moderate-Hard',text:"Which of the following statements is/are incorrect according to the passage? (I) Fasting helps in eliminating the use of glucose permanently from the body. (II) Doctors are currently recommending fasting as the only cure for chronic diabetes. (III) Mental clarity was reported by some participants during fasting. Read the following passage and answer the given questions. Recent research from the National University of Ireland (NUI) has presented sharp insights into the connection between fasting and diabetes control. The study focused on individuals who adopted intermittent fasting as a lifestyle choice. Participants who fasted for specific hours each day showed a marked reduction in body fat levels. Interestingly, this fat loss was not just cosmetic\u2014it significantly impacted insulin sensitivity, the key hormone involved in blood sugar regulation. The study\u2019s findings are hard to ignore, especially in the context of increasing global diabetes cases. The controlled fasting regimen helped stabilize glucose levels, which is critical for both preventing and managing Type 2 diabetes. According to NUI researchers, fasting helps the body shift from burning glucose to utilizing fat stores as energy, which not only reduces fat accumulation but also eases the burden on pancreatic function. Furthermore, fasting appears to trigger metabolic rewiring. This change encourages improved mitochondrial activity and reduced inflammation, two factors often linked to diabetes development. Unlike sharp dietary restrictions that cause nutrient deficiencies, strategic fasting offers a sustainable approach to health. It demands discipline but rewards the individual with better metabolic efficiency and sugar regulation. Doctors are now considering time-restricted eating as a non-pharmacological tool for pre-diabetic individuals. While fasting may not replace medications in chronic case {id:46031,section:"Reasoning Ability",topic:"Puzzle (Box Stacking)",difficulty:'Moderate-Hard',text:"If Box B is related to Box C in the same way Box G is related to Box B, then which box is related to Box F? Study the following information carefully and answer the questions given below. Eight boxes are stacked above one another. Box B is placed two boxes above Box H. Three boxes are placed between Box H and Box D. Box C is placed two boxes above Box F but immediately above Box D. Three boxes are placed between Box F and Box G. Box E is placed below Box G but not above Box C. Not more than two boxes are placed between Box E and Box A.",options:["Box G", "Box E", "Box B", "Box A", "Box H"],correct:4,explanation:"Correct option is (e) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},
{id:46032,section:"Reasoning Ability",topic:"Puzzle (Box Stacking)",difficulty:'Moderate-Hard',text:"Which of the following statements is/are false? I. Box H is placed below Box F II. Two boxes are placed between Box G and Box B III. Box C is placed below Box B Study the following information carefully and answer the questions given below. Eight boxes are stacked above one another. Box B is placed two boxes above Box H. Three boxes are placed between Box H and Box D. Box C is placed two boxes above Box F but immediately above Box D. Three boxes are placed between Box F and Box G. Box E is placed below Box G but not above Box C. Not more than two boxes are placed between Box E and Box A.",options:["Both I and II", "Only II", "Only III", "Both II and III", "Both I and III"],correct:2,explanation:"Correct option is (c) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},

{id:46040,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate-Hard',text:"Who among the following sits third to the left of the person who likes Mango? Study the following information carefully and answer the questions given below: Six persons \u2014 L, M, N, O, K and T\u2014sit in a row and face north, but not necessarily in the same order. Each person likes a different fruit \u2014 Mango, Banana, Apple, Grapes, Orange, and Pear. One person sits between L and the one who likes orange. M sits immediate right of the one who likes orange. K sits two places away from M. The one who likes orange and K are not immediate neighbours. The one who likes apple sits third to the left of O. The one who likes Mango sits immediate right of O. N sits exactly between the one who likes Grapes and Pear. T sits immediate right of the one who likes Grapes.",options:["L", "O", "The one who likes Orange", "M", "The one who likes Apple"],correct:2,explanation:"Correct option is (c) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},
{id:46041,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate-Hard',text:"Which of the following persons sit next to each other? Study the following information carefully and answer the questions given below: Six persons \u2014 L, M, N, O, K and T\u2014sit in a row and face north, but not necessarily in the same order. Each person likes a different fruit \u2014 Mango, Banana, Apple, Grapes, Orange, and Pear. One person sits between L and the one who likes orange. M sits immediate right of the one who likes orange. K sits two places away from M. The one who likes orange and K are not immediate neighbours. The one who likes apple sits third to the left of O. The one who likes Mango sits immediate right of O. N sits exactly between the one who likes Grapes and Pear. T sits immediate right of the one who likes Grapes.",options:["O and the one who likes Orange", "T and the one who likes Grapes", "M and T", "The one who likes Apple and M", "None of these"],correct:1,explanation:"Correct option is (b) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},
{id:46042,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate-Hard',text:"What is the position of N with respect to the one who likes Mango? Study the following information carefully and answer the questions given below: Six persons \u2014 L, M, N, O, K and T\u2014sit in a row and face north, but not necessarily in the same order. Each person likes a different fruit \u2014 Mango, Banana, Apple, Grapes, Orange, and Pear. One person sits between L and the one who likes orange. M sits immediate right of the one who likes orange. K sits two places away from M. The one who likes orange and K are not immediate neighbours. The one who likes apple sits third to the left of O. The one who likes Mango sits immediate right of O. N sits exactly between the one who likes Grapes and Pear. T sits immediate right of the one who likes Grapes.",options:["Immediate left", "Second to the left", "Third to the right", "Third to the left", "Immediate right"],correct:3,explanation:"Correct option is (d) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},

{id:46051,section:"Reasoning Ability",topic:"Puzzle (Floors/Flats)",difficulty:'Moderate-Hard',text:"In which among the following floor and flat does R live? Study the following information carefully and answer the questions given below: Eight persons \u2013 P, Q, R, S, T, U, V and W live in a four-storey building (but not necessarily in the same order), where the lowermost floor is numbered as one and the floor immediately above it is numbered as two and so on. Note-I: Each floor has two types of flats i.e., Flat-A and Flat-B, where Flat A is to the west of Flat B. Note-II: Flat B of floor 2 is immediately above Flat B of floor 1 and immediately below Flat B of floor 3 and so on. Similarly, Flat A of floor 2 is immediately above Flat A of floor 1 and immediately below Flat A of floor 3 and so on. Note-III: The area of each flat is the same. Note-IV: Only two persons live on each floor, and only one person lives in each flat. Q lives two floors above V. Q and V lives in different named flat. V lives to the north of W. One floor gap is there between W\u2019s floor and U\u2019s floor. R lives two floors below T in different named flat. R lives above P\u2019s floor. S lives to the north-east of P.",options:["Floor 1, Flat A", "Floor 2, Flat B", "Floor 3, Flat B", "Floor 4, Flat A", "Floor 2, Flat A"],correct:4,explanation:"Correct option is (e) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},

{id:46054,section:"Reasoning Ability",topic:"Puzzle (Floors/Flats)",difficulty:'Moderate-Hard',text:"If R and V interchanged their flats with each other and in the same way U and S interchanged their flats with each other then who lives immediately below Q in the same named flat? Study the following information carefully and answer the questions given below: Eight persons \u2013 P, Q, R, S, T, U, V and W live in a four-storey building (but not necessarily in the same order), where the lowermost floor is numbered as one and the floor immediately above it is numbered as two and so on. Note-I: Each floor has two types of flats i.e., Flat-A and Flat-B, where Flat A is to the west of Flat B. Note-II: Flat B of floor 2 is immediately above Flat B of floor 1 and immediately below Flat B of floor 3 and so on. Similarly, Flat A of floor 2 is immediately above Flat A of floor 1 and immediately below Flat A of floor 3 and so on. Note-III: The area of each flat is the same. Note-IV: Only two persons live on each floor, and only one person lives in each flat. Q lives two floors above V. Q and V lives in different named flat. V lives to the north of W. One floor gap is there between W\u2019s floor and U\u2019s floor. R lives two floors below T in different named flat. R lives above P\u2019s floor. S lives to the north-east of P.",options:["S", "U", "V", "R", "Can\u2019t be determined"],correct:0,explanation:"Correct option is (a) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},

{id:46056,section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate-Hard',text:"Statements: Only pens are copies Some books are pens Some books are not pencils Conclusions: I. Some pens are definitely not pencils II. No pencils are copies In each question below some statements are given followed by two conclusions numbered as I and II. You have to take the given statements to be true even if they seem to be at variance with commonly known facts. Read all the conclusions and then decide which of the given conclusions logically follows from the given statements, disregarding commonly known facts. Give answer",options:["If only conclusion I follows", "If only conclusion II follows", "If either conclusion I or II follows", "If neither conclusion I nor II follows", "If both conclusions I and II follow"],correct:4,explanation:"Correct option is (e) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},

{id:46061,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate-Hard',text:"The number of persons sit between F and H when counting right of F is one more than the number of persons sit between ______ and A when counting left of A. Study the following information carefully and answer the questions given below. Eight persons \u2013 A, B, C, D, E, F, G, and H \u2013 sit around a square-shaped table. Four of them sit at the corners of the table and face inward, while the other four sit at the middle of the sides and face outward. G sits fifth to the right of E. D sits two places away from E. B sits immediate right of D. One person sits between H and A. H is an immediate neighbour of B. C doesn\u2019t face inside. F is not an immediate neighbour of A.",options:["C", "D", "B", "H", "G"],correct:1,explanation:"Correct option is (b) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},

{id:46063,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate-Hard',text:"Which of the following is/are true? Study the following information carefully and answer the questions given below. Eight persons \u2013 A, B, C, D, E, F, G, and H \u2013 sit around a square-shaped table. Four of them sit at the corners of the table and face inward, while the other four sit at the middle of the sides and face outward. G sits fifth to the right of E. D sits two places away from E. B sits immediate right of D. One person sits between H and A. H is an immediate neighbour of B. C doesn\u2019t face inside. F is not an immediate neighbour of A.",options:["A and F sits opposite to each other", "B and G sit immediately next to each other", "D doesn\u2019t sit at one of the corners", "F faces inward", "E sits to the immediate right of F"],correct:4,explanation:"Correct option is (e) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},

{id:46065,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate-Hard',text:"Who sits second to the left of D? Study the following information carefully and answer the questions given below. Eight persons \u2013 A, B, C, D, E, F, G, and H \u2013 sit around a square-shaped table. Four of them sit at the corners of the table and face inward, while the other four sit at the middle of the sides and face outward. G sits fifth to the right of E. D sits two places away from E. B sits immediate right of D. One person sits between H and A. H is an immediate neighbour of B. C doesn\u2019t face inside. F is not an immediate neighbour of A.",options:["E", "B", "A", "G", "F"],correct:0,explanation:"Correct option is (a) per the published solution key.",source_type:'official',source_reference:'NICL AO Prelims 2024 Memory Based Paper'},

{id:47021,section:"English Language",topic:"Reading Comprehension",difficulty:'Moderate',text:"Which of the following is closest in meaning to FORMED as used in this context? Read the following passage and answer the given questions. Certain words are highlighted to answer some of the questions. For most of history, leather has come from animals \u2014 a fact that the fashion industry accepted without question for centuries. Cows, goats, and sheep provided the raw material for everything from everyday footwear to luxury handbags. The environmental cost of this arrangement was enormous \u2014 vast tracts of land cleared for livestock, significant water consumption, and a chemical-heavy tanning process that left rivers polluted and workers exposed to harmful substances. For decades, activists raised concerns and designers occasionally experimented with alternatives, but nothing truly compelling emerged. That is, until biotechnology decided to step into the wardrobe. BioWear, a biotechnology company founded in the Netherlands, has built its entire business around a single bold idea \u2014 that the materials needed to make beautiful, durable leather shoes and bags do not need to come from animals at all. They can simply be grown. What sounds like science fiction is, in BioWear's Amsterdam facility, an everyday industrial reality that is quietly beginning to reshape how the global fashion industry thinks about raw materials. BioWear was formed by an inspired team of biologists, material scientists, and fashion designers who believed that the gap between laboratory science and commercial style had gone on far too long. The team spent nearly four years developing a process that uses living fungal cultures to grow a dense, flexible sheet material closely resembling animal leather in texture and strength. The fungal sheets are cultivated on agricultural waste \u2014 corn husks, wheat straw, and sugarcane pulp \u2014 meaning the entire production process runs on materials that would otherwise be discarded after harvest. Once harvested, the sheets are treated with water-based finishing agents and dyed using non-toxic pigments. The result is a material that looks, feels, and behaves like premium leather \u2014 without a single animal involved. When the time came to bring the product to market, BioWear chose quality over speed. Rather than rushing into mass production, the company partnered with skilled artisans in Portugal who hand-stitch every shoe and bag individually, ensuring each product meets the highest standard of finish. Every BioWear product carries a small tag explaining _________________ the fungal material inside it was grown, harvested, and processed \u2014 giving buyers complete transparency about their purchase. In a market crowded with vague sustainability claims, BioWear's commitment to honest, verifiable accountability has earned it a loyal and rapidly growing customer base across Europe and beyond. Fashion, its founders often say, has always been about transformation. The only thing that has changed is where the raw material comes from.",options:["associated", "established", "organized", "connected", "assembled"],correct:1,explanation:"Correct option is (b) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},

{id:47066,section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Who among the following gets leave on Sunday? Study the following information carefully and answer the questions given below: Seven persons- A, B, C, D, E, F and G get leave from office on different days of the same week from Monday to Sunday but not necessarily in the same order. F gets leave on Thursday. Only two persons get leave between F and D. As many persons get leave between F and B as between D and F. Only one person gets leave between A and B. C gets leave two days before D. G gets the leave after E.",options:["C", "G", "F", "D", "None of these"],correct:3,explanation:"Correct option is (d) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47067,section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"How many persons get leave between G and B? Study the following information carefully and answer the questions given below: Seven persons- A, B, C, D, E, F and G get leave from office on different days of the same week from Monday to Sunday but not necessarily in the same order. F gets leave on Thursday. Only two persons get leave between F and D. As many persons get leave between F and B as between D and F. Only one person gets leave between A and B. C gets leave two days before D. G gets the leave after E.",options:["Three", "Four", "Two", "Five", "One"],correct:1,explanation:"Correct option is (b) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47068,section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Who among the following gets leave three persons before F? Study the following information carefully and answer the questions given below: Seven persons- A, B, C, D, E, F and G get leave from office on different days of the same week from Monday to Sunday but not necessarily in the same order. F gets leave on Thursday. Only two persons get leave between F and D. As many persons get leave between F and B as between D and F. Only one person gets leave between A and B. C gets leave two days before D. G gets the leave after E.",options:["G", "A", "B", "D", "E"],correct:2,explanation:"Correct option is (c) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47069,section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Which among the following statement(s) is/are true? I. B gets leave before at least two persons II. Prime number of persons get leave after C III. A doesn\u2019t get the leave on Wednesday Study the following information carefully and answer the questions given below: Seven persons- A, B, C, D, E, F and G get leave from office on different days of the same week from Monday to Sunday but not necessarily in the same order. F gets leave on Thursday. Only two persons get leave between F and D. As many persons get leave between F and B as between D and F. Only one person gets leave between A and B. C gets leave two days before D. G gets the leave after E.",options:["Both I and II", "Both II and III", "Only I", "Only III", "All I, II and III"],correct:0,explanation:"Correct option is (a) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47070,section:"Reasoning Ability",topic:"Puzzle",difficulty:'Moderate',text:"Four of the following five are alike in a certain way and thus form a group. Which of the following does not belong to that group? Study the following information carefully and answer the questions given below: Seven persons- A, B, C, D, E, F and G get leave from office on different days of the same week from Monday to Sunday but not necessarily in the same order. F gets leave on Thursday. Only two persons get leave between F and D. As many persons get leave between F and B as between D and F. Only one person gets leave between A and B. C gets leave two days before D. G gets the leave after E.",options:["B-A", "E-F", "C-D", "A-C", "G-D"],correct:4,explanation:"Correct option is (e) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},

{id:47087,section:"Reasoning Ability",topic:"Puzzle (Box Stacking)",difficulty:'Moderate',text:"Four of the following five are similar in a certain manner and form a group, which of the following does not belong to the group? Read the given information carefully and answer the questions based on it: Eight boxes are placed one above the other. The boxes are numbered as 1 to 8 from bottom to top respectively. Box Y is placed at prime numbered position. Four boxes are placed between box Y and box Z. The number of boxes placed above box Z is one less than the number of boxes placed below box X. Box W is placed three boxes above box X. Two boxes are placed between box V and box U which is placed just below box T. Box S and box U are not placed adjacent to each other.",options:["V", "U", "S", "W", "Y"],correct:0,explanation:"Correct option is (a) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47088,section:"Reasoning Ability",topic:"Puzzle (Box Stacking)",difficulty:'Moderate',text:"What is the ratio of the position number of box V and box S respectively? Read the given information carefully and answer the questions based on it: Eight boxes are placed one above the other. The boxes are numbered as 1 to 8 from bottom to top respectively. Box Y is placed at prime numbered position. Four boxes are placed between box Y and box Z. The number of boxes placed above box Z is one less than the number of boxes placed below box X. Box W is placed three boxes above box X. Two boxes are placed between box V and box U which is placed just below box T. Box S and box U are not placed adjacent to each other.",options:["1:2", "1:8", "2:3", "4:1", "4:7"],correct:1,explanation:"Correct option is (b) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47089,section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: All birds are animals. Only a few animals are mammals. No bird is a reptile. Conclusions: I. Some mammals are birds. II. No reptile is an animal. In the question below, some statements are given followed by some Conclusions. You have to take the given statements to be true even if they seem to be at variance from commonly known facts. Read all the conclusions and then decide which of the given conclusions logically follows from the given statements disregarding commonly known facts.",options:["If only conclusion I follow", "If only conclusion II follows", "If either conclusion I or II follows", "If neither conclusion I nor II follows", "If both conclusions I and II follow"],correct:3,explanation:"Correct option is (d) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47090,section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: Only a few floors are buildings Some buildings are flats All flats are apartments Conclusions: I. Some floors are not flats II. All buildings can never be floors In the question below, some statements are given followed by some conclusions numbered as I and II. You have to take the given statements to be true even if they seem to be at variance with commonly known facts. Read all the conclusions and then decide which of the given conclusions logically follows from the given statements disregarding commonly known facts. Give answer.",options:["Only conclusion I follows", "Only conclusion II follows", "Either conclusion I or II follows", "Neither conclusion I nor II follows", "Both conclusions I and II follow"],correct:3,explanation:"Correct option is (d) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47091,section:"Reasoning Ability",topic:"Syllogism",difficulty:'Moderate',text:"Statements: Some jug is mug. All mug is glass. Only a few glass is bottle. Conclusions: I. Some jug is bottle. II. No jug is bottle. In the question below, some statements are followed by two conclusions numbered I and II. You have to assume everything in the statements to be true even if they seem to be at variance with commonly known facts. Read all the statements and decide which of the given conclusions logically follows, disregarding commonly known facts.",options:["Only II follow", "Both I and II follow", "Either I or II follow", "Only I follow", "Neither I nor II follow"],correct:2,explanation:"Correct option is (c) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47092,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate',text:"Who among the following sits second to the right of A? Study the following information carefully and answer the question given below: Ten people are sitting in two parallel rows containing five people each in such a way that there is an equal distance between adjacent persons. In row 1- A, B, C, D and E are sitting and all of them are facing the south. In row 2- P, Q, R, S and T are sitting and all of them are facing the north. The persons sit in row 1 face the persons sit in row 2 and vice versa. A sits third to the left of B. One person sits between A and the one who faces Q. Q sits second to the right of S. Two persons sit between R and the one who faces E. T sits left of R.",options:["D", "C", "Either (a) or (b)", "E", "The one who faces T"],correct:2,explanation:"Correct option is (c) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47093,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate',text:"How many persons sit between S and P? Study the following information carefully and answer the question given below: Ten people are sitting in two parallel rows containing five people each in such a way that there is an equal distance between adjacent persons. In row 1- A, B, C, D and E are sitting and all of them are facing the south. In row 2- P, Q, R, S and T are sitting and all of them are facing the north. The persons sit in row 1 face the persons sit in row 2 and vice versa. A sits third to the left of B. One person sits between A and the one who faces Q. Q sits second to the right of S. Two persons sit between R and the one who faces E. T sits left of R.",options:["Two", "One", "Three", "None", "None of these"],correct:2,explanation:"Correct option is (c) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47094,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate',text:"Who among the following doesn\u2019t sit at any of the extreme ends of the row? Study the following information carefully and answer the question given below: Ten people are sitting in two parallel rows containing five people each in such a way that there is an equal distance between adjacent persons. In row 1- A, B, C, D and E are sitting and all of them are facing the south. In row 2- P, Q, R, S and T are sitting and all of them are facing the north. The persons sit in row 1 face the persons sit in row 2 and vice versa. A sits third to the left of B. One person sits between A and the one who faces Q. Q sits second to the right of S. Two persons sit between R and the one who faces E. T sits left of R.",options:["P", "A", "S", "D", "E"],correct:3,explanation:"Correct option is (d) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47095,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate',text:"How many persons sit between E and the one who faces R? Study the following information carefully and answer the question given below: Ten people are sitting in two parallel rows containing five people each in such a way that there is an equal distance between adjacent persons. In row 1- A, B, C, D and E are sitting and all of them are facing the south. In row 2- P, Q, R, S and T are sitting and all of them are facing the north. The persons sit in row 1 face the persons sit in row 2 and vice versa. A sits third to the left of B. One person sits between A and the one who faces Q. Q sits second to the right of S. Two persons sit between R and the one who faces E. T sits left of R.",options:["Two", "One", "Three", "None", "None of these"],correct:0,explanation:"Correct option is (a) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47096,section:"Reasoning Ability",topic:"Puzzle (Seating)",difficulty:'Moderate',text:"Which among the following statement(s) is /are definitely true? I. D is the only neighbor of A II. More than three persons sit to the right of S III. No one sits to the left of E Study the following information carefully and answer the question given below: Ten people are sitting in two parallel rows containing five people each in such a way that there is an equal distance between adjacent persons. In row 1- A, B, C, D and E are sitting and all of them are facing the south. In row 2- P, Q, R, S and T are sitting and all of them are facing the north. The persons sit in row 1 face the persons sit in row 2 and vice versa. A sits third to the left of B. One person sits between A and the one who faces Q. Q sits second to the right of S. Two persons sit between R and the one who faces E. T sits left of R.",options:["Both I and II", "Both I and III", "Only III", "Only II", "All I, II and III"],correct:3,explanation:"Correct option is (d) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47097,section:"Reasoning Ability",topic:"Inequality",difficulty:'Moderate',text:"Statements: C \u2265 B \u2265 F = K = E \u2265 A < H \u2265 D Conclusions: I. A \u2264 C II. E > D In the following question, some statements are followed by some conclusions. Assuming the given statements to be true, find which of the two conclusions follow(s) the given statements and choose the appropriate answer choice.",options:["Only conclusion I is true", "Only conclusion II is true", "Either conclusion I or II is true", "Neither conclusion I nor II is true", "Both conclusions I and II are true"],correct:0,explanation:"Correct option is (a) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47098,section:"Reasoning Ability",topic:"Inequality",difficulty:'Moderate',text:"Statements: H > G \u2265 M > K \u2265 O < N \u2264 F Conclusions: I. H > O II. F \u2264 K In the following question, some statements are followed by some conclusions. Assuming the given statements to be true, find which of the two conclusions follow(s) the given statements and choose the appropriate answer choice.",options:["Only conclusion I is true", "Only conclusion II is true", "Either conclusion I or II is true", "Neither conclusion I nor II is true", "Both conclusions I and II are true"],correct:0,explanation:"Correct option is (a) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47099,section:"Reasoning Ability",topic:"Inequality",difficulty:'Moderate',text:"Statements: P \u2264 Q = R \u2265 S; W < T = U < S \u2265 V Conclusions: I. V \u2264 Q II. W < S In these questions, the relationship between different elements is shown in the statements. The statements are followed by two conclusions. Study the conclusions based on the given statements and select the appropriate answer:",options:["If only conclusion I is true", "If only conclusion II is true", "If either conclusion I or II is true", "If both conclusions I and II are true", "If neither conclusion I nor II is true"],correct:3,explanation:"Correct option is (d) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},
{id:47100,section:"Reasoning Ability",topic:"Coding/Number",difficulty:'Moderate',text:"In the given number \u201c68172439\u201d if the digits which are less than five are multiplied by 2 and the digits which are greater than five are subtracted by 1, then how many digits will repeat itself in the new number thus formed?",options:["None", "One", "Two", "Three", "More than three"],correct:2,explanation:"Correct option is (c) per the published solution key.",source_type:'official',source_reference:'SBI Clerk Pre Memory Based Paper (Backlog, 16 Sep 2026 S1)'},

{id:45001,setId:'set4',section:"English Language",topic:"Error Spotting",difficulty:'Moderate-Hard',text:"Find the part of the sentence that has an error (ignore punctuation); choose 'No error' if the sentence is correct. Yesterday I met (A)/ my friend who (B)/ is now a doctor (C)/ and a musician (D)/ No error (E).",options:["A", "B", "C", "D", "No error"],correct:3,explanation:"The error is in part (D). Explanation: When two or more nouns refer to the same person or thing, and they are connected by \"and,\" \"as well as,\" \"along with,\" or similar conjunctions, we use the article only before the first noun. The subsequent nouns do not require an article. In the given sentence, the friend is described as being both a doctor and a musician.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45002,setId:'set4',section:"English Language",topic:"Error Spotting",difficulty:'Moderate-Hard',text:"Find the part of the sentence that has an error (ignore punctuation); choose 'No error' if the sentence is correct. She is fond of (A)/hilly food as (B)/she lives in hilly areas (C)/ since her childhood (D)/ No error (E).",options:["A", "B", "C", "D", "No error"],correct:2,explanation:"The error in part (C) of the sentence is related to the tense inconsistency. Let's break down the grammatical rule: In the given sentence, the verb tense used is the present perfect continuous tense, which indicates an action that started in the past, continues in the present, and may continue into the future.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45003,setId:'set4',section:"English Language",topic:"Error Spotting",difficulty:'Moderate-Hard',text:"Find the part of the sentence that has an error (ignore punctuation); choose 'No error' if the sentence is correct. Despite of several disputes, (A)/ the couple decided to (B)/ live together for the (C)/rest of their lives (D)/ No error (E).",options:["A", "B", "C", "D", "No error"],correct:0,explanation:"The error is in part (A) of the sentence. The word \"of\" should be removed after \"Despite.\" The correct form is \"Despite several disputes.\" Therefore, the answer is (a) A. Explanation: The word \"despite\" is a preposition, and it is used to introduce a contrast or opposition between two things. It is followed by a noun or a pronoun, but it does not require the preposition \"of\" after it.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45004,setId:'set4',section:"English Language",topic:"Error Spotting",difficulty:'Moderate-Hard',text:"Find the part of the sentence that has an error (ignore punctuation); choose 'No error' if the sentence is correct. The university will (A)/ conduct exams (B)/after COVID-19 cases (C)/ will decline (D)/ No error (E).",options:["A", "B", "C", "D", "No error"],correct:3,explanation:"The error is in part (D) of the sentence. The verb form \"will decline\" should be changed to \"decline.\" The corrected sentence would be: \"The university will conduct exams after COVID-19 cases decline.\" Therefore, the answer is (d) D. Explanation: The sentence is discussing a future event (the university conducting exams) that is dependent on the occurrence of another event (COVID-19 cases declining).",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45005,setId:'set4',section:"English Language",topic:"Error Spotting",difficulty:'Moderate-Hard',text:"Find the part of the sentence that has an error (ignore punctuation); choose 'No error' if the sentence is correct. The G20 was created in (A)/ response to the financial (B)/ crises that arose in a (C)/ number of emerging economy (D)/ No error (E)",options:["A", "B", "C", "D", "No error"],correct:3,explanation:"The error is in part (D) of the sentence. \"economy\" should be changed to \"economies\" to match the plural form. The corrected sentence would be: \"The G20 was created in response to the financial crises that arose in a number of emerging economies.\" Therefore, the answer is (d) D. Explanation: The phrase \"a number of\" is followed by a plural noun. In this case, \"economies\" should be used instead of \"economy\" to match the plural form.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
{id:45006,setId:'set4',section:"English Language",topic:"Reading Comprehension",difficulty:'Moderate-Hard',text:"Read the passage and answer. Passage: The word \u2018tax\u2019 is derived from the Latin word taxare or taxo. It means \u2018to assess the worth of something\u2019. Taxes are imposed by government for the use and service of the State. They are levied and collected by the State for the purchase or sale of merchandise or a service. Taxes provide revenue to the state, and is therefore one of the most significant aspects of any system of administration by any form of government. The income tax as we know today was first introduced in India in 1860 by the British. It was introduced to compensate for the losses sustained by the government due to the rebellion of 1857. Income tax is defined as the annual charge levied on both earned income (wages, salaries or commission) and unearned income like dividends, interest or rent. In addition to financing a government\u2019s operations, progressive income taxation is designed to distribute wealth creation more evenly in a population and to serve as buffer in case of fluctuations in the economic cycle. The Income Tax Act was passed in India in 1886, and there have been constant revisions and refinements in the Act since then. After the first World War, a new Income Tax Act was passed, in 1918, again to counter the residual effects of economic devastation caused by the war. This income tax Act was in place till 1922, when it was replaced by another Act. After 40 years, and 15 years after India gained freedom from the British, the income tax Act was _______________again. The current Income Tax Act has been adopted in 1961, and bought into force with effect from April 1, 1962. It encompasses the whole of India. The Central Board of Revenue bifurcated and created a separate Board for Direct Taxes called as the Central Board of Direct Taxes under the aegis of Central Board of Revenue Act, 1963. Question: According to the passage, why does the government levy taxes?",options:["To keep the economy always in a profitable state.", "For controlling inflation through fiscal measures and its various policies.", "The government levies taxes in exchange for those services and means that states provide.", "To discourage the consumption of certain goods and services at a large scale.", "None of these"],correct:2,explanation:"To validate the answer, refer to the line of the first paragraph that mentions, \u201cTaxes are imposed by government for the use and service of the State.\u201d",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},

passage, why is the tax a crucial feature of all administration systems?",options:["Because the amount of tax collection signifies the growth of an economy.", "Owing to finance the military needs of people and the government.", "For the reason that the government provides tax exemptions to taxpayers.", "Because tax is a source of income for any state government.", "None of these"],correct:3,explanation:"To validate the answer, refer to the line of the first paragraph which mentions, \u201cTaxes provide revenue to the state, and is therefore one of the most significant aspects of any system of administration by any form of government.\u201d",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},

author, what was the motive behind introducing tax by the British people?",options:["To fund all government expenditure during the revolution held in 1857.", "To indemnify the losses suffered by the government caused by rebellion.", "To settle down all the differences of revolutionists by paying compensation.", "British government formed a tax regime to subsidize social schemes.", "None of these"],correct:1,explanation:"The correct choice can be inferred from the second paragraph which mentions, \u201cThe income tax as we know today was first introduced in India in 1860 by the British. It was introduced to compensate for the losses sustained by the government due to the rebellion of 1857. \u201c",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},

axation is framed in a way which ...............",options:["manages to increase the amount of direct and indirect tax collection.", "helps in surviving the fluctuations in the economic cycle.", "allows the allocation the wealth creation equally among people.", "Only (a) and (b)", "Only (b) and (c)"],correct:4,explanation:"Both option (b) and (c) are correct. Refer to lines which mentions, \u201cIn addition to financing a government\u2019s operations, progressive income taxation is designed to distribute wealth creation more evenly in a population and to serve as buffer in case of fluctuations in the economic cycle. \u201c 22 adda247.com/defence | www.sscadda.com | www.bankersadda.com | www.adda247.com",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},

{id:45011,setId:'set4',section:"English Language",topic:"Reading Comprehension",difficulty:'Moderate-Hard',text:"Read the passage and answer. Passage: The word \u2018tax\u2019 is derived from the Latin word taxare or taxo. It means \u2018to assess the worth of something\u2019. Taxes are imposed by government for the use and service of the State. They are levied and collected by the State for the purchase or sale of merchandise or a service. Taxes provide revenue to the state, and is therefore one of the most significant aspects of any system of administration by any form of government. The income tax as we know today was first introduced in India in 1860 by the British. It was introduced to compensate for the losses sustained by the government due to the rebellion of 1857. Income tax is defined as the annual charge levied on both earned income (wages, salaries or commission) and unearned income like dividends, interest or rent. In addition to financing a government\u2019s operations, progressive income taxation is designed to distribute wealth creation more evenly in a population and to serve as buffer in case of fluctuations in the economic cycle. The Income Tax Act was passed in India in 1886, and there have been constant revisions and refinements in the Act since then. After the first World War, a new Income Tax Act was passed, in 1918, again to counter the residual effects of economic devastation caused by the war. This income tax Act was in place till 1922, when it was replaced by another Act. After 40 years, and 15 years after India gained freedom from the British, the income tax Act was _______________again. The current Income Tax Act has been adopted in 1961, and bought into force with effect from April 1, 1962. It encompasses the whole of India. The Central Board of Revenue bifurcated and created a separate Board for Direct Taxes called as the Central Board of Direct Taxes under the aegis of Central Board of Revenue Act, 1963. Question: Which of the following words will be the most suitable word for the blank given in the passage?",options:["reset", "forbade", "accelerated", "modified", "subsided"],correct:3,explanation:"The correct word for the given blank is \u2018modified\u2019. (a) reset: set again or differently. (b) forbade: refuse to allow (something). (c) accelerated: (especially of a vehicle) begin to move more quickly. (d) modified: make partial or minor changes to (something). (e) subsided: become less intense, violent, or severe.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},

ng word is a synonym of \u2018sustained\u2019 as highlighted in the passage?",options:["persisted", "affiliated", "rendered", "portend", "intermittent"],correct:0,explanation:"\u2018Persisted\u2019 is a synonym of \u2018sustained\u2019. (a) persisted: continue to exist; be prolonged. (b) affiliated: officially attached or connected to an organization (c) rendered: provide or give (a service, help, etc.). (d) portend: be a sign or warning that (something, especially something momentous or calamitous) is likely to happen. (e) intermittent: occurring at irregular intervals; not continuous or steady.",source_type:'official',source_reference:'NIACL AO Prelims Previous Year Paper 2023'},
